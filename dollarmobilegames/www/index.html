<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dollar Arcade</title>
<style>
  :root{--bg:#f6f1e7;--ink:#2b2622;--muted:#7a6f66;--card:#fffdf8;--line:#e6dccb;--accent:#e2553f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
  body{padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
  header{display:flex;align-items:baseline;justify-content:space-between;margin:8px 4px 18px}
  h1{font-size:30px;margin:0;letter-spacing:-.5px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:14px;margin:-10px 4px 18px}
  .shelf{display:grid;gap:12px}
  .card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;cursor:pointer}
  .card img{width:76px;height:76px;border-radius:18px;flex:none;background:#ddd}
  .meta{flex:1;min-width:0}
  .name{font-weight:800;font-size:18px}
  .tag{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.3}
  .new{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;color:#fff;background:var(--accent);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
  .btn{flex:none;border:0;border-radius:14px;padding:9px 14px;font:800 15px ui-rounded,system-ui,sans-serif;background:var(--ink);color:#fff;min-width:72px}
  .btn.buy{background:var(--accent)}
  .btn[disabled]{opacity:.5}
  footer{margin-top:26px;text-align:center}
  .link{background:none;border:0;color:var(--muted);font:600 14px ui-rounded,system-ui,sans-serif;text-decoration:underline;padding:10px}
  .note{color:var(--muted);font-size:12px;margin-top:6px}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
  #toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>Dollar <span>Arcade</span></h1></header>
<p class="sub">Small games, one dollar each. New ones twice a week.</p>
<main class="shelf" id="shelf"></main>
<footer>
  <button class="link" id="restore">Restore Purchases</button>
  <div class="note" id="mode"></div>
</footer>
<div id="toast"></div>
<script src="arcade.js"></script>
</body>
</html>
