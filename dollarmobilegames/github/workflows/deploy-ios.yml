name: App Store deploy
# Tuesday and Sunday at ~7:07am Detroit time: if new games landed since the last release,
# build the iOS app, create their $0.99 in-app purchases, upload, and submit for review.
on:
  schedule:
    - cron: "7 11 * * 0,2"   # 7:07am EDT
    - cron: "7 12 * * 0,2"   # 7:07am EST
  workflow_dispatch:
    inputs:
      force:
        description: "Ship even if no new games (e.g. a fix)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: { group: app-store-deploy, cancel-in-progress: false }

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
      first: ${{ steps.decide.outputs.first }}
      new_slugs: ${{ steps.decide.outputs.new_slugs }}
      version: ${{ steps.decide.outputs.version }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Decide whether to ship
        id: decide
        run: |
          say() { echo "$1"; echo "$1" >> $GITHUB_STEP_SUMMARY; }
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(TZ=America/Detroit date +%H)" != "07" ]; then echo "go=false" >> $GITHUB_OUTPUT; exit 0; fi
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "${{ secrets.TEAM_ID }}" ]; then
            say "App Store secrets are not set yet (see SETUP.md). Nothing shipped."; echo "go=false" >> $GITHUB_OUTPUT; exit 0; fi
          node scripts/validate.mjs || { say "Validation failed; not shipping."; exit 1; }
          NEW=$(node -e "const g=require('./www/games.json'),r=require('./data/releases.json');console.log(g.filter(x=>!r.released.includes(x.slug)).map(x=>x.slug).join(','))")
          FIRST=$(node -e "console.log(require('./data/releases.json').history.length?0:1)")
          N=$(node -e "console.log(require('./data/releases.json').history.length)")
          echo "new_slugs=$NEW" >> $GITHUB_OUTPUT; echo "first=$FIRST" >> $GITHUB_OUTPUT; echo "version=1.$N" >> $GITHUB_OUTPUT
          if [ -z "$NEW" ] && [ "${{ inputs.force }}" != "true" ]; then say "No new games since the last release. Nothing to ship."; echo "go=false" >> $GITHUB_OUTPUT; exit 0; fi
          node scripts/asc.mjs status > status.json || { say "Could not reach App Store Connect: $(cat status.json)"; exit 1; }
          if grep -q '"live":false' <(sed 's/"hasLiveVersion"/"live"/' status.json) && [ "$FIRST" = "0" ] && ! grep -q '"busy":true' status.json; then
            say "Version 1.0 is uploaded but waiting for you to finish SETUP.md step 6 and press Submit in App Store Connect. New games will ship after that."; echo "go=false" >> $GITHUB_OUTPUT; exit 0; fi
          if grep -q '"busy":true' status.json; then say "A version is still in Apple review. New games roll into the next deploy."; echo "go=false" >> $GITHUB_OUTPUT; exit 0; fi
          say "Shipping version 1.$N with new games: $NEW"; echo "go=true" >> $GITHUB_OUTPUT

  ship:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APP_VERSION: ${{ needs.gate.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}${{ github.run_attempt }}
      FIRST_RELEASE: ${{ needs.gate.outputs.first }}
      NEW_SLUGS: ${{ needs.gate.outputs.new_slugs }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: npm ci || npm install
      - name: Generate iOS project
        run: |
          npx cap add ios
          npx @capacitor/assets generate --ios --iconBackgroundColor '#e2553f' --splashBackgroundColor '#f6f1e7'
          node scripts/configure-ios.mjs
          npx cap sync ios
      - name: API key file
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          if echo "$ASC_KEY_P8" | grep -q BEGIN; then echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8; else echo "$ASC_KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8; fi
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" >> $GITHUB_ENV
      - name: Create in-app purchases for new games
        run: node scripts/asc.mjs ensure-iaps
      - name: Store metadata
        run: node scripts/release-notes.mjs
      - name: Build, upload, submit
        run: fastlane release
      - name: Submit in-app purchases
        run: node scripts/asc.mjs submit-iaps
      - name: Record release
        if: success()
        run: |
          node -e "
            const fs=require('fs');const r=require('./data/releases.json');const g=require('./www/games.json');
            const fresh=process.env.NEW_SLUGS.split(',').filter(Boolean);
            r.released=[...new Set([...r.released,...g.map(x=>x.slug)])];
            r.history.push({version:process.env.APP_VERSION,build:process.env.BUILD_NUMBER,date:new Date().toISOString().slice(0,10),games:fresh,submitted:process.env.FIRST_RELEASE!=='1'});
            fs.writeFileSync('data/releases.json',JSON.stringify(r,null,2)+'\n');"
          git config user.name "dollar-arcade-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/releases.json; git commit -m "Release $APP_VERSION ($BUILD_NUMBER): ${NEW_SLUGS:-fixes}"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          if [ "$FIRST_RELEASE" = "1" ]; then echo "First release uploaded but NOT submitted. Finish the one-time steps in SETUP.md (step 6), then press Submit in App Store Connect." >> $GITHUB_STEP_SUMMARY; else echo "Version $APP_VERSION submitted to Apple review; it goes live automatically once approved." >> $GITHUB_STEP_SUMMARY; fi
