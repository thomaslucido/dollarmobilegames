name: App Store deploy
# Sunday ~7:07am Detroit time: build the queued game as its own $0.99 app, upload it with its
# listing and screenshots, and submit it for review (released automatically once approved).
on:
  schedule:
    - cron: "7 11 * * 0"   # 7:07am EDT
    - cron: "7 12 * * 0"   # 7:07am EST
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: { group: app-store-deploy, cancel-in-progress: false }

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
      slug: ${{ steps.next.outputs.slug }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Which game is next
        id: next
        run: node scripts/next-release.mjs
      - name: Decide whether to ship
        id: decide
        env:
          SLUG: ${{ steps.next.outputs.slug }}
          EVENT: ${{ github.event_name }}
        run: |
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          no() { say "$1"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$(TZ=America/Detroit date +%H)" != "07" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ -z "$SLUG" ] && no "Nothing queued this week. Saturday's build night picks the next game."
          { [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$TEAM_ID" ]; } && no "App Store secrets are not set yet (SETUP.md). Nothing shipped."
          node scripts/validate.mjs || { say "Validation failed; not shipping."; exit 1; }
          node scripts/asc.mjs register "$SLUG"
          node scripts/asc.mjs app "$SLUG" > app.json
          grep -q '"exists":false' app.json && no "The App Store Connect record for $SLUG doesn't exist yet. Do the checklist in the open GitHub issue, then run this workflow from the Actions tab (Run workflow)."
          grep -q '"busy":true' app.json && no "$SLUG already has a version in review."
          say "Shipping $SLUG"; echo "go=true" >> "$GITHUB_OUTPUT"

  ship:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      SLUG: ${{ needs.gate.outputs.slug }}
      APP_VERSION: "1.0"
      BUILD_NUMBER: ${{ github.run_number }}${{ github.run_attempt }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Use the newest Xcode (Apple requires the latest iOS SDK for uploads)
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Selecting $XC"; sudo xcode-select -s "$XC"; xcodebuild -version
      - name: Install
        run: npm ci || npm install
      - name: Stage the game as its own app
        run: node scripts/stage-app.mjs "$SLUG"
      - name: Generate iOS project
        run: |
          npx cap add ios
          npx @capacitor/assets generate --ios
          node scripts/configure-ios.mjs
          npx cap sync ios
      - name: API key file
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          if echo "$ASC_KEY_P8" | grep -q BEGIN; then echo "$ASC_KEY_P8" > "$KEY"; else echo "$ASC_KEY_P8" | base64 --decode > "$KEY"; fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: App record details
        run: node scripts/asc.mjs prepare "$SLUG"
      - name: Build, upload, submit for review
        run: fastlane release
      - name: Record release
        run: |
          node scripts/next-release.mjs --record
          git config user.name "dollar-games-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/ship-queue.json data/releases.json www/games.json
          git commit -m "Submitted $APP_NAME ($SLUG) to the App Store"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          for n in $(gh issue list --state open --search "Action needed: set up $APP_NAME in:title" --json number --jq '.[].number'); do gh issue close "$n" --comment "Submitted to Apple review. It goes live automatically once approved."; done
          echo "$APP_NAME submitted to Apple review; it goes live automatically once approved (usually 1 to 2 days)." >> "$GITHUB_STEP_SUMMARY"
