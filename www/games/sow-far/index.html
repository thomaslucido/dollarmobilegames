<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4f0e6">
<title>Sow Far</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f4f0e6;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
  #sa{position:fixed;left:0;top:0;width:1px;height:env(safe-area-inset-top,0px);pointer-events:none;visibility:hidden}
  #sb{position:fixed;left:0;bottom:0;width:1px;height:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="sa"></div><div id="sb"></div>
<script src="../../shared/game-kit.js"></script>
<script>
(function () {
  'use strict';
  const kit = GameKit.init({ slug: 'sow-far', backColor: '#f4f0e6' });
  const cv = document.getElementById('c');
  const INK = { paper: '#f4f0e6', pink: '#ff48b0', pinkT: '#ffc0e2', green: '#00a95c', greenT: '#a6e0c0', dark: '#123c42', speck: '#d9d2c1' };
  const FAM = '"Avenir Next Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",sans-serif';
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const eo = (t) => 1 - Math.pow(1 - t, 3);
  const eio = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  let W = 390, H = 844, DPR = 1, GY = 557, SLAB = 641, ST = 0, SB = 0;
  const ctx = cv.getContext('2d');
  let PAT = {}, GRAIN = null, FONT_PREFIX = '800 ';

  // ---------- canvas, patterns ----------
  function dotTile(r, col, grid) {
    const n = Math.max(2, Math.round(grid * DPR));
    const c = document.createElement('canvas'); c.width = c.height = n;
    const g = c.getContext('2d'); const k = n / grid; g.scale(k, k);
    g.fillStyle = col; g.beginPath(); g.arc(grid / 2, grid / 2, r, 0, TAU); g.fill();
    const p = ctx.createPattern(c, 'repeat');
    try { p.setTransform(new DOMMatrix([1 / k, 0, 0, 1 / k, 0, 0])); } catch (e) {}
    return p;
  }
  function buildPatterns() {
    PAT = {
      pink1: dotTile(1, INK.pink, 7), pink2: dotTile(2, INK.pink, 7), pink3: dotTile(3, INK.pink, 7),
      dark1: dotTile(1, INK.dark, 7), dark2: dotTile(2, INK.dark, 7), dark3: dotTile(3, INK.dark, 7),
      green2: dotTile(2, INK.green, 7)
    };
    if (!GRAIN) {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const g = c.getContext('2d'); const id = g.createImageData(128, 128);
      for (let i = 0; i < 128 * 128; i++) {
        const r = Math.random(), o = i * 4;
        if (r < 0.06) { id.data[o] = 0xd9; id.data[o + 1] = 0xd2; id.data[o + 2] = 0xc1; id.data[o + 3] = 120 + Math.random() * 135; }
        else if (r < 0.072) { id.data[o] = 0x12; id.data[o + 1] = 0x3c; id.data[o + 2] = 0x42; id.data[o + 3] = 30 + Math.random() * 40; }
      }
      g.putImageData(id, 0, 0);
      GRAIN = ctx.createPattern(c, 'repeat');
    }
  }
  function onResize(s) {
    W = s.w; H = s.h; DPR = s.dpr;
    GY = Math.round(H * 0.66); SLAB = Math.round(H * 0.76);
    ST = (document.getElementById('sa').getBoundingClientRect().height) || 0;
    SB = (document.getElementById('sb').getBoundingClientRect().height) || 0;
    buildPatterns();
  }
  kit.fitCanvas(cv, onResize);
  ctx.font = 'condensed 800 10px ' + FAM;
  if (/condensed/.test(ctx.font)) FONT_PREFIX = 'condensed 800 ';
  const fontStr = (px) => FONT_PREFIX + Math.round(px) + 'px ' + FAM;
  const hasLS = 'letterSpacing' in ctx;

  // ---------- saved progress ----------
  const asObj = (v) => (v && typeof v === 'object' ? v : {});
  let best = kit.best() | 0;
  let bank = Math.max(0, Number(kit.get('bank', 0)) || 0);
  let plots = asObj(kit.get('plots', {}));      // { plotIndex: level }
  let picked = asObj(kit.get('picked', {}));    // { plotIndex: ms timestamp berries were last picked }
  let hints = asObj(kit.get('hints', {}));      // { ran, hold, crow, plant }
  function saveMeta() {
    kit.set('bank', bank); kit.set('plots', plots); kit.set('picked', picked); kit.set('hints', hints); kit.set('seen', Date.now());
  }

  // ---------- course: fixed, seeded, the same every run ----------
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const speedAt = (d) => Math.min(11.5, 6 + 0.01 * Math.max(0, d));
  const isChasmPlot = (i) => i >= 9 && (i - 9) % 7 === 0;
  function plotType(i) {
    const P = 40 * i;
    if (isChasmPlot(i)) return 'bridge';
    if (P % 200 === 0) return 'tree';
    if (i % 3 === 2 && P >= 140) return 'mush';
    return 'berry';
  }
  const PL = {
    berry: { name: 'BERRY BUSH', cost: [20, 50, 110], seeds: [3, 6, 10], cap: [5, 10, 15] },
    mush: { name: 'SPRING MUSHROOM', cost: [35, 80] },
    bridge: { name: 'VINE BRIDGE', cost: [60, 130] },
    tree: { name: 'HEARTFRUIT TREE', cost: [90, 200] }
  };
  const lvOf = (i) => plots[i] | 0;
  const maxLv = (i) => PL[plotType(i)].cost.length;
  const maxPlot = () => Math.floor((Math.max(best, 40) + 40) / 40);
  const nextCost = (i) => (lvOf(i) < maxLv(i) ? PL[plotType(i)].cost[lvOf(i)] : 0);
  function storedBerries(i, now) {
    const lv = lvOf(i); if (!lv || plotType(i) !== 'berry') return 0;
    const t0 = picked[i] || now;
    return Math.min(PL.berry.cap[lv - 1], Math.max(0, Math.floor((now - t0) / 240000)));
  }

  const HZ = [];   // hazards, sorted by a: {k, a, b, h, x0?, plot?}
  const SD = [];   // course seeds {x, y}
  let PS = [];     // seeds hung by plants {x, y}
  const R = mulberry32(551);
  let genCur = 0, nextBlock = 1, prevEnd = 0, gid = 0;
  function blockOf(i) {
    const P = 40 * i, t = plotType(i);
    if (t === 'bridge') return [P - 3, P + 20, true];
    if (t === 'mush') return [P - 3, P + 5.8, true];
    return [P - 3, P + 3, false];
  }
  function pickType(d) {
    const w = d < 150 ? [60, 40, 0, 0, 0, 0] : d < 400 ? [40, 30, 30, 0, 0, 0] : d < 700 ? [30, 25, 30, 15, 0, 0] : d < 1000 ? [25, 20, 25, 15, 15, 0] : [20, 20, 20, 15, 15, 10];
    let r = R() * 100;
    for (let k = 0; k < 6; k++) { r -= w[k]; if (r < 0) return k; }
    return 0;
  }
  function makeHazard(type, a) {
    const s = speedAt(a), g = ++gid;
    if (type === 0) { const L = 1.2 + 0.15 * s + (R() * 0.6 - 0.3); return [{ k: 'bramble', a, b: a + L, h: 0.6, g }]; }
    if (type === 1) { const w = (0.45 + R() * 0.25) * 0.93 * s; return [{ k: 'pit', a, b: a + w, h: 0, g }]; }
    if (type === 2) return [{ k: 'stump', a, b: a + 0.8, h: 1.9, g }];
    if (type === 3) return [{ k: 'crow', a, b: a + 5, x0: a + 4, h: 2.1, g }];
    if (type === 4) { const L = 1.0 + 0.1 * s, w = (0.3 + R() * 0.1) * 0.93 * s; return [{ k: 'bramble', a, b: a + L, h: 0.6, g }, { k: 'pit', a: a + L + 3, b: a + L + 3 + w, h: 0, g }]; }
    const w = (0.35 + R() * 0.2) * 0.93 * s;
    return [{ k: 'pit', a, b: a + w, h: 0, g }, { k: 'stump', a: a + w, b: a + w + 0.8, h: 1.9, g }];
  }
  function gapSeeds(from, to) {
    if (to - from < 12) return;
    const m = (from + to) / 2;
    for (let k = -2; k <= 2; k++) SD.push({ x: m + k * 1.1, y: 0.5 });
  }
  function arcSeeds(parts) {
    const first = parts[0], last = parts[parts.length - 1], s = speedAt(first.a);
    if (first.k === 'crow') { const mx = first.x0 - 28 / (s + 2); for (let k = 0; k < 4; k++) SD.push({ x: mx - 1.5 + k, y: 0.5 }); return; }
    const tall = parts.some((p) => p.k === 'stump');
    const apex = tall ? 2.94 : 1.67, half = (tall ? 0.93 : 0.67) * s / 2;
    const m = tall ? (last.a + last.b) / 2 - 0.4 : (first.a + first.b) / 2;
    for (let k = 0; k < 4; k++) { const f = (k - 1.5) / 2.5; SD.push({ x: m + f * half, y: 0.5 + apex * (1 - f * f) }); }
  }
  function genCourse(X) {
    let grew = false;
    while (genCur < X) {
      grew = true;
      const [bs, be, fixed] = blockOf(nextBlock);
      const sp = Math.max(8, 18 - 0.0065 * genCur) + R() * 4;
      let a = genCur + sp;
      const parts = makeHazard(pickType(a), a);
      let end = parts[parts.length - 1].b;
      if (end + 1.5 > bs) {
        // the plot (and its chasm or stump) comes first; the hazard moves past it
        const i = nextBlock, P = 40 * i, t = plotType(i);
        if (t === 'bridge') { gapSeeds(prevEnd, P + 6); HZ.push({ k: 'chasm', a: P + 6, b: P + 20, h: 0, plot: i, g: ++gid }); prevEnd = P + 20; }
        if (t === 'mush') { gapSeeds(prevEnd, P + 5); HZ.push({ k: 'stump', a: P + 5, b: P + 5.8, h: 1.9, plot: i, g: ++gid }); prevEnd = P + 5.8; }
        nextBlock++;
        const minA = fixed ? prevEnd + sp : be + 1 + R() * 2;
        if (a < minA) { const d = minA - a; for (const p of parts) { p.a += d; p.b += d; if (p.x0) p.x0 += d; } a = minA; end += d; }
        if (end + 1.5 > blockOf(nextBlock)[0]) { if (fixed) genCur = prevEnd; continue; }
      }
      gapSeeds(prevEnd, a);
      for (const p of parts) HZ.push(p);
      if (R() < 0.35) arcSeeds(parts);
      genCur = end; prevEnd = end;
    }
    if (grew) SD.sort((p, q) => p.x - q.x);
  }
  genCourse(1200);
  function lowerBound(arr, x) { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m].x < x) lo = m + 1; else hi = m; } return lo; }
  function hzFrom(x) { let lo = 0, hi = HZ.length; while (lo < hi) { const m = (lo + hi) >> 1; if (HZ[m].a < x) lo = m + 1; else hi = m; } return lo; }

  function buildPlantSeeds() {
    PS = [];
    for (const key in plots) {
      const i = +key, lv = plots[key] | 0, t = plotType(i), P = 40 * i;
      if (t === 'mush' && lv >= 2) { const s = speedAt(P); for (let j = 0; j < 6; j++) { const tt = 0.467 + (j - 2.5) * 0.085; PS.push({ x: P - 0.45 + s * tt, y: 14 * tt - 15 * tt * tt + 0.5 }); } }
      if (t === 'bridge' && lv >= 2) { for (let j = 0; j < 8; j++) PS.push({ x: P + 7 + j * (12 / 7), y: 0.5 }); }
    }
    PS.sort((p, q) => p.x - q.x);
  }
  buildPlantSeeds();

  // ---------- state ----------
  const S = {
    mode: 'title', t: 0, runId: 0, hearts: 3, seeds: 0, shown: 0, pop: 0, heartPop: 0, maxX: 0, dist: 0, inv: 0,
    shakeT: 0, shakeA: 0, dying: -1, dieVx: 0, intro: 0, overT: 0, newBest: false, gained: 0, deathX: 0,
    rescue: null, hat: null, card: null, nextPlot: 1, hzLo: 0, legPh: 0, sproutAcc: 0, sq: null,
    passedBest: false, camFrom: { x: 0, ppm: 30 }, demoPlanted: false, seedNote: 0, seedNoteT: -9, pickedRun: {}, mushT: {}, stamp: null, startBest: 0
  };
  const B = { x: 0, y: 0, vy: 0, ground: true, airT: 1, boost: false, coy: 0, buf: 0, fall: false, hole: null, rot: 0, lastMush: 0 };
  const cam = { x: 0, ppm: 30 };
  const G = { x: 0, vel: 0 };
  let held = false, autopilot = false, T = 0, farOff = 0, midOff = 0, lastCamX = null, lastCamPPM = 0;
  let worldFx = [], flyers = [], floats = [], sprouts = [];
  const AP = { plan: null, press: 0, think: 0 };

  const gardenPPM = () => 0.6 * Math.min(W / 11, H / 20);
  const playPPM = (spd) => Math.min(W / (11 + 4.5 * (spd - 6) / 5.5), H / 20);
  function clampG(x) {
    const vw = W / gardenPPM();
    const hi = Math.max((maxPlot() + 1) * 40 + 8, S.deathX + 10) - vw * 0.5;
    return clamp(x, -vw * 0.3, hi);
  }
  G.x = -0.22 * W / gardenPPM();
  const X = (x) => (x - cam.x) * cam.ppm;
  const Y = (y) => GY - y * cam.ppm;

  // ---------- body physics (shared by the game and the autopilot's look-ahead) ----------
  const bridged = (i) => lvOf(i) >= 1;
  function holeAt(x) {
    for (let i = S.hzLo; i < HZ.length; i++) {
      const h = HZ[i]; if (h.a > x + 1) break;
      if ((h.k === 'pit' || (h.k === 'chasm' && !bridged(h.plot))) && x - 0.15 > h.a && x + 0.15 < h.b) return h;
    }
    return null;
  }
  function mushAt(x) {
    const i = Math.round(x / 40); if (i < 1) return 0;
    if (Math.abs(x - 40 * i) < 0.45 && plotType(i) === 'mush' && lvOf(i) >= 1) return i;
    return 0;
  }
  const crowX = (h, rx) => h.x0 - 2 * Math.max(0, rx - (h.x0 - 14)) / speedAt(h.x0);
  function hitAt(b) {
    if (b.fall) return null;
    const l = b.x - 0.25, r = b.x + 0.25, y0 = b.y, y1 = b.y + 0.95;
    for (let i = S.hzLo; i < HZ.length; i++) {
      const h = HZ[i]; if (h.a > r + 1) break;
      if (h.hitRun === S.runId) continue;
      if (h.k === 'bramble') { if (r > h.a + 0.1 && l < h.b - 0.1 && y0 < 0.5) return h; }
      else if (h.k === 'stump') { if (r > h.a + 0.05 && l < h.b - 0.05 && y0 < 1.85) return h; }
      else if (h.k === 'crow') { const cx = crowX(h, b.x); if (r > cx - 0.4 && l < cx + 0.4 && y1 > 1.55 && y0 < 2.05) return h; }
    }
    return null;
  }
  // events: 1 jump, 2 land, 4 bounce, 8 fell
  function stepBody(b, dt, hold, spd) {
    let ev = 0;
    b.buf -= dt; b.coy -= dt;
    if (b.fall) {
      b.vy -= 30 * dt; b.y += b.vy * dt;
      b.x = Math.min(b.x + spd * dt * 0.25, b.hole.b - 0.3);
      if (b.y < -0.8) ev |= 8;
      return ev;
    }
    b.x += spd * dt;
    if (b.ground) {
      const m = mushAt(b.x);
      if (m) { b.ground = false; b.vy = 14; b.airT = 0; b.boost = false; b.lastMush = m; ev |= 4; }
      else if (holeAt(b.x)) { b.ground = false; b.vy = 0; b.coy = 0.08; b.airT = 1; b.boost = false; }
    }
    if (b.buf > 0 && (b.ground || b.coy > 0)) { b.ground = false; b.vy = 10; b.airT = 0; b.boost = hold; b.buf = 0; b.coy = 0; ev |= 1; }
    if (!b.ground) {
      if (!hold) b.boost = false;
      const g = (b.boost && b.vy > 0 && b.airT < 0.25) ? 12 : 30;
      b.vy -= g * dt; b.y += b.vy * dt; b.airT += dt;
      if (b.y <= 0 && b.vy <= 0) {
        const h = holeAt(b.x);
        if (!h) {
          const m = mushAt(b.x);
          if (m) { b.vy = 14; b.y = 0; b.airT = 0; b.boost = false; b.lastMush = m; ev |= 4; }
          else { b.y = 0; b.vy = 0; b.ground = true; ev |= 2; }
        } else if (b.y < -0.25 && b.coy <= 0) { b.fall = true; b.hole = h; }
      }
    }
    return ev;
  }
  const copyB = (b) => ({ x: b.x, y: b.y, vy: b.vy, ground: b.ground, airT: b.airT, boost: b.boost, coy: b.coy, buf: b.buf, fall: b.fall, hole: b.hole, lastMush: 0 });

  // ---------- autopilot: simulates candidate jumps along the fixed course ----------
  function apTry(x0, hold) {
    const b = copyB(B); let pressed = false, pt = 0, landedAt = -1;
    for (let n = 0; n < 200; n++) {
      let h = false;
      if (!pressed && b.x >= x0 && b.ground) { pressed = true; b.buf = 0.1; }
      if (pressed) { h = pt < hold; pt += 1 / 60; }
      stepBody(b, 1 / 60, h, speedAt(b.x));
      if (b.fall || hitAt(b)) return false;
      if (pressed && pt > 0.1 && b.ground) { if (landedAt < 0) landedAt = b.x; if (b.x > landedAt + 0.6) return true; }
      if (!pressed && b.x > x0 + 1) return false;
    }
    return false;
  }
  function apPlan() {
    const b = copyB(B); let danger = -1;
    for (let n = 0; n < 150; n++) {
      stepBody(b, 1 / 60, false, speedAt(b.x));
      if (b.fall || hitAt(b)) { danger = b.x; break; }
      if (b.x > B.x + 14) break;
    }
    if (danger < 0) return null;
    let plan = null, bestScore = -1;
    for (const hold of [0.02, 0.1, 0.18, 0.26]) {
      let rs = -1, bs = -1, bl = 0;
      for (let x0 = B.x; x0 <= danger + 0.01; x0 += 0.15) {
        if (apTry(x0, hold)) { if (rs < 0) rs = x0; const len = x0 - rs + 0.15; if (len > bl) { bl = len; bs = rs; } }
        else rs = -1;
      }
      if (bl > 0) { const sc = bl - hold * 2; if (sc > bestScore) { bestScore = sc; plan = { x0: bs + bl / 2 - 0.075, hold }; } }
    }
    return plan || { x0: danger - 0.8, hold: 0.26 };
  }
  function apUpdate(dt) {
    if (AP.press > 0) { AP.press -= dt; held = AP.press > 0; return; }
    held = false;
    if (!B.ground) { AP.plan = null; return; }
    AP.think -= dt;
    if (!AP.plan || AP.think <= 0) { AP.plan = apPlan(); AP.think = 0.12; }
    if (AP.plan && B.x >= AP.plan.x0 - 0.01) { B.buf = 0.1; held = true; AP.press = AP.plan.hold; AP.plan = null; }
  }

  // ---------- sound ----------
  const snd = (f, d, type, v) => GameKit.sound(f, d, type, v);
  const seq = (fs, step, type, v, d) => fs.forEach((f, k) => setTimeout(() => snd(f, d, type, v), k * step));
  const PENTA = [880, 988, 1175, 1319, 1568, 1760, 1976, 2349, 2637];

  // ---------- run lifecycle ----------
  function startRun() {
    S.camFrom = { x: cam.x, ppm: cam.ppm };
    S.mode = 'play'; S.runId++; S.intro = 0.5;
    Object.assign(B, { x: 0, y: 0, vy: 0, ground: true, airT: 1, boost: false, coy: 0, buf: 0, fall: false, hole: null, rot: 0, lastMush: 0 });
    Object.assign(S, { hearts: 3, seeds: 0, shown: 0, pop: 0, heartPop: 0, maxX: 0, inv: 0, dying: -1, rescue: null, hat: null, card: null, nextPlot: 1, hzLo: 0, sproutAcc: 0, sq: null, passedBest: false, pickedRun: {}, mushT: {}, startBest: best });
    worldFx = []; flyers = []; floats = []; sprouts = [];
    AP.plan = null; AP.press = 0; held = false;
    if (!hints.ran) { hints.ran = 1; saveMeta(); }
    kit.buzz();
    seq([523, 659], 70, 'triangle', 0.04, 0.08);
  }
  function shake(a, t) { S.shakeA = a; S.shakeT = t; }
  function onHit() {
    S.hearts--; S.inv = 1.2; S.heartPop = 1; shake(6, 0.2);
    snd(110, 0.06, 'square', 0.07); kit.buzz();
    for (let k = 0; k < 6; k++) worldFx.push({ k: 'dust', x: B.x, y: B.y + 0.6, vx: (Math.random() - 0.3) * 4, vy: Math.random() * 4, t: 0, life: 0.45, c: INK.dark });
    if (S.hearts <= 0) die();
  }
  function onFall() {
    if (S.inv <= 0) { S.hearts--; S.heartPop = 1; snd(110, 0.06, 'square', 0.06); kit.buzz(); }
    if (S.hearts <= 0) { die(); return; }
    const h = B.hole; let lx = h.b + 0.5;
    for (let i = hzFrom(h.a - 15); i < HZ.length; i++) {
      const z = HZ[i]; if (z.a > lx + 0.6) break;
      if (z === h || z.k === 'crow') continue;
      if (z.b > lx - 0.6 && z.a < lx + 0.6) lx = z.b + 0.6;
    }
    S.rescue = { t: 0, x0: B.x, y0: B.y, x1: lx };
    B.fall = false; B.hole = null;
    seq([660, 990], 120, 'triangle', 0.05, 0.1);
  }
  function die() {
    S.dying = 0.6; S.deathX = B.x; S.rescue = null;
    S.hat = { x: B.x, y: Math.max(0, B.y) + 1.0, vx: -1.5, vy: 7, r: 0, vr: -11, rest: false };
    if (!B.fall) { B.vy = 5; B.ground = false; S.dieVx = 3; }
    shake(8, 0.3);
    seq([392, 330, 262], 140, 'triangle', 0.06, 0.14); kit.buzz('heavy');
  }
  function toOver() {
    S.dying = -1; S.mode = 'over'; S.overT = 0; S.demoPlanted = false;
    const d = Math.floor(S.maxX); S.dist = d;

  // ---------- plants ----------

  // ---------- garden overlay: stakes and tag card ----------

  }
  function effect(t, lv) {
    if (t === 'berry') return `BURSTS ${PL.berry.seeds[lv - 1]} SEEDS AS YOU PASS, PLUS UP TO ${PL.berry.cap[lv - 1]} MORE THAT RIPEN WHILE YOU ARE AWAY.`;
    if (t === 'mush') return lv === 1 ? 'BOUNCES YOU HIGH OVER THE STUMP JUST AHEAD.' : 'ADDS AN ARC OF 6 SEEDS AT THE TOP OF THE BOUNCE.';
    if (t === 'bridge') return lv === 1 ? 'SPANS THE CHASM AHEAD SO YOU RUN RIGHT ACROSS.' : 'HANGS 8 SEEDS ALONG THE BRIDGE.';
    return lv === 1 ? 'GIVES BACK 1 HEART AS YOU PASS.' : 'GIVES BACK 2 HEARTS AS YOU PASS.';
  }
  function drawCard() {
    const c = cardRect(), i = S.card.i, t = plotType(i), lv = lvOf(i), mx = maxLv(i), locked = i > maxPlot(), full = lv >= mx;
    const cost = full ? 0 : PL[t].cost[lv], afford = !locked && !full && bank >= cost;
    const k = Math.min(1, S.card.t / 0.12), sc = 0.9 + 0.1 * eo(k);
    const nx = S.card.nope ? Math.sin(S.card.nope * 60) * 5 * (S.card.nope / 0.3) : 0;
    // string to the stake
    ctx.strokeStyle = INK.dark; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(c.sx, GY + 16); ctx.lineTo(clamp(c.sx, c.x + 20, c.x + c.w - 20), c.y + c.h); ctx.stroke();
    ctx.save(); ctx.translate(c.x + c.w / 2 + nx, c.y + c.h); ctx.scale(sc, sc); ctx.rotate(-0.012); ctx.translate(-c.w / 2, -c.h);
    ctx.fillStyle = INK.paper; ctx.strokeStyle = INK.dark; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(c.w, 0); ctx.lineTo(c.w, c.h); ctx.lineTo(14, c.h); ctx.lineTo(0, c.h - 14); ctx.lineTo(0, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 1; ctx.beginPath(); ctx.rect(6, 6, c.w - 12, c.h - 12); ctx.stroke();
    txt(PL[t].name, 16, 34, 22, INK.dark, 'left', 0.03);
    for (let q = 0; q < mx; q++) { const x = c.w - 22 - (mx - 1 - q) * 14; ctx.beginPath(); ctx.arc(x, 26, 5, 0, TAU); if (q < lv) { ctx.fillStyle = INK.green; ctx.fill(); } else { ctx.strokeStyle = INK.dark; ctx.lineWidth = 1.5; ctx.stroke(); } }
    const status = locked ? `PLOT AT ${40 * i} M` : (lv ? `LEVEL ${lv} OF ${mx} · ${40 * i} M` : `BARE PLOT · ${40 * i} M`);
    txt(status, 16, 54, 12, INK.green, 'left', 0.12);
    const desc = full ? effect(t, lv) : 'NEXT: ' + effect(t, lv + 1);
    const lines = wrap(desc, c.w - 32, 13).slice(0, 3);
    lines.forEach((ln, q) => txt(ln, 16, 76 + q * 16, 13, INK.dark, 'left', 0.06));
    const bx = 12, by = c.h - 50, bw = c.w - 24, bh = 38;
    let label;
    if (locked) label = `RUN PAST ${40 * i - 40} M TO UNLOCK`;
    else if (full) label = 'FULL GROWN';
    else if (afford) label = (lv ? 'GROW' : 'PLANT') + ' · ' + cost + ' SEEDS';
    else label = `NEED ${cost - bank} MORE SEEDS`;
    if (afford) { pinkInk(() => rr(bx, by, bw, bh, 4), false); }
    ctx.strokeStyle = INK.dark; ctx.lineWidth = 2; rr(bx, by, bw, bh, 4); ctx.stroke();
    txt(label, c.w / 2, by + 25, 16, afford ? INK.dark : (full ? INK.green : INK.dark), 'center', 0.1);
    ctx.restore();
  }

  // ---------- world ----------
  function drawWorld(garden) {
    const u = cam.ppm, lo = cam.x - 4, hi = cam.x + W / u + 4;
    drawGround();
    // distance posts every 100 m, start post, best flag
    for (let d = Math.max(0, Math.ceil(lo / 100) * 100); d < hi; d += 100) {
      const sx = X(d - 2.2);
      ctx.fillStyle = INK.dark; ctx.fillRect(sx - 1.5, GY - 0.9 * u, 3, 0.9 * u);
      ctx.fillStyle = INK.paper; ctx.strokeStyle = INK.dark; ctx.lineWidth = 1.5; rr(sx - 0.42 * u, GY - 1.18 * u, 0.84 * u, 0.36 * u, 2); ctx.fill(); ctx.stroke();
      txt(String(d), sx, GY - 0.9 * u, Math.max(9, 0.27 * u), INK.dark, 'center', 0);
    }
    if (best >= 10 && best > lo && best < hi) {
      const sx = X(best);
      ctx.fillStyle = INK.dark; ctx.fillRect(sx - 1.5, GY - 2.1 * u, 3, 2.1 * u);
      pinkInk(() => { ctx.beginPath(); ctx.moveTo(sx + 1.5, GY - 2.1 * u); ctx.lineTo(sx + 0.9 * u, GY - 1.85 * u); ctx.lineTo(sx + 1.5, GY - 1.6 * u); ctx.closePath(); }, false);
      txt('BEST', sx + 4, GY - 2.2 * u, Math.max(9, 0.28 * u), INK.dark, 'left', 0.1);
    }
    for (let i = Math.max(1, Math.floor(lo / 40)); 40 * i < hi; i++) drawPlot(i, garden);
    drawHazards(garden);
    // seeds
    const bobT = T * 3;
    const drawSeeds = (arr) => {
      for (let i = lowerBound(arr, lo); i < arr.length && arr[i].x < hi; i++) {
        const s = arr[i]; if (!garden && s.got === S.runId) continue;
        seedShape(X(s.x), Y(s.y) + Math.sin(bobT + s.x) * 2, Math.max(10, 0.3 * u), -0.5 + Math.sin(bobT * 0.7 + s.x) * 0.2);
      }
    };
    drawSeeds(SD); drawSeeds(PS);
    // sprouts behind her
    for (const s of sprouts) {
      const sx = X(s.x); if (sx < -10) continue; const g = Math.min(1, s.t / 0.3), hh = 0.22 * u * g;
      ctx.strokeStyle = INK.green; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sx, GY); ctx.lineTo(sx, GY - hh); ctx.stroke();
      ctx.fillStyle = INK.green; ctx.beginPath(); ctx.ellipse(sx - 0.07 * u * g, GY - hh, 0.07 * u * g + 0.1, 0.035 * u * g + 0.1, 0.5, 0, TAU); ctx.ellipse(sx + 0.07 * u * g, GY - hh, 0.07 * u * g + 0.1, 0.035 * u * g + 0.1, -0.5, 0, TAU); ctx.fill();
    }
    drawHintsWorld();
    drawRunner();
    if (S.hat) drawHat(X(S.hat.x), Y(S.hat.y), u * 1.2, S.hat.r);
    for (const p of worldFx) {
      if (p.k === 'dust') { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), Math.max(2, 0.07 * u) * (1 - p.t / p.life * 0.5), 0, TAU); ctx.fill(); }
    }
    if (S.stamp) {
      const P = 40 * S.stamp.i, t = S.stamp.t, sx = X(P), sy = GY - 0.6 * u;
      if (t < 0.12) {
        const r = (t < 0.06 ? 0.7 : 1.15) * u, n = 9, dr = t < 0.06 ? 3 : 4.5;
        pinkInk(() => { ctx.beginPath(); for (let k = 0; k < n; k++) { const a = k * TAU / n + (t < 0.06 ? 0 : 0.3); ctx.moveTo(sx + Math.cos(a) * r + dr, sy + Math.sin(a) * r * 0.7); ctx.arc(sx + Math.cos(a) * r, sy + Math.sin(a) * r * 0.7, dr, 0, TAU); } }, false);
      }
    }
    for (const f of floats) {
      const k = f.t / 1.2; ctx.globalAlpha = 1 - k * k;
      inkText(f.s, X(f.x), Y(f.y) - k * 30, 20, 'center', INK.dark);
      ctx.globalAlpha = 1;
    }
  }
  function drawHintsWorld() {
    const u = cam.ppm, lo = cam.x, hi = cam.x + W / u, play = S.mode === 'play' && S.dying < 0;
    for (let i = hzFrom(lo - 16); i < HZ.length && HZ[i].a < hi; i++) {
      const h = HZ[i];
      if (!play) { if (h.k === 'chasm' && !bridged(h.plot) && (S.mode !== 'over' || S.overT > 0.7)) inkText('NEEDS A VINE BRIDGE', X((h.a + h.b) / 2), Y(2.2), 15, 'center', INK.dark, true); continue; }
      if (h.k === 'stump' && !hints.hold && h.b > B.x && !mushAt(h.a - 5)) { const p = 1 + 0.06 * Math.sin(T * 8); ctx.save(); ctx.translate(X(h.a + 0.4), Y(2.55)); ctx.scale(p, p); inkText('HOLD', 0, 0, 22, 'center', INK.dark); ctx.restore(); }
      if (h.k === 'chasm' && !bridged(h.plot) && h.b > B.x) inkText('TOO WIDE: PLANT A BRIDGE', X((h.a + h.b) / 2), Y(2.4), 18, 'center', INK.dark, true);
      if (h.k === 'crow' && !hints.crow && crowX(h, B.x) > B.x) inkText('LET IT PASS', X(crowX(h, B.x)), Y(2.6), 18, 'center', INK.dark);
    }
  }

  // ---------- screens ----------
  function drawHUD() {
    const r = W - 18, d = Math.floor(S.maxX);
    ctx.font = fontStr(18); if (hasLS) ctx.letterSpacing = '0px';
    const mW = ctx.measureText('M').width;
    inkText(String(d), r - mW - 6, ST + 72, 64, 'right', INK.green, true);
    txt('M', r, ST + 72, 18, INK.dark, 'right', 0, true);
    for (let k = 0; k < 3; k++) heartIcon(r - 64 + k * 26, ST + 96, 20, k < S.hearts, k === S.hearts - 1 || k === S.hearts ? S.heartPop : 0);
    const sc = 1 + S.pop * 0.2;
    ctx.save(); ctx.translate(r, ST + 132); ctx.scale(sc, sc);
    txt(String(S.shown), 0, 0, 22, INK.dark, 'right', 0, true);
    ctx.font = fontStr(22); const tw = ctx.measureText(String(S.shown)).width;
    ctx.fillStyle = INK.paper; ctx.beginPath(); ctx.arc(-tw - 11, -8, 11, 0, TAU); ctx.fill();
    seedShape(-tw - 12, -8, 16, -0.4);
    ctx.restore();
    S.hudSeed = { x: r - 30, y: ST + 124 };
    for (const f of flyers) {
      if (f.t < 0) continue;
      const e = eio(Math.min(1, f.t / f.dur));
      const x = lerp(f.x0, S.hudSeed.x, e), y = lerp(f.y0, S.hudSeed.y, e) - Math.sin(Math.PI * e) * 70;
      seedShape(x, y, 13, e * 6);
    }
  }
  let titleBottom = 0;
  function drawTitleWord() {
    const top = Math.max(ST + 64, H * 0.08);
    let fs = Math.min(W * 0.46, H * 0.17);
    ctx.font = fontStr(fs); if (hasLS) ctx.letterSpacing = '0px';
    const mw = Math.max(ctx.measureText('SOW').width, ctx.measureText('FAR').width);
    if (mw > W * 0.66) fs *= W * 0.66 / mw;
    const b1 = top + fs * 0.8, b2 = b1 + fs * 0.84;
    inkText('SOW', 22, b1, fs, 'left', INK.green);
    inkText('FAR', 22 + fs * 0.42, b2, fs, 'left', INK.green);
    titleBottom = b2;
  }
  function drawTitle() {
    let y = titleBottom + 34;
    txt(best ? `BEST ${best} M` : 'RUN THE LANE. PLANT THE PATH.', 24, y, 13, INK.dark, 'left', 0.12);
    txt(`SEED BANK ${bank}`, 24, y + 20, 13, INK.dark, 'left', 0.12);
    const p = 1 + 0.04 * Math.sin(T * 4);
    ctx.save(); ctx.translate(W / 2, H * 0.55); ctx.scale(p, p); inkText('TAP TO RUN', 0, 0, 30, 'center', INK.dark, true); ctx.restore();
    if (!hints.ran) txt('HOLD TO JUMP HIGHER', W / 2, H * 0.55 + 28, 13, INK.dark, 'center', 0.12, true);
    else if (Object.keys(plots).length || bank >= 20) txt('DRAG THE LANE TO VISIT YOUR GARDEN', W / 2, H * 0.55 + 28, 13, INK.dark, 'center', 0.12, true);
  }
  function drawOver() {
    const k = clamp((S.overT - 0.15) / 0.16, 0, 1), sc = S.overT < 0.15 ? 0 : 1.3 - 0.3 * eo(k);
    if (sc > 0) {
      const w = Math.min(W - 48, 340), h0 = H * 0.18, h1 = H * 0.40, hh = h1 - h0;
      ctx.save(); ctx.translate(W / 2, (h0 + h1) / 2); ctx.rotate(-0.04); ctx.scale(sc, sc);
      if (S.card) ctx.globalAlpha = 0.35;
      ctx.fillStyle = INK.paper; ctx.fillRect(-w / 2, -hh / 2, w, hh);
      ctx.strokeStyle = INK.dark; ctx.lineWidth = 3; ctx.strokeRect(-w / 2, -hh / 2, w, hh);
      ctx.lineWidth = 1; ctx.strokeRect(-w / 2 + 6, -hh / 2 + 6, w - 12, hh - 12);
      const big = Math.min(64, hh * 0.36);
      txt('THE RUN ENDED AT', 0, -hh / 2 + 28, 13, INK.dark, 'center', 0.12);
      inkText(S.dist + ' M', 0, -hh / 2 + 28 + big * 0.95, big, 'center');
      const y2 = -hh / 2 + 28 + big * 0.95 + 26;
      if (S.newBest) inkText('NEW BEST', 0, y2, 18, 'center', INK.dark); else txt('BEST ' + best + ' M', 0, y2, 16, INK.dark, 'center', 0.12);
      txt('+' + S.gained + ' SEEDS  ·  BANK ' + bank, 0, Math.min(hh / 2 - 14, y2 + 24), 14, INK.green, 'center', 0.1);
      ctx.restore();
    }
    if (!S.card && S.overT > 0.3) {
      const p = 1 + 0.04 * Math.sin(T * 4);
      ctx.save(); ctx.translate(W / 2, H * 0.55); ctx.scale(p, p); inkText('TAP TO RUN AGAIN', 0, 0, 26, 'center', INK.dark, true); ctx.restore();
      if (!hints.plant && bank >= 20) txt('OR TAP A PINK STAKE TO PLANT', W / 2, H * 0.55 + 26, 13, INK.dark, 'center', 0.12, true);
    }
  }
  function drawPaused() {
    ctx.save(); ctx.globalAlpha = 0.6; ctx.fillStyle = INK.paper; ctx.fillRect(0, 0, W, H); ctx.restore();
    ctx.save(); ctx.translate(W / 2, H * 0.4); ctx.rotate(-0.05);
    ctx.strokeStyle = INK.dark; ctx.lineWidth = 3; ctx.strokeRect(-110, -44, 220, 80);
    inkText('PAUSED', 0, 14, 44, 'center');
    ctx.restore();
    txt('TAP TO KEEP RUNNING', W / 2, H * 0.4 + 70, 13, INK.dark, 'center', 0.12);
  }

  function draw() {
    ctx.save();
    if (S.shakeT > 0) ctx.translate((Math.random() - 0.5) * 2 * S.shakeA, (Math.random() - 0.5) * 2 * S.shakeA);
    const garden = S.mode === 'title' || S.mode === 'over';
    drawBackdrop();
    if (S.mode === 'title') drawTitle();
    drawWorld(garden);
    drawSoil();
    if (garden && (S.mode === 'title' || S.overT > 0.5)) drawStakes();
    if (S.mode === 'over') drawOver();
    if (S.mode === 'play' || S.mode === 'paused') drawHUD();
    if (garden && S.card) drawCard();
    if (S.mode === 'paused') drawPaused();
    ctx.restore();
    ctx.fillStyle = GRAIN; ctx.fillRect(0, 0, W, H);
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000)); last = now;
    if (S.sq) S.sq.t += dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.__game = {
    state: () => ({ mode: S.mode, score: S.mode === 'title' ? 0 : (S.mode === 'over' ? S.dist : Math.floor(S.maxX)), best, bank, hearts: S.hearts, seeds: S.seeds }),
    demo: (on) => { autopilot = !!on; held = false; AP.plan = null; AP.press = 0; },
    course: (n) => HZ.slice(0, n || 60).map((h) => h.k[0] + Math.round(h.a)).join(' '),
    dbg: () => ({ near: HZ.filter((h) => h.a > B.x && h.a < B.x + 12).map((h) => h.k), x: +B.x.toFixed(2), y: +B.y.toFixed(2), ground: B.ground, hz: HZ.length, plots, picked, stakes: Array.from({ length: maxPlot() + 1 }, (_, k) => k + 1).map((i) => ({ i, x: Math.round(X(40 * i)), y: GY + 40 })).filter((p) => p.x > 0 && p.x < W) })
  };
})();
</script>
