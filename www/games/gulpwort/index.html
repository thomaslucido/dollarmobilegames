<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gulpwort</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#ff9b73;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #safe{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script src="../../shared/game-kit.js"></script>
<script>
(function () {
  'use strict';
  const kit = GameKit.init({ slug: 'gulpwort', backColor: '#fffaf0' });
  const cv = document.getElementById('c');
  const safeEl = document.getElementById('safe');
  const TAU = Math.PI * 2;
  const FONT = '-apple-system, "Helvetica Neue", Arial, sans-serif';
  const COL = {
    page: '#ff9b73', dot: '#ffab88', cut: '#fffaf0', shPage: '#de6a4c', shShelf: '#2e1438', gloss: '#ffffff',
    shelf: '#4a2457', shelfTop: '#6b3a7c', pot: '#fff1d6', potBand: '#4a2457', potDot: '#a8d12a',
    leaf: '#a8d12a', leafShade: '#7fa81a', leafTip: '#e3f5a0', stem: '#2f6b2a', stemHi: '#4f8f36',
    mouth: '#e8344e', mouthDeep: '#b51f3c', teeth: '#e3f5a0', eye: '#fffaf0', pupil: '#2a2530',
    gFull: '#a8d12a', gLow: '#ffcf2e', gStarve: '#e8344e', wLeaf: '#b8b07a', wShade: '#9c9566', wStem: '#7d7a52', wMouth: '#b98a70',
    ink: '#2a2530', flyEye: '#e8344e', flyWing: '#d6ecff', mothWing: '#f1e2c2', mothSpot: '#b89a6a', mothBody: '#8a6a48',
    dfBody: '#2f7df2', dfHead: '#1d4fb0', dfWing: '#e6f6ff', bee: '#ffcf2e', petal: '#fffaf0', petalC: '#ffcf2e',
    text: '#4a2457', danger: '#e8344e', bump: '#ff8fa3', curl: '#f1e0c0', track: '#6b3a7c'
  };

  // ---------- helpers ----------
  const hexCache = {};
  const rgb = (h) => hexCache[h] || (hexCache[h] = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
  function mix(a, b, t) {
    if (t <= 0) return a; if (t >= 1) return b;
    const A = rgb(a), B = rgb(b);
    return 'rgb(' + ((A[0] + (B[0] - A[0]) * t) | 0) + ',' + ((A[1] + (B[1] - A[1]) * t) | 0) + ',' + ((A[2] + (B[2] - A[2]) * t) | 0) + ')';
  }
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const easeOutBack = (k) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
  const easeInOut = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
  const smooth = (u) => u * u * (3 - 2 * u);

  // ---------- sound (WebAudio, silent until the first tap) ----------
  let AC = null, master = null, noiseBuf = null;
  function unlockAudio() {
    try {
      if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    } catch (e) { AC = null; }
  }
  const audible = () => AC && (S.mode === 'play' || S.mode === 'over');
  function tone(f0, f1, dur, type, vol, delay) {
    if (!audible()) return;
    try {
      const t = AC.currentTime + (delay || 0);
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.08, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  }
  function noise(dur, vol) {
    if (!audible()) return;
    try {
      if (!noiseBuf) { noiseBuf = AC.createBuffer(1, (AC.sampleRate * 0.2) | 0, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
      const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(), t = AC.currentTime;
      s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 1400;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.01);
    } catch (e) {}
  }
  function stingSound() {
    if (!audible()) return;
    try {
      const t = AC.currentTime, o = AC.createOscillator(), l = AC.createOscillator(), lg = AC.createGain(), g = AC.createGain();
      o.type = 'sawtooth'; o.frequency.value = 220; l.frequency.value = 30; lg.gain.value = 40;
      l.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.connect(g); g.connect(master); o.start(t); l.start(t); o.stop(t + 0.27); l.stop(t + 0.27);
    } catch (e) {}
  }
  const semi = (n) => Math.pow(2, n / 12);
  const SFX = {
    snap: () => { noise(0.035, 0.06); tone(160, 160, 0.04, 'square', 0.035); },
    gulp: (n) => { const k = semi(2 * (n - 1)); tone(300 * k, 620 * k, 0.09, 'sine', 0.11); },
    empty: () => tone(120, 110, 0.03, 'triangle', 0.09),
    sting: () => { stingSound(); buzz('medium'); },
    bloom: () => { tone(880, 880, 0.12, 'triangle', 0.05); tone(1320, 1320, 0.16, 'triangle', 0.05, 0.1); },
    wilt: () => { tone(440, 150, 0.4, 'triangle', 0.09); buzz('heavy'); },
    regrow: () => tone(520, 780, 0.22, 'sine', 0.07),
    tick: () => tone(2600, 2600, 0.004, 'square', 0.012),
    over: () => { tone(330, 110, 0.6, 'triangle', 0.09); tone(247, 98, 0.7, 'sine', 0.06, 0.08); },
    best: () => { [660, 880, 1100].forEach((f, k) => tone(f, f, 0.12, 'triangle', 0.05, k * 0.09)); }
  };
  const buzz = (s) => { if (S.mode === 'play') kit.buzz(s); };

  // ---------- layout ----------
  let W = 0, H = 0, GW = 0, X0 = 0, K = 1, R = 40, ST = 0, SB = 0, HH = 0, shelfY = 0, dots = [];
  const Y = (f) => ST + f * HH;
  const PL = [
    { fx: 0.2, jy: 0.60, per: 3.4, ph: 0 },
    { fx: 0.5, jy: 0.50, per: 2.9, ph: 2.1 },
    { fx: 0.8, jy: 0.60, per: 3.9, ph: 4.2 }
  ];
  function newPlant(d, i) {
    return { i, fx: d.fx, jyF: d.jy, per: d.per, ph: d.ph, belly: 70, state: 'open', st: 0, next: 'open', o: 1,
      bloom: false, bloomA: 0, wiltA: 0, dW: 0, wobble: 0, shake: 0, lx: 0, ly: 0, sway: 0, ang: 0, rot: 0, x: 0, y: 0, vx: 0, vy: 0,
      aiWait: 0, hold: false, sq: 0, fpx: 0, fpy: 0, px: 0, py: 0, rx: 0, ry: 0, L: 1, out: d.fx < 0.5 ? -1 : 1, crumbs: 0 };
  }
  let plants = PL.map(newPlant);

  function layout() {
    const cs = getComputedStyle(safeEl);
    ST = parseFloat(cs.paddingTop) || 0; SB = parseFloat(cs.paddingBottom) || 0;
    HH = H - ST - SB;
    GW = Math.min(W, HH * 0.62); X0 = (W - GW) / 2; K = GW / 390; R = 0.11 * GW;
    shelfY = Y(0.80);
    for (const p of plants) placePlant(p);
    dots = [];
  }
  function placePlant(p) {
    p.px = X0 + p.fx * GW; p.py = Y(0.84); p.rx = p.px; p.ry = Y(p.jyF); p.L = p.py - p.ry;
  }
  const ctx = kit.fitCanvas(cv, (s) => { W = s.w; H = s.h; layout(); });
  setTimeout(layout, 60); // safe-area insets can settle a beat after load

  // ---------- run state ----------
  const S = { mode: 'title', time: 0, t: 0, wt: 0, titleT: 0, overT: 0, pauseT: 0, score: 0, best: kit.best(), streak: 0, leaves: 3, regrow: 0,
    gulped: 0, biggest: 0, spawnT: 0.6, lastBeeSide: 0, seenBee: false, shake: 0, demo: false, newBest: false, passedBest: false,
    stings: 0, empties: 0, wilts: 0, scoreBump: 0, leafPop: [0, 0, 0] };
  let bugs = [], T = [], parts = [], pops = [], eats = [];

  // difficulty curves (t = seconds played)
  const drainAt = (t) => Math.min(6, 2.6 + 0.012 * t);
  const mAt = (t) => (t < 240 ? Math.min(1.7, 1 + 0.0035 * t) : Math.min(2.0, 1.7 + 0.03 * Math.floor((t - 240) / 30)));
  const spawnAt = (t) => Math.max(0.55, 1.5 - 0.005 * t);
  const streakMult = () => Math.min(3, 1 + 0.5 * Math.floor(S.streak / 8));

  const TY = {
    fly: { belly: 30, pts: 10, spd: 0.38, visit: 0.9 },
    gnat: { belly: 10, pts: 4, spd: 0.22, visit: 1.6 },
    gnats: { belly: 10, pts: 4, spd: 0.22, visit: 1.6 },
    moth: { belly: 50, pts: 25, spd: 0.26, visit: 1.4 },
    dragon: { belly: 40, pts: 30, spd: 0.9, visit: 0.45 },
    bee: { belly: 0, pts: 0, spd: 0.30, visit: 1.2 }
  };
  const SNAP = 0.08, CHEW = 0.9, REOPEN = 0.5, DAZE = 1.5, WILT = 3.0;

  function resetWorld() {
    plants = PL.map(newPlant); plants.forEach(placePlant);
    bugs = []; T = []; eats = [];
    S.t = 0; S.wt = 0; S.score = 0; S.streak = 0; S.leaves = 3; S.regrow = 0; S.gulped = 0; S.biggest = 0;
    S.spawnT = 0.5; S.lastBeeSide = 0; S.seenBee = false; S.newBest = false; S.passedBest = false;
    S.stings = 0; S.empties = 0; S.wilts = 0; S.leafPop = [0, 0, 0];
  }
  function startRun() {
    resetWorld(); pops = []; parts = [];
    S.best = kit.best(); S.mode = 'play'; S.cardT = 0;
    kit.buzz('light');
  }

  // ---------- bugs ----------
  function mkPath(x0, y0, cx, cy, x1, y1) {
    const len = (Math.hypot(cx - x0, cy - y0) + Math.hypot(x1 - cx, y1 - cy) + Math.hypot(x1 - x0, y1 - y0)) / 2;
    return [x0, y0, cx, cy, x1, y1, Math.max(1, len)];
  }
  function bez(P, u) { const a = 1 - u; return [a * a * P[0] + 2 * a * u * P[2] + u * u * P[4], a * a * P[1] + 2 * a * u * P[3] + u * u * P[5]]; }
  function load() { let n = 0; for (const b of bugs) n += b.type === 'gnats' ? 2 : 1; return n; }
  function pickType(td) {
    let tbl;
    if (td < 20) tbl = [['fly', 1]];
    else if (td < 30) tbl = [['fly', 0.85], ['bee', 0.15]];
    else if (td < 60) tbl = [['fly', 0.6], ['gnats', 0.2], ['bee', 0.2]];
    else if (td < 100) tbl = [['fly', 0.45], ['gnats', 0.15], ['moth', 0.15], ['bee', 0.25]];
    else tbl = [['fly', 0.35], ['gnats', 0.15], ['moth', 0.12], ['dragon', 0.13], ['bee', 0.25]];
    let r = Math.random();
    for (const [k, w] of tbl) { if (r < w) return k; r -= w; }
    return 'fly';
  }
  const exitPoint = (side) => [side < 0 ? W + 34 * K : -34 * K, Y(rand(0.05, 0.3))];
  function airPoint() { return [X0 + GW * rand(0.12, 0.88), Y(rand(0.16, 0.5))]; }

  function spawn(td, m) {
    let type = pickType(td);
    const room = 9 - load();
    if (type === 'gnats' && room < 2) type = 'fly';
    if (room < 1) return false;
    let side = Math.random() < 0.5 ? -1 : 1;
    if (type === 'bee') {
      if (side === S.lastBeeSide) side = -side;
      S.lastBeeSide = side;
      if (!S.seenBee && S.mode === 'play') { S.seenBee = true; pop('spare the bees!', W / 2, ST + 104, { size: 22, hold: 1.15, pill: COL.bee }); }
    }
    let cands = plants.filter((p) => p.state === 'open' || p.state === 'snap' || p.state === 'chew');
    if (!cands.length) cands = plants;
    let p = cands[(Math.random() * cands.length) | 0], toFlower = false;
    if (type === 'bee') {
      const bl = plants.filter((q) => q.bloom && q.state !== 'wilt');
      if (bl.length && Math.random() < 0.6) { p = bl[(Math.random() * bl.length) | 0]; toFlower = true; }
    }
    const x0 = side < 0 ? -26 * K : W + 26 * K, y0 = Y(rand(0.14, 0.45));
    const b = { type, side, x: x0, y: y0, vx: 0, vy: 0, t: 0, seed: Math.random() * 100, phase: 'in', amp: 0.35, sm: 1, u: 0,
      inT: [0, 0, 0], target: p.i, face: -side, toFlower, dead: false, bx: x0, by: y0 };
    if (type === 'dragon') {
      const a = Math.random() * TAU, d = rand(0, 0.4) * R;
      const s2 = [p.rx + Math.cos(a) * d, p.ry + Math.sin(a) * d];
      b.stops = [airPoint(), s2, airPoint()];
      b.leg = 0; dashTo(b, b.stops[0], m);
    } else {
      let ax, ay;
      if (toFlower) { ax = p.fpx + rand(-0.2, 0.2) * R; ay = p.fpy + rand(-0.2, 0.2) * R; }
      else { const a = Math.random() * TAU, d = rand(0.3, 1.4) * R; ax = p.rx + Math.cos(a) * d; ay = p.ry + Math.sin(a) * d; }
      ay = Math.max(Y(0.12), ay); ax = clamp(ax, 0.6 * R, W - 0.6 * R);
      b.ax = ax; b.ay = ay;
      b.path = mkPath(x0, y0, (x0 + ax) / 2, y0, ax, ay);
      if (type === 'gnats') {
        b.members = [];
        for (let k = 0; k < 5; k++) b.members.push({ type: 'gnat', cloud: b, a: Math.random() * TAU, r: rand(0.15, 0.6) * R, w: rand(1.6, 3.2) * (Math.random() < 0.5 ? -1 : 1),
          seed: Math.random() * 50, x: x0, y: y0, vx: 0, vy: 0, alive: true, inT: [0, 0, 0], face: b.face });
      }
    }
    bugs.push(b); SFX.tick();
    return true;
  }
  function dashTo(b, to, m, fast) {
    b.phase = 'dash'; b.fx0 = b.x; b.fy0 = b.y; b.tx = to[0]; b.ty = to[1]; b.dtm = 0;
    b.dd = Math.max(0.12, Math.hypot(to[0] - b.x, to[1] - b.y) / (TY.dragon.spd * GW * m * (fast || 1)));
    if (Math.abs(to[0] - b.x) > 2) b.face = Math.sign(to[0] - b.x);
  }
  function startOut(b, fast) {
    const e = exitPoint(b.side);
    b.phase = 'out'; b.u = 0; b.sm = fast || 1;
    b.path = mkPath(b.bx, b.by, (b.bx + e[0]) / 2, (b.by + e[1]) / 2 - HH * 0.06, e[0], e[1]);
  }
  function scatter(b, fast) {
    if (b.type === 'gnat') b = b.cloud;
    if (b.scattered) return; b.scattered = true;
    if (b.type === 'dragon') { b.leg = 3; dashTo(b, exitPoint(b.side), mAt(S.t), fast); return; }
    b.bx = b.x; b.by = b.y; b.side = b.x < W / 2 ? 1 : -1; // flee to the nearer edge
    startOut(b, fast); b.amp = 0.15;
  }
  function patt(b, t) {
    switch (b.type) {
      case 'fly': { const w = TAU * 1.6 * t + b.seed; return [Math.cos(w) * 0.5 * R, Math.sin(w) * 0.4 * R]; }
      case 'moth': { const w = TAU * 0.42 * t + b.seed; return [Math.cos(w) * 1.1 * R, Math.sin(w) * 0.62 * R + Math.sin(t * 9) * 2 * K]; }
      case 'bee': return [Math.sin(2.3 * t + b.seed) * 0.35 * R, Math.sin(3.7 * t + b.seed * 1.3) * 0.28 * R];
      default: return [Math.sin(1.3 * t + b.seed) * 0.3 * R, Math.cos(1.7 * t + b.seed) * 0.22 * R];
    }
  }
  function updBug(b, dt, m) {
    b.t += dt;
    const ox = b.x, oy = b.y;
    if (b.type === 'dragon') {
      if (b.phase === 'dash') {
        b.dtm += dt; const u = Math.min(1, b.dtm / b.dd), e = easeInOut(u);
        b.x = b.fx0 + (b.tx - b.fx0) * e; b.y = b.fy0 + (b.ty - b.fy0) * e;
        if (u >= 1) {
          for (let k = 1; k <= 5; k++) { const f = k / 6; parts.push({ kind: 'trail', x: b.fx0 + (b.tx - b.fx0) * f, y: b.fy0 + (b.ty - b.fy0) * f, vx: 0, vy: 0, g: 0, life: 0.25 + 0.07 * k, max: 0.6, r: 1.6 + k * 0.35 }); }
          if (b.leg >= 3) { b.dead = true; return; }
          b.phase = 'hover'; b.ht = TY.dragon.visit / m;
        }
      } else {
        b.ht -= dt;
        b.x = b.tx + Math.sin(b.t * 21) * 1.2 * K; b.y = b.ty + Math.cos(b.t * 17) * 1.6 * K;
        if (b.ht <= 0) { b.leg++; dashTo(b, b.leg < 3 ? b.stops[b.leg] : exitPoint(b.side), m); }
      }
    } else {
      if (b.phase === 'in') {
        b.u += dt * TY[b.type].spd * m * GW * b.sm / b.path[6];
        if (b.u >= 1) { b.u = 1; b.phase = 'visit'; b.vt = TY[b.type].visit / m; }
        const q = bez(b.path, b.u * (1.5 - 0.5 * b.u)); b.bx = q[0]; b.by = q[1];
      } else if (b.phase === 'visit') {
        if (b.toFlower) { const p = plants[b.target]; if (p.bloom) { b.bx += (p.fpx - b.bx) * Math.min(1, dt * 2); b.by += (p.fpy - b.by) * Math.min(1, dt * 2); } }
        b.vt -= dt; if (b.vt <= 0) startOut(b);
      } else {
        b.u += dt * TY[b.type].spd * m * GW * b.sm / b.path[6];
        if (b.u >= 1) { b.dead = true; return; }
        const q = bez(b.path, b.u * (0.5 + 0.5 * b.u)); b.bx = q[0]; b.by = q[1];
      }
      const tgt = b.phase === 'visit' ? 1 : (b.scattered ? 0.12 : 0.35);
      b.amp += (tgt - b.amp) * Math.min(1, dt * 4);
      const o = patt(b, b.t);
      b.x = b.bx + o[0] * b.amp; b.y = b.by + o[1] * b.amp;
      if (b.type === 'gnats') {
        let alive = 0;
        for (const g of b.members) {
          if (!g.alive) continue; alive++;
          const gx = g.x, gy = g.y;
          g.a += g.w * dt;
          g.x = b.x + Math.cos(g.a) * g.r + Math.sin(b.t * 7 + g.seed) * 2 * K;
          g.y = b.y + Math.sin(g.a) * g.r * 0.8 + Math.cos(b.t * 6 + g.seed) * 2 * K;
          if (dt > 0) { g.vx = (g.x - gx) / dt; g.vy = (g.y - gy) / dt; }
          g.face = g.vx > 0 ? 1 : -1;
        }
        if (!alive) { b.dead = true; return; }
      }
    }
    if (dt > 0) { b.vx = (b.x - ox) / dt; b.vy = (b.y - oy) / dt; }
    if (b.type !== 'dragon' && Math.abs(b.vx) > 12) b.face = b.vx > 0 ? 1 : -1;
    if (b.t > 45) b.dead = true;
  }
  function buildTargets() {
    T.length = 0;
    for (const b of bugs) {
      if (b.dead) continue;
      if (b.type === 'gnats') { for (const g of b.members) if (g.alive) T.push(g); } else T.push(b);
    }
  }

  // ---------- plants ----------
  function toOpen(p) { p.state = 'open'; p.st = 0; p.aiWait = 0; }
  function feed(p, v) {
    if (p.belly + v > 100) {
      p.belly = 100;
      if (!p.bloom) { p.bloom = true; SFX.bloom(); pop('bloom!', p.fpx, p.fpy - R * 0.7, { size: 18, hold: 0.5, fill: COL.text, pill: COL.cut }); }
    } else p.belly += v;
  }
  function wilt(p) {
    p.state = 'wilt'; p.st = 0; p.belly = 0; p.bloom = false; p.aiWait = 0;
    S.streak = 0; S.regrow = 0; S.wilts++;
    if (S.mode !== 'play') { p.belly = 50; toOpen(p); return; }
    S.leaves--;
    const lp = leafPos(S.leaves);
    parts.push({ kind: 'leaf', x: lp[0], y: lp[1], vx: rand(-30, 30), vy: -60, g: 120, life: 2.4, max: 2.4, r: 12, rot: 0, vr: rand(-3, 3), ph: Math.random() * 6 });
    SFX.wilt(); S.shake = Math.max(S.shake, 5);
    if (S.leaves <= 0) gameOver();
    else pop('wilted!', p.x, p.y - R * 1.2, { size: 20, hold: 0.6, fill: COL.danger });
  }
  function gameOver() {
    S.mode = 'over'; S.overT = 0;
    S.newBest = kit.saveBest(S.score); S.best = kit.best();
    for (const p of plants) { p.state = 'wilt'; p.st = 0; p.hold = true; p.bloom = false; }

  }

  // ---------- drawing: sticker passes ----------

  // ---------- drawing: page and shelf ----------
  function drawPage() {

      ctx.save(); ctx.translate(x, q.y); ctx.rotate(q.rot + q.corner * peel * 0.35);
      ctx.scale(s, s);
      ctx.translate(q.corner * w / 2, -h / 2); ctx.scale(1 - peel * 0.25, sy); ctx.translate(-q.corner * w / 2, h / 2);
      if (q.pill) pill(q.text, 0, 0, q.size, q.pill);
      else btext(q.text, 0, 0, q.size, { jit: true, fill: q.fill });
      ctx.restore();
    }
  }
  function drawParts() {
    for (const q of parts) {
      const a = clamp(q.life / q.max, 0, 1);
      if (q.kind === 'leaf') { sticker(() => { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot + 0.35); leafShape(11); ctx.restore(); }, 3, 3, COL.shPage); continue; }
      ctx.save(); ctx.globalAlpha = q.kind === 'trail' ? a * 0.9 : Math.min(1, a * 2);
      if (q.kind === 'trail' || q.kind === 'puff') { ctx.fillStyle = COL.cut; ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (q.kind === 'trail' ? K : (0.6 + (1 - a))), 0, TAU); ctx.fill(); }
      else if (q.kind === 'crumb') { ctx.fillStyle = COL.cut; ctx.beginPath(); ctx.arc(q.x, q.y, q.r + 1.6, 0, TAU); ctx.fill(); ctx.fillStyle = COL.leafShade; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill(); }
      else if (q.kind === 'star') {
        ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.beginPath();
        for (let k = 0; k < 10; k++) { const an = -Math.PI / 2 + k * Math.PI / 5, r2 = k % 2 ? q.r * 0.45 : q.r; ctx.lineTo(Math.cos(an) * r2, Math.sin(an) * r2); }
        ctx.closePath(); ctx.lineJoin = 'round'; ctx.strokeStyle = COL.cut; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = COL.bee; ctx.fill();
      }
      ctx.restore();
    }
  }

  // ---------- draw ----------
  function draw() {
    ctx.save();
    if (S.shake > 0.2) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
    drawPage();
    drawShelf();
    for (const p of plants) { plantCols(p); if (p.bloomA > 0) sticker(() => flowerShape(p), 3 * K, 3 * K, COL.shPage); }
    // catch zones: a faint warm-white disc under each open jaw
    for (const p of plants) {
      if (p.state !== 'open' && p.state !== 'snap') continue;
      ctx.globalAlpha = 0.17 * clamp(p.o, 0, 1); ctx.fillStyle = p.belly < 20 ? COL.danger : COL.cut;
      ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    }
    for (const p of plants) { const pose = jawPose(p); sticker(() => plantShape(p, pose), 5 * K, 4 * K, null, true); }
    for (const p of plants) { sticker(() => potShape(p), 4 * K, 4 * K, COL.shShelf); sticker(() => gaugeShape(p), 2.5 * K, 2.5 * K, COL.shShelf); }
    for (const b of bugs) {
      if (b.type === 'gnats') { for (const g of b.members) if (g.alive) drawBug('gnat', g.x, g.y, g.face, g.seed); }
      else drawBug(b.type, b.x, b.y, b.face, b.seed);
    }
    for (const e of eats) { const u = clamp(e.t / 0.1, 0, 1); drawBug(e.type, e.x + (e.p.x - e.x) * u, e.y + (e.p.y - e.y) * u, e.face, e.seed, 1 - u * 0.9); }
    drawParts();
    drawPops();
    ctx.restore();

    if (S.mode === 'play' || S.mode === 'paused') drawHUD();
    if (S.mode === 'title') drawTitle();
    if (S.mode === 'paused') drawPause();
    if (S.mode === 'over') drawOver();
  }

  function drawTitle() {
    const cw = Math.min(330, W - 36), ch = clamp(HH * 0.33, 214, 290), cx = W / 2, x = cx - cw / 2, y = Math.max(ST + 62, Y(0.075));
    ctx.save(); slapIn(S.titleT, 0.3, cx, y + ch / 2, -0.06);
    card(x, y, cw, ch);
    const ts = Math.min(60, cw * 0.18);
    btext('gulpwort', cx, y + ch * 0.25, ts, { jit: true });
    label('tap a column to snap.', cx, y + ch * 0.47, 16, COL.text);
    label('never eat a bee.', cx - 10, y + ch * 0.57, 16, COL.danger);
    const bw = measure('never eat a bee.', 16);
    drawBug('bee', cx - 10 + bw * 0.5 + 18, y + ch * 0.565, -1, 3, 0.9);
    label('best ' + S.best, cx, y + ch * 0.69, 14, COL.shPage);
    const k = 1 + 0.035 * Math.sin(S.time * 4.5);
    ctx.translate(cx, y + ch * 0.85); ctx.scale(k, k); pill('tap to start', 0, 0, 18, COL.leaf); ctx.restore();
  }
  function drawPause() {
    ctx.fillStyle = 'rgba(46,20,56,0.18)'; ctx.fillRect(0, 0, W, H);
    const cw = Math.min(290, W - 48), ch = 170, cx = W / 2, x = cx - cw / 2, y = Y(0.26);
    ctx.save(); slapIn(S.pauseT, 0.2, cx, y + ch / 2, 0.05);
    card(x, y, cw, ch);
    btext('paused', cx, y + 52, 40, { jit: true });
    label('score ' + S.score, cx, y + 92, 15, COL.shPage);
    pill('tap to carry on', cx, y + 130, 16, COL.leaf);
    ctx.restore();
  }
  function drawOver() {
    ctx.fillStyle = 'rgba(46,20,56,' + (0.15 * clamp(S.overT / 0.5, 0, 1)) + ')'; ctx.fillRect(0, 0, W, H);
    if (S.overT < 0.35) return;
    const t = S.overT - 0.35;
    const cw = Math.min(330, W - 36), ch = 340, cx = W / 2, x = cx - cw / 2, y = Math.max(ST + 62, Y(0.1));
    ctx.save(); slapIn(t, 0.25, cx, y + ch / 2, 0.07);
    card(x, y, cw, ch);
    btext('all wilted', cx, y + 50, Math.min(44, cw * 0.13), { jit: true });
    label('score', cx, y + 92, 13, COL.shPage);
    btext(String(S.score), cx, y + 128, 50, { tab: true });
    label('best ' + S.best, cx, y + 166, 15, COL.text);
    // stats
    const sy = y + 228, cols = [['bugs gulped', String(S.gulped)], ['biggest gulp', S.biggest ? 'x' + S.biggest : '-'], ['time', Math.floor(S.t / 60) + ':' + String(Math.floor(S.t % 60)).padStart(2, '0')]];
    ctx.strokeStyle = 'rgba(74,36,87,0.15)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 24, sy - 26); ctx.lineTo(x + cw - 24, sy - 26); ctx.stroke();
    cols.forEach((c, i) => { const xx = x + cw * (i + 0.5) / 3; label(c[0], xx, sy - 6, 11, COL.shPage); label(c[1], xx, sy + 16, 20, COL.text); });
    if (S.overT > 0.8) { const k = 1 + 0.035 * Math.sin(S.time * 4.5); ctx.save(); ctx.translate(cx, y + ch - 42); ctx.scale(k, k); pill('plant again', 0, 0, 18, COL.leaf); ctx.restore(); }
    if (S.newBest && t > 0.4) {
      const u = t - 0.4, s = u < 0.15 ? 1.4 - 0.4 * easeOutBack(u / 0.15) : 1;
      ctx.save(); ctx.translate(x + cw - 50, y + 100); ctx.rotate(0.2); ctx.scale(s, s); pill('new best!', 0, 0, 15, COL.bee); ctx.restore();
    }
    ctx.restore();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // test hook used by scripts/playtest.mjs and scripts/shoot.mjs
  window.__game = {
    state: () => ({ mode: S.mode, score: S.score }),
    // demo(true) during an early run fast-forwards ~80 s of autopilot play so store shots show a busy mid-run screen
    demo: (on) => { S.demo = !!on; if (S.demo && S.mode === 'play' && S.t < 30) { for (let k = 0; k < 80 * 60 && S.mode === 'play'; k++) update(1 / 60); } },
    dbg: () => ({ t: +S.t.toFixed(1), leaves: S.leaves, bellies: plants.map((p) => Math.round(p.belly)), states: plants.map((p) => p.state), bugs: bugs.length,
      gulped: S.gulped, biggest: S.biggest, stings: S.stings, empties: S.empties, wilts: S.wilts, streak: S.streak, score: S.score }),
    human: (o) => { HUMAN = o || null; hq = []; },
    sim: (sec) => { for (let k = 0; k < sec * 60 && S.mode === 'play'; k++) update(1 / 60); return window.__game.dbg(); }
  };
})();
</script>
</body>
</html>
