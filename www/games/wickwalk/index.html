<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wickwalk</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1f2e29;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Chalkboard SE","Marker Felt","Comic Sans MS",cursive}
  canvas{display:block}
  #probe{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="probe"></div>
<script src="../../shared/game-kit.js"></script>
<script>
(function () {
  'use strict';
  const kit = GameKit.init({ slug: 'wickwalk', backColor: '#f2efe4' });
  const TAU = Math.PI * 2;

  // ---------- palette (DESIGN.md) ----------
  const COL = {
    slate: '#1f2e29', smudge: '#2a3b35', ghost: '#33463f', chalk: '#f2efe4', dust: '#c9cfc6', mint: '#66e0b4',
    cord: '#e9dcc0', cordTick: '#b8a98a', damp: '#8cc8ef', ash: '#6f7a74', core: '#fff6c8', sp1: '#ffc95a', sp2: '#ff9c4a',
    gold: '#f7df6e', coral: '#f07a6a', sky: '#8cc8ef', lilac: '#c3a6ef', peach: '#f8b48a', pink: '#f5a3c0',
    wood: '#6b4a2f', woodEdge: '#8a6440', tray: '#5a3d26', card: '#2c3d37'
  };
  const ROCKET_COLS = ['#f5a3c0', '#f7df6e', '#8cc8ef', '#c3a6ef', '#f8b48a', '#66e0b4'];
  const STICK_COLS = ['#f2efe4', '#f5a3c0', '#f7df6e'];
  const FONT_BIG = '"Chalkduster","Chalkboard SE","Marker Felt","Comic Sans MS","Segoe Print","Bradley Hand","DejaVu Sans",sans-serif';
  const FONT_UI = '"Chalkboard SE","Marker Felt","Chalkduster","Comic Sans MS","Segoe Print","DejaVu Sans",sans-serif';

  // ---------- rules (all distances in U = field width) ----------
  const STEP = 0.012, SPOOL = 2.6, END_GRAB = 0.06, CUT_GRAB = 0.05, CUT_AHEAD = 0.08;
  const MARGIN = 0.03, OBS_GAP = 0.02, SELF_GAP = 0.035, SELF_IGNORE = 0.06;
  const vAt = (t) => Math.min(0.24, 0.13 + 0.0005 * t);
  const cueAt = (t) => Math.max(5.0, 10 - 0.022 * t);
  const gapAt = (t) => Math.max(1.7, 5.0 - 0.014 * t);
  const Fv = (t) => t < 220 ? 0.13 * t + 0.00025 * t * t : (0.13 * 220 + 0.00025 * 220 * 220) + 0.24 * (t - 220);
  const vInt = (a, b) => (b > a ? Fv(b) - Fv(a) : 0);
  const multOf = (st) => Math.min(4, 1 + 0.25 * st);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const fmtMult = (m) => 'x' + (Math.round(m * 100) / 100).toString();
  const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ---------- canvases ----------
  const cv = document.getElementById('c');
  const probe = document.getElementById('probe');
  const layer = document.createElement('canvas'), lx = layer.getContext('2d');
  const bg = document.createElement('canvas'), bx = bg.getContext('2d');
  const tmp = document.createElement('canvas'), tx = tmp.getContext('2d');
  let W = 390, H = 844, DPR = 1, U = 359, FX = 16, FY = 101, FH = 1.6, K = 1, safeT = 0, safeB = 0, trayY = 760, trayH = 42, FW = 10;
  let patL = null, patT = null;

  // grain tile: random specks, used with destination-out so every stroke looks powdery
  const grain = document.createElement('canvas');
  grain.width = grain.height = 256;
  (function () {
    const g = grain.getContext('2d'), id = g.createImageData(256, 256), d = id.data;
    for (let i = 0; i < 256 * 256; i++) {
      const r = Math.random();
      d[i * 4 + 3] = r < 0.38 ? 150 + Math.random() * 105 : (r < 0.62 ? Math.random() * 110 : 0);
    }
    g.putImageData(id, 0, 0);
    g.strokeStyle = 'rgba(0,0,0,0.55)'; g.lineWidth = 1;
    for (let i = 0; i < 70; i++) { const x = Math.random() * 256, y = Math.random() * 256, l = 4 + Math.random() * 14, a = (Math.random() - 0.5) * 0.6; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  })();
  function knock(g, pat, a) {
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'destination-out'; g.globalAlpha = a; g.fillStyle = pat;
    try { const s = Math.max(1, DPR * 0.55); if (pat.setTransform && window.DOMMatrix) pat.setTransform(new DOMMatrix([s, 0, 0, s, 0, 0])); } catch (e) {}
    g.fillRect(0, 0, g.canvas.width, g.canvas.height);
    g.restore();
  }

  const X = (u) => FX + u * U, Y = (v) => FY + v * U;

  // ---------- state ----------
  const S = {
    mode: 'title', t: 0, real: 0, titleT: 0, overT: 0, score: 0, lives: 3, streak: 0, best: kit.best(), lit: 0, perfects: 0, longest: 0,
    nextSpawn: 2, lastCue: 0, first: true, nextCloud: 150, shake: 0, newBest: false, smoulder: 0, stuck: false, drew: false,
    tEnd: 0, spoolFlash: 0, endPulse: 0, blockX: null, scoreBump: 0, multBump: 0, warp: false, seed: 1, crackT: 0, sputT: 0, scratch: 0,
    ambT: 0, tutorial: !kit.get('seen', false), titleBurst: -1
  };
  let fuse = [], sparkS = 0, sparkI = 0;
  let rockets = [], obstacles = [], clouds = [], parts = [], streaks = [], tips = [], pops = [], erased = [];
  let sticks = [true, true, true], stickFx = [0, 0, 0];
  let drag = null;
  const AP = { on: false, q: [], qi: 0, target: null, check: 0, acc: 0, fingerA: 0, fx: 0, fy: 0, onAt: 0, warp2: false };
  let rid = 1, lastCol = '';
  const DBG = { log: [], fail: 0, idle: 0, cut: 0, clash: 0, block: 0 };

  // ---------- layout ----------
  function layout(s) {
    W = s.w; H = s.h; DPR = s.dpr;
    const cs = getComputedStyle(probe);
    safeT = parseFloat(cs.paddingTop) || 0; safeB = parseFloat(cs.paddingBottom) || 0;
    U = 0.92 * W; FX = 0.04 * W; K = U / 360;
    FY = Math.max(0.12 * H, safeT + 64);
    trayH = Math.max(30, 0.05 * H);
    const fb = Math.min(0.90 * H, H - safeB - trayH - 6);
    FH = (fb - FY) / U; trayY = fb + 2;
    FW = Math.max(9, 0.026 * W);
    for (const c of [layer, bg, tmp]) { c.width = cv.width; c.height = cv.height; }
    lx.setTransform(DPR, 0, 0, DPR, 0, 0); tx.setTransform(DPR, 0, 0, DPR, 0, 0); bx.setTransform(DPR, 0, 0, DPR, 0, 0);
    patL = lx.createPattern(grain, 'repeat'); patT = tx.createPattern(grain, 'repeat');
    bake();
  }

  // ---------- chalk drawing helpers ----------
  function wcirc(g, cx, cy, r, seed, start, sweep, steps) {
    start = start || 0; sweep = sweep === undefined ? TAU : sweep; steps = steps || Math.max(10, Math.ceil(Math.abs(sweep) / TAU * 30));
    for (let i = 0; i <= steps; i++) {
      const a = start + sweep * i / steps;
      const rr = r * (1 + 0.035 * Math.sin(a * 3 + seed) + 0.02 * Math.sin(a * 7 + seed * 2.3));
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    }
  }
  function chalk(g, build, color, width, alpha) {
    alpha = alpha === undefined ? 1 : alpha;
    g.strokeStyle = color; g.lineWidth = width; g.lineCap = 'round'; g.lineJoin = 'round';
    g.globalAlpha = alpha; g.beginPath(); build(g); g.stroke();
    g.globalAlpha = alpha * 0.4; g.translate(1, 1); g.beginPath(); build(g); g.stroke(); g.translate(-1, -1);
    g.globalAlpha = 1;
  }
  function star4(g, x, y, r) {
    g.moveTo(x, y - r); g.quadraticCurveTo(x, y, x + r, y); g.quadraticCurveTo(x, y, x, y + r);
    g.quadraticCurveTo(x, y, x - r, y); g.quadraticCurveTo(x, y, x, y - r); g.closePath();
  }
  // big chalk lettering: each glyph a touch rotated and nudged, like it was written by hand
  function jtext(g, txt, x, y, size, color, font, alpha, maxW) {
    g.font = Math.round(size) + 'px ' + (font || FONT_BIG); g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = color;
    let w = g.measureText(txt).width;
    if (maxW && w > maxW) { size *= maxW / w; g.font = Math.round(size) + 'px ' + (font || FONT_BIG); w = g.measureText(txt).width; }
    let cx = x - w / 2;
    const a0 = alpha === undefined ? 1 : alpha;
    for (let i = 0; i < txt.length; i++) {
      const ch = txt[i], cw = g.measureText(ch).width, sd = Math.sin((i + 1) * 12.9898 + txt.length * 4.1) * 43758.5453, r = sd - Math.floor(sd);
      g.save(); g.translate(cx + cw / 2, y + (r - 0.5) * size * 0.06); g.rotate((r - 0.5) * 0.09);
      g.globalAlpha = a0; g.fillText(ch, -cw / 2, 0); g.globalAlpha = a0 * 0.3; g.fillText(ch, -cw / 2 + 0.8, 0.8);
      g.restore(); cx += cw;
    }
    g.globalAlpha = 1;
  }
  function ctext(g, txt, x, y, size, color, font, alpha, align) {
    g.font = Math.round(size) + 'px ' + (font || FONT_UI);
    g.textAlign = align || 'center'; g.textBaseline = 'middle'; g.fillStyle = color;
    g.globalAlpha = (alpha === undefined ? 1 : alpha); g.fillText(txt, x, y);
    g.globalAlpha *= 0.3; g.fillText(txt, x + 0.8, y + 0.8); g.globalAlpha = 1;
  }

  // ---------- obstacles ----------
  const RB = { puddle: 0.11, blanket: 0.128, tree: 0.08, bandstand: 0.11 };
  function makeObstacles() {
    const types = ['puddle', 'blanket', 'tree', 'bandstand'].sort(() => Math.random() - 0.5).slice(0, 3);
    const out = [], lan = { x: 0.5, y: FH - 0.06 };
    for (const ty of types) {
      const rb = RB[ty];
      for (let k = 0; k < 500; k++) {
        const gap = k < 300 ? 0.22 : 0.12;
        const x = 0.05 + rb + Math.random() * (0.9 - 2 * rb), y = 0.05 + rb + Math.random() * (FH - 0.1 - 2 * rb);
        if (Math.hypot(x - lan.x, y - lan.y) < 0.3 + rb) continue;
        if (S.tutorial && y - rb < 0.14) continue;
        if (Math.abs(x - 0.5) < rb + 0.08 && y > FH - 0.5 - rb) continue;
        if (out.some((o) => Math.hypot(o.x - x, o.y - y) - o.rb - rb < gap)) continue;
        out.push({ ty, x, y, rb, rot: ty === 'blanket' ? Math.random() * Math.PI / 6 : (ty === 'puddle' ? (Math.random() - 0.5) * 0.7 : 0), seed: Math.random() * 100 });
        break;
      }
    }
    return out;
  }
  function sdObs(o, x, y) {
    let dx = x - o.x, dy = y - o.y;
    if (o.rot) { const c = Math.cos(-o.rot), s = Math.sin(-o.rot); const nx = dx * c - dy * s, ny = dx * s + dy * c; dx = nx; dy = ny; }
    if (o.ty === 'tree') return Math.hypot(dx, dy) - 0.08;
    if (o.ty === 'blanket') { const qx = Math.abs(dx) - 0.09, qy = Math.abs(dy) - 0.09; return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0); }
    if (o.ty === 'puddle') { const a = 0.11, b = 0.07; const k0 = Math.hypot(dx / a, dy / b), k1 = Math.hypot(dx / (a * a), dy / (b * b)); return k0 < 1e-9 ? -b : k0 * (k0 - 1) / k1; }
    const ap = 0.11 * Math.cos(Math.PI / 8); let m = -1e9;
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + Math.PI / 8; const d = dx * Math.cos(a) + dy * Math.sin(a) - ap; if (d > m) m = d; }
    return m;
  }
  function obsDist(x, y) { let m = 9; for (const o of obstacles) { const d = sdObs(o, x, y); if (d < m) m = d; } return m; }

  function drawObstacle(g, o) {
    const cx = X(o.x), cy = Y(o.y), r = rng((o.seed * 1000) | 0);
    g.save(); g.translate(cx, cy); g.rotate(o.rot);
    if (o.ty === 'puddle') {
      const a = 0.11 * U, b = 0.07 * U;
      g.save(); g.beginPath(); g.ellipse(0, 0, a, b, 0, 0, TAU); g.clip();
      g.strokeStyle = COL.sky; g.globalAlpha = 0.6; g.lineWidth = 1.6 * K; g.lineCap = 'round'; g.beginPath();
      for (let x = -a - b; x < a + b; x += 5 * K) { g.moveTo(x + (r() - 0.5) * 2, -b - 2); g.lineTo(x + b * 0.9 + (r() - 0.5) * 3, b + 2); }
      g.stroke(); g.restore();
      chalk(g, (h) => { for (let i = 0; i <= 40; i++) { const t = i / 40 * TAU + 0.2; const k = 1 + 0.04 * Math.sin(t * 3 + o.seed); const x = Math.cos(t) * a * k, y = Math.sin(t) * b * k; i ? h.lineTo(x, y) : h.moveTo(x, y); } }, COL.sky, 2.2 * K, 0.9);
      chalk(g, (h) => { h.ellipse(a * 0.2, -b * 0.05, a * 0.42, b * 0.42, 0, Math.PI * 0.95, Math.PI * 1.75); }, COL.chalk, 1.4 * K, 0.55);
      chalk(g, (h) => { h.ellipse(a * 0.2, -b * 0.05, a * 0.22, b * 0.22, 0, Math.PI * 1.05, Math.PI * 1.85); }, COL.chalk, 1.3 * K, 0.5);
    } else if (o.ty === 'blanket') {
      const s = 0.09 * U, n = 4, c = 2 * s / n;
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        const x0 = -s + i * c, y0 = -s + j * c, col = (i + j) % 2 ? COL.lilac : COL.peach;
        g.strokeStyle = col; g.globalAlpha = 0.55; g.lineWidth = 1.5 * K; g.lineCap = 'round'; g.beginPath();
        for (let k = 0; k < 7; k++) { const t = (k + 0.5) / 7; g.moveTo(x0 + 1.5, y0 + t * c + (r() - 0.5)); g.lineTo(x0 + c - 1.5, y0 + t * c - c * 0.15 + (r() - 0.5)); }
        g.stroke();
      }
      g.globalAlpha = 1;
      chalk(g, (h) => { h.moveTo(-s, -s); h.lineTo(s + 1, -s + 1); h.lineTo(s, s); h.lineTo(-s - 1, s - 1); h.closePath(); }, COL.lilac, 2.2 * K, 0.95);
      chalk(g, (h) => { for (let k = 0; k < 8; k++) { const x = -s + (k + 0.5) * s / 4; h.moveTo(x, s + 1); h.lineTo(x + (r() - 0.5) * 2, s + 5 * K); h.moveTo(x, -s - 1); h.lineTo(x + (r() - 0.5) * 2, -s - 5 * K); } }, COL.peach, 1.4 * K, 0.8);
    } else if (o.ty === 'tree') {
      const R = 0.08 * U;
      g.fillStyle = COL.mint; g.globalAlpha = 0.12; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill(); g.globalAlpha = 1;
      chalk(g, (h) => {
        for (let k = 0; k < 13; k++) { const a = k / 13 * TAU + r() * 0.2, rr = R * 0.78, lr = R * (0.2 + r() * 0.07); const x = Math.cos(a) * rr, y = Math.sin(a) * rr; h.moveTo(x + lr, y); h.arc(x, y, lr, 0, TAU * 0.9); }
        for (let k = 0; k < 6; k++) { const a = r() * TAU, rr = r() * R * 0.45, lr = R * (0.14 + r() * 0.08); const x = Math.cos(a) * rr, y = Math.sin(a) * rr; h.moveTo(x + lr, y); h.arc(x, y, lr, 0, TAU * 0.85); }
      }, COL.mint, 1.8 * K, 0.85);
      g.fillStyle = COL.cordTick; g.beginPath(); g.arc(0, 0, 3.2 * K, 0, TAU); g.fill();
    } else {
      const R = 0.11 * U, Ri = 0.07 * U;
      const oct = (h, rad) => { for (let i = 0; i <= 8; i++) { const a = i * Math.PI / 4; const x = Math.cos(a) * rad, y = Math.sin(a) * rad; i ? h.lineTo(x, y) : h.moveTo(x, y); } };
      g.fillStyle = COL.chalk; g.globalAlpha = 0.07; g.beginPath(); oct(g, R); g.fill(); g.globalAlpha = 1;
      chalk(g, (h) => oct(h, R), COL.chalk, 2.2 * K, 0.92);
      chalk(g, (h) => oct(h, Ri), COL.chalk, 1.5 * K, 0.6);
      chalk(g, (h) => { for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; h.moveTo(Math.cos(a) * Ri, Math.sin(a) * Ri); h.lineTo(Math.cos(a) * R, Math.sin(a) * R); } }, COL.chalk, 1.2 * K, 0.5);
      chalk(g, (h) => { h.moveTo(0, 0); h.lineTo(0, -R * 0.75); }, COL.chalk, 1.6 * K, 0.95);
      g.fillStyle = COL.pink; g.globalAlpha = 0.85; g.beginPath(); g.moveTo(0, -R * 0.75); g.lineTo(R * 0.38, -R * 0.62); g.lineTo(0, -R * 0.5); g.closePath(); g.fill(); g.globalAlpha = 1;
      g.fillStyle = COL.chalk; g.beginPath(); g.arc(0, 0, 2.5 * K, 0, TAU); g.fill();
    }
    g.restore();
  }

  // ---------- baked board: slate, smudges, ghost scribbles, obstacles, wooden frame ----------
  function bake() {
    const g = bx; const r = rng(S.seed);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    g.fillStyle = COL.slate; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 11; i++) {
      const x = r() * W, y = r() * H, rad = (0.18 + r() * 0.35) * W;
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, 'rgba(42,59,53,0.5)'); gr.addColorStop(1, 'rgba(42,59,53,0)');
      g.fillStyle = gr; g.fillRect(x - rad, y - rad, 2 * rad, 2 * rad);
    }
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (let i = 0; i < 7; i++) {
      g.strokeStyle = 'rgba(42,59,53,0.32)'; g.lineWidth = (14 + r() * 24) * K; g.beginPath();
      let x = r() * W, y = r() * H; g.moveTo(x, y);
      for (let j = 0; j < 4; j++) { x += (r() - 0.5) * W * 0.5; y += (r() - 0.5) * H * 0.1; g.lineTo(x, y); }
      g.stroke();
    }
    // ghosts of old lessons, half wiped away
    tx.clearRect(0, 0, W, H);
    const words = ['3 + 4 = 7', 'fair  sat', 'abc', '12 x 3', 'spell: lantern', 'x = 2', '9 - 5', 'bring a jumper', 'Tuesday', '1 2 3 4', 'cats', '7 x 8 = 56'];
    for (let i = 0; i < 7; i++) {
      tx.save(); tx.translate(r() * W, FY + r() * (trayY - FY)); tx.rotate((r() - 0.5) * 0.35);
      tx.font = Math.round((15 + r() * 18) * K) + 'px ' + FONT_BIG; tx.fillStyle = COL.ghost; tx.globalAlpha = 0.5;
      tx.textAlign = 'center'; tx.textBaseline = 'middle'; tx.fillText(words.splice((r() * words.length) | 0, 1)[0], 0, 0); tx.restore();
    }
    tx.strokeStyle = COL.ghost; tx.lineCap = 'round'; tx.globalAlpha = 0.6;
    for (let i = 0; i < 5; i++) {
      const x = r() * W, y = FY + r() * (trayY - FY), kind = (r() * 4) | 0, s = (20 + r() * 26) * K;
      tx.lineWidth = 2 * K; tx.beginPath();
      if (kind === 0) { for (let k = 1; k < 3; k++) { tx.moveTo(x + k * s / 3, y); tx.lineTo(x + k * s / 3, y + s); tx.moveTo(x, y + k * s / 3); tx.lineTo(x + s, y + k * s / 3); } }
      else if (kind === 1) { for (let k = 0; k < 5; k++) { tx.moveTo(x + k * 6 * K, y); tx.lineTo(x + k * 6 * K + (k === 4 ? -28 * K : 0), y + s * 0.6); } }
      else if (kind === 2) { tx.moveTo(x, y); tx.lineTo(x + s * 1.4, y + s * 0.3); tx.lineTo(x + s * 1.1, y); tx.moveTo(x + s * 1.4, y + s * 0.3); tx.lineTo(x + s * 1.05, y + s * 0.55); }
      else { for (let k = 0; k <= 30; k++) { const t = k / 30; const px = x + t * s * 2.2, py = y + Math.sin(t * 14) * s * 0.18 - Math.cos(t * 7) * s * 0.1; k ? tx.lineTo(px, py) : tx.moveTo(px, py); } }
      tx.stroke();
    }
    tx.globalAlpha = 1;
    knock(tx, patT, 0.55);
    g.drawImage(tmp, 0, 0, W, H);
    if (obstacles.length) {
      tx.clearRect(0, 0, W, H);
      for (const o of obstacles) drawObstacle(tx, o);
      knock(tx, patT, 0.35);
      g.drawImage(tmp, 0, 0, W, H);
    }
    drawFrame(g, r);
  }
  function drawFrame(g, r) {
    const f = FW;
    // ledge shadow on the slate
    const sh = g.createLinearGradient(0, trayY - 10, 0, trayY);
    sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.35)');
    g.fillStyle = sh; g.fillRect(0, trayY - 10, W, 10);
    g.fillStyle = COL.wood;

      chalk(g, (h) => { h.moveTo(s.x, s.y0); h.lineTo(s.x + Math.sin(s.t * 30) * 0.8, hy); }, COL.chalk, 2 * K, 0.85 * fade);
      if (s.t < s.dur) { g.fillStyle = COL.core; g.beginPath(); g.arc(s.x, hy, 2.6 * K, 0, TAU); g.fill(); }
    }
  }
  function drawTips(g) {
    for (const tp of tips) {
      if (tp.t < 0) continue;
      const a = easeOut(Math.min(1, tp.t / 0.4)) * Math.PI / 2 * tp.dir, al = tp.t < 0.9 ? 1 : 1 - (tp.t - 0.9) / 0.6;
      g.save(); g.translate(tp.x + tp.dir * a * 4 * K, tp.y + Math.abs(a) * 3 * K); g.rotate(a); g.globalAlpha = Math.max(0, al);
      drawRocketBody(g, '#9aa39d', tp.big, tp.seed); g.restore(); g.globalAlpha = 1;
    }
  }
  function drawPops(g) {
    for (const p of pops) {
      const e = Math.min(1, p.t / 0.25), sc = easeOutBack(e) * p.sz, al = p.t < 0.8 ? 1 : 1 - (p.t - 0.8) / 0.4;
      g.save(); g.translate(clamp(p.x, 70 * K, W - 70 * K), p.y - easeOut(Math.min(1, p.t / 1.2)) * 30 * K); g.scale(sc, sc);
      g.font = Math.round(17 * K) + 'px ' + FONT_BIG; const tw2 = g.measureText(p.txt).width;
      g.fillStyle = COL.slate; g.globalAlpha = 0.55 * Math.max(0, al); g.beginPath(); g.ellipse(0, 0, tw2 / 2 + 10 * K, 13 * K, 0, 0, TAU); g.fill(); g.globalAlpha = 1;
      ctext(g, p.txt, 0, 0, 17 * K, p.col, FONT_BIG, Math.max(0, al));
      g.restore();
    }
  }
  function drawSticks(g) {
    for (let i = 0; i < 3; i++) {
      if (!sticks[i]) continue;
      const s = stickRect(i), e = stickFx[i] > 0 ? easeOutBack(1 - stickFx[i]) : 1;
      g.save(); g.translate(s.x, s.y); g.rotate((i - 1) * 0.04); g.scale(e, e);
      g.fillStyle = 'rgba(0,0,0,0.3)'; g.beginPath(); g.ellipse(2, s.h * 0.55, s.l / 2, s.h * 0.35, 0, 0, TAU); g.fill();
      g.fillStyle = STICK_COLS[i]; g.beginPath(); g.moveTo(-s.l / 2 + s.h / 2, -s.h / 2); g.lineTo(s.l / 2 - s.h / 2, -s.h / 2); g.arc(s.l / 2 - s.h / 2, 0, s.h / 2, -Math.PI / 2, Math.PI / 2); g.lineTo(-s.l / 2 + s.h / 2, s.h / 2); g.arc(-s.l / 2 + s.h / 2, 0, s.h / 2, Math.PI / 2, Math.PI * 1.5); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(-s.l / 2 + s.h / 2, -s.h / 2 + 1, s.l - s.h, s.h * 0.22);
      g.fillStyle = 'rgba(0,0,0,0.14)'; g.fillRect(-s.l / 2 + s.h / 2, s.h * 0.15, s.l - s.h, s.h * 0.3);
      g.restore();
    }
  }
  function drawHUD(g) {
    const cx = W / 2, y = safeT + 30 * K;
    const bump = 1 + 0.14 * easeOut(S.scoreBump);
    g.save(); g.translate(cx, y); g.scale(bump, bump);
    jtext(g, fmt(S.score), 0, 0, 36 * K, COL.chalk, FONT_BIG, 1, W * 0.5);
    g.restore();
    g.font = Math.round(36 * K) + 'px ' + FONT_BIG;
    const sw = g.measureText(fmt(S.score)).width;
    ctext(g, 'best ' + fmt(Math.max(S.best, S.mode === 'over' ? 0 : S.best)), cx, y + 27 * K, 13 * K, COL.chalk, FONT_UI, 0.6);
    if (S.streak > 0) {
      const mb = 1 + 0.3 * easeOut(S.multBump);
      g.save(); g.translate(cx + sw / 2 + 14 * K, y + 2 * K); g.scale(mb, mb);
      ctext(g, fmtMult(multOf(S.streak)), 0, 0, 19 * K, COL.gold, FONT_BIG, 1, 'left');
      g.restore();
    }
    // spool meter
    const mw = 62 * K, mh = 9 * K, mx = W - FW - 12 * K - mw, my = safeT + 24 * K;
    const unlit = endS() - sparkS, left = clamp(1 - unlit / SPOOL, 0, 1);
    const flash = S.spoolFlash > 0 && Math.sin(S.real * 30) > 0;
    g.fillStyle = flash ? COL.coral : COL.mint; g.globalAlpha = 0.85; g.fillRect(mx + 2, my + 2, (mw - 4) * left, mh - 4); g.globalAlpha = 1;
    chalk(g, (h) => { h.moveTo(mx, my); h.lineTo(mx + mw, my + 0.5); h.lineTo(mx + mw - 0.5, my + mh); h.lineTo(mx, my + mh - 0.5); h.closePath(); }, flash ? COL.coral : COL.chalk, 1.4 * K, 0.85);
    ctext(g, 'spool', mx + mw / 2, my + mh + 11 * K, 11 * K, COL.chalk, FONT_UI, 0.55);
  }
  // cards: a wiped patch of slate (opaque, on the main canvas) with chalk on top (on the chalk layer)
  function cardBox() {
    if (S.mode === 'over') {
      if (S.overT < 0.15) return null;
      const w = Math.min(W * 0.84, 340 * K), h = 330 * K;
      return { x: (W - w) / 2, y: Math.max(FY, H * 0.46 - h / 2), w, h, a: easeOutBack(clamp((S.overT - 0.15) / 0.4, 0, 1)), seed: 77 };
    }
    if (S.mode === 'paused') { const w = Math.min(W * 0.7, 280 * K), h = 140 * K; return { x: (W - w) / 2, y: H * 0.42 - h / 2, w, h, a: 1, seed: 31 }; }
    return null;
  }
  function withCard(g, b, fn) { g.save(); g.translate(W / 2, b.y + b.h / 2); g.scale(b.a, b.a); g.translate(-W / 2, -(b.y + b.h / 2)); fn(); g.restore(); }
  function cardFill(g, b) {
    const rr = (x, y, w, h, r) => { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); };
    g.fillStyle = COL.card;
    g.globalAlpha = 0.45; rr(b.x - 10 * K, b.y - 8 * K, b.w + 20 * K, b.h + 16 * K, 26 * K); g.fill();
    g.globalAlpha = 1; rr(b.x - 2, b.y - 2, b.w + 4, b.h + 4, 16 * K); g.fill();
  }
  function cardBorder(g, b) {
    const r = rng(b.seed), x = b.x, y = b.y, w = b.w, h = b.h;
    chalk(g, (hh) => {
      const j = () => (r() - 0.5) * 3;
      hh.moveTo(x + 6 + j(), y + j()); hh.lineTo(x + w + j(), y + 2 + j()); hh.lineTo(x + w - 2 + j(), y + h + j()); hh.lineTo(x + j(), y + h - 2 + j()); hh.lineTo(x + 2 + j(), y + 8 + j());
    }, COL.chalk, 2 * K, 0.85);
    chalk(g, (hh) => { hh.moveTo(x + 14, y - 5); hh.lineTo(x + w * 0.4, y - 4); }, COL.chalk, 1.2 * K, 0.45);
  }
  function drawOverCard(g, b) {
    const x = b.x, y = b.y, w = b.w, h = b.h;
    cardBorder(g, b);
    jtext(g, "Show's over", W / 2, y + 40 * K, 30 * K, COL.chalk, FONT_BIG, 1, w * 0.7);
    jtext(g, fmt(S.score), W / 2, y + 98 * K, 54 * K, COL.gold, FONT_BIG, 1, w * 0.8);
    ctext(g, S.newBest ? 'New best!' : 'best ' + fmt(S.best), W / 2, y + 140 * K, 16 * K, S.newBest ? COL.gold : COL.chalk, FONT_UI, S.newBest ? 1 : 0.7);
    if (S.newBest) {
      const sx = x + w - 20 * K, sy = y + 4 * K, rr = 24 * K, rot = Math.sin(S.real * 2) * 0.15;
      g.save(); g.translate(sx, sy); g.rotate(rot);
      chalk(g, (hh) => { for (let i = 0; i <= 10; i++) { const ang = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? rr * 0.45 : rr; i ? hh.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad) : hh.moveTo(Math.cos(ang) * rad, Math.sin(ang) * rad); } }, COL.gold, 3 * K, 1);
      g.restore();
    }
    const mins = Math.floor(S.t / 60), secs = Math.floor(S.t % 60);
    const stats = [['rockets lit', fmt(S.lit)], ['perfects', fmt(S.perfects)], ['longest streak', fmt(S.longest)], ['show length', mins + ':' + (secs < 10 ? '0' : '') + secs]];
    for (let i = 0; i < 4; i++) {
      const sx = x + w * (i % 2 ? 0.72 : 0.28), sy = y + (180 + Math.floor(i / 2) * 52) * K;
      jtext(g, stats[i][1], sx, sy, 22 * K, COL.chalk, FONT_BIG);
      ctext(g, stats[i][0], sx, sy + 20 * K, 12 * K, COL.chalk, FONT_UI, 0.6);
    }
    if (S.overT > 0.6) ctext(g, 'Tap to draw again', W / 2, y + h - 30 * K, 18 * K, COL.mint, FONT_UI, 0.75 + 0.25 * Math.sin(S.real * 4));
  }
  function drawPauseCard(g, b) {
    cardBorder(g, b);
    jtext(g, 'Paused', W / 2, b.y + 48 * K, 32 * K, COL.chalk, FONT_BIG);
    ctext(g, 'Tap to carry on', W / 2, b.y + 98 * K, 17 * K, COL.mint, FONT_UI, 0.75 + 0.25 * Math.sin(S.real * 4));
  }
  // title: the word, a fuse underline with a running spark, then a burst
  let titleSpark = null;
  function titleFusePts() {
    const fs = Math.min(84, W * 0.2), cy = H * 0.34 + fs * 0.62, pts = [];
    for (let i = 0; i <= 80; i++) { const t = i / 80; pts.push({ x: W * (0.14 + 0.72 * t), y: cy + Math.sin(t * TAU * 2.2) * fs * 0.11 * (0.4 + t) }); }
    return pts;
  }
  function drawTitle(g) {
    const t = S.titleT, fs = Math.min(84, W * 0.2), cy = H * 0.34;
    const reveal = clamp(t / 0.9, 0, 1);
    g.save(); g.beginPath(); g.rect(0, cy - fs, reveal >= 1 ? W : W * (0.1 + 0.9 * reveal), fs * 2); g.clip();
    jtext(g, 'Wickwalk', W / 2, cy, fs, COL.mint, FONT_BIG, 1, W * 0.84);
    g.restore();
    const pts = titleFusePts(), cyc = 4.6, ph = ((t - 1) % cyc + cyc) % cyc;
    const run = t < 1 ? 0 : clamp(ph / 2.6, 0, 1), k = Math.floor(run * (pts.length - 1));
    titleSpark = null;
    if (t >= 1 && run < 1) titleSpark = pts[k];
    const unl = pts.slice(k);
    if (unl.length > 1 && run < 1) drawCord(g, unl, COL.cord, COL.cordTick);
    g.strokeStyle = COL.ash; g.lineWidth = 2.2 * K; g.globalAlpha = 0.7; g.beginPath();
    for (let i = 0; i <= k && i < pts.length; i++) i ? g.lineTo(pts[i].x, pts[i].y) : g.moveTo(pts[i].x, pts[i].y);
    g.stroke(); g.globalAlpha = 1;
    const loop = Math.floor((t - 1) / cyc);
    if (t >= 1 && run >= 1 && S.titleBurst !== loop) {
      S.titleBurst = loop;
      burstAt(W * 0.36, cy - fs * 1.15, COL.mint, 'Perfect', false);
      burstAt(W * 0.66, cy - fs * 1.35, COL.pink, 'Good', false);
    }
    ctext(g, 'Draw the fuse. Wiggle to wait.', W / 2, cy + fs * 1.25, 17 * K, COL.chalk, FONT_UI, 0.85);
    ctext(g, 'Light every rocket as its ring closes.', W / 2, cy + fs * 1.25 + 26 * K, 15 * K, COL.chalk, FONT_UI, 0.6);
    // a sample rocket with its cue ring
    const rx = W / 2, ry = H * 0.62, fake = { x: (rx - FX) / U, y: (ry - FY) / U, rr: 0.065, lr: 0.045, born: 0, T: 4, col: COL.pink, big: false, seed: 3, tick: null, pop: 1 };
    const saveT = S.t; S.t = (t % 4.5); fake.tick = 4 + Math.sin(t * 1.3) * 0.3;
    drawRocket(g, fake, false); S.t = saveT;
    jtext(g, 'Tap to start', W / 2, H * 0.74, 22 * K, COL.mint, FONT_BIG, 0.78 + 0.22 * Math.sin(S.real * 3.5));
    if (S.best > 0) ctext(g, 'best ' + fmt(S.best), W / 2, H * 0.74 + 32 * K, 14 * K, COL.chalk, FONT_UI, 0.6);
  }
  function drawHints(g) {
    if (AP.on) return;
    const y = FY + 14 * K;
    const plate = (lines) => {
      g.font = Math.round(15 * K) + 'px ' + FONT_UI;
      const w = g.measureText('Drag from the glowing end of the fuse').width + 28 * K, h = (lines * 19 + 12) * K;
      g.fillStyle = COL.card; g.globalAlpha = 0.92; g.beginPath();
      if (g.roundRect) g.roundRect(W / 2 - w / 2, y - 14 * K, w, h, 12 * K); else g.rect(W / 2 - w / 2, y - 14 * K, w, h);
      g.fill(); g.globalAlpha = 1;
    };
    if (!S.drew) {
      plate(1);
      const e = endPt(), ph = (S.real % 1.8) / 1.8;
      const gx = X(e.x) + Math.sin(ph * TAU * 1.5) * 26 * K, gy = Y(e.y) - ph * 70 * K;
      g.fillStyle = COL.chalk; g.globalAlpha = 0.35 * (1 - ph); g.beginPath(); g.arc(gx, gy, 13 * K, 0, TAU); g.fill(); g.globalAlpha = 1;
      ctext(g, 'Drag from the glowing end of the fuse', W / 2, y, 15 * K, COL.chalk, FONT_UI, 0.8);
    } else if (S.tutorial && S.t < 45) {
      plate(2);
      ctext(g, 'Wiggle to wait, go straight to hurry.', W / 2, y, 14 * K, COL.chalk, FONT_UI, 0.7);
      ctext(g, 'Land the spark tick in the gold notch.', W / 2, y + 19 * K, 14 * K, COL.gold, FONT_UI, 0.7);
    }
  }
  function drawGame(g) {
    drawLantern(g);
    for (const e of erased) {
      const al = 1 - e.t / 0.25;
      g.strokeStyle = COL.dust; g.lineWidth = 9 * K; g.globalAlpha = 0.18 * al; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); e.pts.forEach((p, i) => (i ? g.lineTo(X(p.x), Y(p.y)) : g.moveTo(X(p.x), Y(p.y)))); g.stroke();
      g.strokeStyle = COL.cord; g.lineWidth = 1.5 * K; g.globalAlpha = 0.6 * al; g.stroke(); g.globalAlpha = 1;
    }
    drawFuse(g);
    // twin links
    g.setLineDash([2 * K, 6 * K]); g.strokeStyle = COL.chalk; g.lineWidth = 1.6 * K; g.globalAlpha = 0.55; g.beginPath();
    for (const r of rockets) if (r.twin && r.twin.st === 'wait' && r.id < r.twin.id) { g.moveTo(X(r.x), Y(r.y)); g.lineTo(X(r.twin.x), Y(r.twin.y)); }
    g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
    const drawing = !!drag || (AP.on && AP.qi < AP.q.length);
    for (const r of rockets) drawRocket(g, r, drawing);
    drawTips(g);
    drawStreaks(g);
    // fuse end: a glowing white ring to grab
    if (S.mode === 'play') {
      const e = endPt(), ex = X(e.x), ey = Y(e.y);
      if (!S.stuck || sparkI < fuse.length - 1) {
        const pu = 0.5 + 0.5 * Math.sin(S.real * 5);
        g.strokeStyle = COL.chalk; g.lineWidth = 1.6 * K; g.globalAlpha = (S.drew ? 0.35 : 0.6) + 0.3 * pu;
        g.beginPath(); g.arc(ex, ey, (7 + 2 * pu) * K, 0, TAU); g.stroke(); g.globalAlpha = 1;
      }
      if (S.endPulse > 0) { g.strokeStyle = COL.chalk; g.lineWidth = 2.5 * K; g.globalAlpha = S.endPulse; g.beginPath(); g.arc(ex, ey, (8 + (1 - S.endPulse) * 26) * K, 0, TAU); g.stroke(); g.globalAlpha = 1; }
      if (S.stuck && S.smoulder > 0) {
        const sp = sparkPos(), f = clamp(S.smoulder / 1.5, 0, 1);
        g.strokeStyle = COL.coral; g.globalAlpha = 0.3; g.lineWidth = 3 * K; g.beginPath(); g.arc(X(sp.x), Y(sp.y), 14 * K, 0, TAU); g.stroke();
        g.globalAlpha = 1; g.beginPath(); g.arc(X(sp.x), Y(sp.y), 14 * K, -Math.PI / 2, -Math.PI / 2 + f * TAU); g.stroke();
      }
      if (S.blockX && S.real - S.blockX.t < 0.5) {
        const bxp = X(S.blockX.x), byp = Y(S.blockX.y), s = 8 * K;
        chalk(g, (h) => { h.moveTo(bxp - s, byp - s); h.lineTo(bxp + s, byp + s); h.moveTo(bxp + s, byp - s); h.lineTo(bxp - s, byp + s); }, COL.coral, 3 * K, 1 - (S.real - S.blockX.t) / 0.5);
      }
    }
    for (const c of clouds) drawCloud(g, c);
    drawParts(g);
    drawPops(g);
    if (S.mode === 'play') drawHints(g);
  }

  function render() {
    const g = ctx;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    g.drawImage(bg, 0, 0, W, H);
    lx.clearRect(0, 0, W, H);
    const sh = S.shake > 0 ? 3 : 0, ox = sh ? (Math.random() - 0.5) * 2 * sh : 0, oy = sh ? (Math.random() - 0.5) * 2 * sh : 0;
    lx.save(); lx.translate(ox, oy);
    if (S.mode === 'title') { drawTitle(lx); drawParts(lx); }
    else drawGame(lx);
    lx.restore();
    if (S.mode !== 'title') { drawHUD(lx); }
    drawSticks(lx);
    knock(lx, patL, 0.35);
    g.drawImage(layer, 0, 0, W, H);
    // light (not chalk): spark glow, lantern glow, demo finger
    let sp = null;
    if (S.mode === 'play') { const p = sparkPos(); sp = { x: X(p.x) + ox, y: Y(p.y) + oy }; }
    else if (S.mode === 'title' && titleSpark) sp = titleSpark;
    if (sp) {
      const fl = 1 + 0.18 * Math.sin(S.real * 41) + 0.1 * Math.random(), R = 14 * K * fl;
      const gr = g.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, R);
      gr.addColorStop(0, 'rgba(255,246,200,0.55)'); gr.addColorStop(0.4, 'rgba(255,201,90,0.25)'); gr.addColorStop(1, 'rgba(255,156,74,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(sp.x, sp.y, R, 0, TAU); g.fill();
      g.fillStyle = COL.core; g.beginPath(); g.arc(sp.x, sp.y, 2.6 * K * fl, 0, TAU); g.fill();
    }
    if (S.mode === 'play' || S.mode === 'paused') {
      const lxp = X(0.5), lyp = Y(FH - 0.06), fl = 0.8 + 0.2 * Math.sin(S.real * 7.3) * Math.sin(S.real * 3.1);
      const gr = g.createRadialGradient(lxp, lyp, 0, lxp, lyp, 34 * K);
      gr.addColorStop(0, 'rgba(247,223,110,' + (0.22 * fl).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(247,223,110,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(lxp, lyp, 34 * K, 0, TAU); g.fill();
    }
    const drawingAP = AP.on && S.mode === 'play' && AP.qi < AP.q.length;
    AP.fingerA = clamp(AP.fingerA + (drawingAP ? 1 / 60 * 6 : -1 / 60 * 3), 0, 1);
    if (AP.fingerA > 0 && S.mode === 'play') {
      const fx = X(AP.fx), fy = Y(AP.fy);
      g.fillStyle = 'rgba(242,239,228,' + (0.22 * AP.fingerA).toFixed(3) + ')'; g.beginPath(); g.arc(fx, fy, 17 * K, 0, TAU); g.fill();
      g.fillStyle = 'rgba(242,239,228,' + (0.3 * AP.fingerA).toFixed(3) + ')'; g.beginPath(); g.arc(fx, fy, 9 * K, 0, TAU); g.fill();
    }
    const cb = cardBox();
    if (cb) {
      withCard(g, cb, () => cardFill(g, cb));
      lx.clearRect(0, 0, W, H);
      withCard(lx, cb, () => (S.mode === 'over' ? drawOverCard(lx, cb) : drawPauseCard(lx, cb)));
      knock(lx, patL, 0.3);
      g.drawImage(layer, 0, 0, W, H);
    }
  }

  let ctx = null;
  ctx = kit.fitCanvas(cv, layout);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
    update(dt);
    if (AP.on && !AP.warp2 && S.mode === 'play' && performance.now() - AP.onAt > 4500 && S.t < 150) { AP.warp2 = true; warpTo(160); }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.__game = {
    state: () => ({ mode: S.mode, score: S.score, best: S.best, lives: S.lives, t: Math.round(S.t * 10) / 10, lit: S.lit, perfects: S.perfects, streak: S.streak, longest: S.longest, rockets: rockets.length }),
    demo: (on) => {
      AP.on = !!on; AP.q = []; AP.qi = 0; AP.check = 0;
      if (AP.on) {
        AP.onAt = performance.now(); AP.warp2 = false;
        if (S.mode === 'title') startGame();
        if (S.mode === 'play' && S.t < 30) warpTo(88);
      }
    },
    sim: (sec) => { const end = S.t + sec; S.warp = true; let n = 0; while (S.mode === 'play' && S.t < end && n++ < 200000) update(1 / 60); S.warp = false; return window.__game.state(); },
    start: () => startGame(),
    dbg: () => JSON.stringify(Object.assign({ unlit: +(endS() - sparkS).toFixed(3), end: [+endPt().x.toFixed(3), +endPt().y.toFixed(3)], n: fuse.length, spark: +sparkS.toFixed(3), FH: +FH.toFixed(4), U, FX, FY }, DBG))
  };
})();
</script>
