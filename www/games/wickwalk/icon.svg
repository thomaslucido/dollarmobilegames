  <!-- ash behind the spark -->
  <path d="M30 506 C 60 470, 70 440, 118 408" fill="none" stroke="#6f7a74" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 14" filter="url(#chalk)"/>

  <!-- unlit fuse: wiggle toward the rocket -->
  <g fill="none" stroke-linecap="round" filter="url(#chalk)">
    <path id="fuse" d="M126 402 C 170 360, 196 312, 236 340 S 268 448, 314 430 S 360 352, 400 380" stroke="#e9dcc0" stroke-width="15"/>
    <path d="M126 402 C 170 360, 196 312, 236 340 S 268 448, 314 430 S 360 352, 400 380" stroke="#b8a98a" stroke-width="9" stroke-dasharray="3 13"/>
  </g>

  <!-- rocket with mint cue ring -->
  <g filter="url(#chalk)" stroke-linecap="round">
    <circle cx="430" cy="404" r="44" fill="none" stroke="#f2efe4" stroke-width="7" opacity="0.5"/>
    <path d="M430 360 A44 44 0 1 1 392 382" fill="none" stroke="#66e0b4" stroke-width="10"/>
    <line x1="430" y1="352" x2="430" y2="368" stroke="#f7df6e" stroke-width="10"/>
    <circle cx="430" cy="404" r="18" fill="#66e0b4"/>
    <path d="M430 384 L438 404 L430 424 L422 404 Z" fill="#f2efe4"/>
