  <!-- spark -->
  <circle cx="126" cy="402" r="64" fill="url(#halo)"/>
  <g stroke="#fff6c8" stroke-linecap="round" filter="url(#chalk)">
    <line x1="126" y1="366" x2="126" y2="438" stroke-width="9"/>
    <line x1="90" y1="402" x2="162" y2="402" stroke-width="9"/>
    <line x1="104" y1="380" x2="148" y2="424" stroke-width="6" stroke="#ffc95a"/>
    <line x1="148" y1="380" x2="104" y2="424" stroke-width="6" stroke="#ffc95a"/>
  </g>
  <circle cx="126" cy="402" r="15" fill="#fff6c8"/>
  <g fill="#ffc95a">
    <circle cx="172" cy="372" r="5"/>
    <circle cx="86" cy="356" r="4"/>
    <circle cx="160" cy="446" r="4" fill="#ff9c4a"/>
    <circle cx="78" cy="436" r="5" fill="#ff9c4a"/>
  </g>
</svg>
