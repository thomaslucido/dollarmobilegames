      <line x1="363.9" y1="188.2" x2="443.8" y2="192.2" stroke="#f5a3c0" stroke-width="14"/>
      <circle cx="463.8" cy="193.2" r="6.5" fill="#f5a3c0" stroke="none"/>
      <line x1="367.0" y1="208.3" x2="415.8" y2="231.4" stroke="#f7df6e" stroke-width="14"/>
      <circle cx="433.9" cy="240.0" r="6.5" fill="#f7df6e" stroke="none"/>
      <line x1="349.5" y1="218.6" x2="403.2" y2="278.0" stroke="#f5a3c0" stroke-width="14"/>
      <circle cx="416.6" cy="292.8" r="6.5" fill="#f5a3c0" stroke="none"/>
      <line x1="337.5" y1="235.0" x2="355.6" y2="285.8" stroke="#f7df6e" stroke-width="14"/>
      <circle cx="362.3" cy="304.7" r="6.5" fill="#f7df6e" stroke="none"/>
      <line x1="317.8" y1="229.9" x2="313.8" y2="309.8" stroke="#f5a3c0" stroke-width="14"/>
      <circle cx="312.8" cy="329.8" r="6.5" fill="#f5a3c0" stroke="none"/>
      <line x1="297.7" y1="233.0" x2="274.6" y2="281.8" stroke="#f7df6e" stroke-width="14"/>
