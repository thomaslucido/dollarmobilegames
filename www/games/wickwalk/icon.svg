      <circle cx="176.2" cy="178.8" r="6.5" fill="#f5a3c0" stroke="none"/>
      <line x1="273.0" y1="163.7" x2="224.2" y2="140.6" stroke="#f7df6e" stroke-width="14"/>
      <circle cx="206.1" cy="132.0" r="6.5" fill="#f7df6e" stroke="none"/>
      <line x1="290.5" y1="153.4" x2="236.8" y2="94.0" stroke="#f5a3c0" stroke-width="14"/>
      <circle cx="223.4" cy="79.2" r="6.5" fill="#f5a3c0" stroke="none"/>
