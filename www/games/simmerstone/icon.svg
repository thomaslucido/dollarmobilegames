  <path d="M96 392Q256 372 416 392" fill="none" stroke="#a9e0cb" stroke-width="8" stroke-linecap="round"/>
  <path d="M36 390A220 96 0 0 0 476 390L452 390A196 76 0 0 1 60 390Z" fill="#9b8f9a"/>
  <path d="M48 396A208 86 0 0 0 464 396" fill="none" stroke="#7a6e7a" stroke-width="4" stroke-dasharray="11 9"/>

  <!-- an ember stone on the rim -->
  <ellipse cx="440" cy="330" rx="30" ry="21" fill="#e8624f"/>
  <ellipse cx="432" cy="323" rx="11" ry="6" fill="#ffb08a"/>

  <!-- felt snowflakes -->
  <g fill="#fbf7ff">
    <circle cx="60" cy="70" r="9"/><circle cx="150" cy="40" r="6"/><circle cx="420" cy="58" r="8"/>
    <circle cx="474" cy="120" r="6"/><circle cx="40" cy="170" r="6"/><circle cx="360" cy="100" r="5"/>
