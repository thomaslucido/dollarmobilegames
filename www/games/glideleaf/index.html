<!doctype html>
<html lang="en">

  html,body{margin:0;height:100%;overflow:hidden;background:#a8d8e8;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:Futura,"Century Gothic","Avenir Next","Trebuchet MS",sans-serif}
  canvas{display:block}
  #probe{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}

</head>
<body>
<canvas id="c"></canvas>
<div id="probe"></div>
<script src="../../shared/game-kit.js"></script>
<script>
(function () {
  'use strict';
  const kit = GameKit.init({ slug: 'glideleaf', backColor: '#fff7e6' });
  const cv = document.getElementById('c');
  const probe = document.getElementById('probe');
  const FONT = 'Futura, "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif';
  const TAU = Math.PI * 2;

  // ---------- palette (DESIGN.md) ----------
  const C = {
    sky: '#a8d8e8', streak: '#c2e5f0', sun: '#f7f1dc', far: '#d4e9ef', farMark: '#b5d2dc',
    bark: '#f5f2ea', barkShade: '#dcd6ca', barkMark: '#2d2b36',
    verm: '#e5481f', pers: '#f3892b', burg: '#9b2f4a', olive: '#7f9a3a', veinBase: '#3a1e17',
    gold: '#f6c445', goldHi: '#fff1b8', wet: '#6a4636', wetGloss: '#a07a62', drop: '#dff3f8',
    brittle: '#d8b98a', crack: '#8e6c47', cap: '#7a5130', nut: '#c98b4a',
    letter: '#fff7e6', letterDark: '#3a1e17', ink: '#2c2433', soft: '#6b5f73',
    fur: '#8b8796', belly: '#f4ead8', memb: '#a6a1b0', tail: '#7a7686', tailTip: '#c9c4d2', eye: '#1f1c26', nose: '#e88a8a',
    cream: '#fff7e6', skyShade: '#7fb3c6', pile: ['#c9622b', '#9b2f4a', '#e0a03a', '#7f9a3a'], soil: '#5a3a2a'
  };
  const PLAIN = [C.verm, C.pers, C.burg, C.olive];

  // ---------- small helpers ----------
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const easeOut = (u) => 1 - Math.pow(1 - u, 3);
  const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const fmtMult = (m) => (Math.abs(m - Math.round(m)) < 1e-6 ? String(Math.round(m)) : m.toFixed(1));
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function mix(a, b, u) { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * u)).join(',') + ')'; }

  // ---------- layout ----------
  let VW = 0, VH = 0, W = 0, H = 0, OX = 0, DPR = 1, ctx = null;
  let safeT = 0, safeB = 0, BAN_Y = 0, BAN_H = 0, SEL_TOP = 0, G = 0, LR = 0, HIT = 0, GAP = 0;
  const bgCv = document.createElement('canvas');
  const pileCv = document.createElement('canvas');
  let pileTop = 0, pileLumps = [];
  let tile = null, pattern = null;

  // ---------- game state ----------
  const S = {
    mode: 'title', clock: 0, t: 0, titleT: 0, overT: 0, score: 0, lives: 3, c: 0, words: 0, longest: '', top: null,
    lastWord: null, shake: 0, slowT: 0, noWord: 0, deadT: 0, newBest: false, bestAtStart: 0
  };
  const Q = { state: 'sit', leaf: null, x: 0, y: 0, vy: 0, squash: 0, blinkIn: 2.5, blinkT: 0, flickIn: 3, flickT: 0, ang: 0, target: null, sp: null };
  let leaves = [], parts = [], pops = [];
  let rowY = 0, rowParity = 0, LID = 0;
  let tracing = false, route = [], ptr = null, lastPt = { x: 0, y: 0 }, finger = { x: 0, y: 0 }, failRoute = [], failT = 0;
  let GL = null;              // current glide
  const HOP = 0.11;           // seconds per hop

  // ---------- word list ----------
  let WORDS = null, PREFIX = null, START3 = null, COMMON = new Set();
  const VOW = new Set(['a', 'e', 'i', 'o', 'u']);
  function loadWords() {
    const src = window.GLIDE_WORDS;
    if (!src) { setTimeout(loadWords, 120); return; }
    const words = new Set(), pre = new Set();
    const lens = [3, 4, 5, 6, 7, 8];
    let k = 0;
    (function step() {
      const n = lens[k], s = src[n] || '';
      for (let i = 0; i + n <= s.length; i += n) {
        const w = s.substr(i, n); words.add(w);
        for (let j = 1; j < n; j++) pre.add(w.substr(0, j));
      }
      k++;
      if (k < lens.length) setTimeout(step, 0);
      else {
        const st = {};
        for (let i = 0; i < src[3].length; i += 3) {
          const w = src[3].substr(i, 3);
          if (w === 'qua') { st.qu = ['qua']; continue; }
          if (w.includes('q')) continue;
          const rest = w.slice(1);
          if ([...rest].every((ch) => WEIGHTS[ch] >= 2) && [...rest].some((ch) => VOW.has(ch))) (st[w[0]] = st[w[0]] || []).push(w);
        }
        const cm = window.GLIDE_COMMON || {};
        for (const n in cm) for (let i = 0; i + (+n) <= cm[n].length; i += +n) COMMON.add(cm[n].substr(i, +n));
        START3 = st; WORDS = words; PREFIX = pre;
      }
    })();
  }
  const isWord = (w) => !!WORDS && w.length >= 3 && w.length <= 8 && WORDS.has(w);

  // ---------- letters and scoring ----------
  const WEIGHTS = { e: 12, a: 9, o: 8, i: 8, u: 3, t: 7, n: 6, s: 6, r: 6, l: 5, d: 4, h: 3, c: 3, m: 3, p: 3, g: 2.5, b: 2, f: 2, w: 1.5, y: 1.5, k: 1.2, v: 1, j: 0.3, x: 0.3, qu: 0.3, z: 0.3 };
  const PTS = { a: 1, e: 1, i: 1, o: 1, u: 1, l: 1, n: 1, r: 1, s: 1, t: 1, b: 2, c: 2, d: 2, g: 2, h: 2, m: 2, p: 2, y: 2, f: 3, k: 3, v: 3, w: 3, j: 4, x: 4, z: 4, qu: 4 };
  const LEN_MULT = [0, 0, 0, 1, 1.5, 2, 3, 4, 5];
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];
  const LETTERS = Object.keys(WEIGHTS);
  function weighted(force) {
    let tot = 0;
    for (const L of LETTERS) if (!force || (force === 'v') === VOW.has(L)) tot += WEIGHTS[L];
    let r = Math.random() * tot;
    for (const L of LETTERS) {
      if (force && (force === 'v') !== VOW.has(L)) continue;
      r -= WEIGHTS[L]; if (r <= 0) return L;
    }
    return 'e';
  }
  function pickLetter(x, y) {
    const near = [];
    let quOn = false;
    for (const l of leaves) {
      if (l.dead) continue;
      if (l.letter === 'qu') quOn = true;
      if (Math.hypot(l.x - x, l.y - y) < 0.45 * W) near.push(l);
    }
    let force = null;
    if (near.length >= 2) {
      const share = near.filter((l) => VOW.has(l.letter)).length / near.length;
      if (share < 0.3) force = 'v'; else if (share > 0.55) force = 'c';
    }
    const counts = {};
    near.forEach((l) => { counts[l.letter] = (counts[l.letter] || 0) + 1; });
    for (let k = 0; k < 40; k++) {
      const L = weighted(force);
      if ((counts[L] || 0) >= 2) continue;
      if (L === 'qu' && quOn) continue;
      return L;
    }
    return force === 'c' ? 'n' : 'a';
  }
  const routeWord = (r) => r.map((l) => l.letter).join('');
  function scoreRoute(r, chained, cAfter) {
    let sum = 0;
    for (const l of r) sum += PTS[l.letter] * (l.kind === 'gold' ? 2 : 1);
    const len = routeWord(r).length;
    const mult = chained ? Math.min(3, 1 + 0.5 * cAfter) : 1;
    return { pts: Math.round(10 * sum * (LEN_MULT[len] || 0) * mult), mult };
  }

  // ---------- difficulty (t = seconds played) ----------
  function vFall(t) {
    return Math.min(0.05, 0.012 + 0.00009 * t);
  }
  const reach = () => Math.max(0.225, 0.26 - 0.0002 * S.t) * W;
  const swayA = (t) => Math.min(0.03, 0.018 + 0.00006 * t) * W;

  // ---------- leaf shapes (unit space, radius about 1) ----------
  const MAPLE = [[0, -1.05], [0.18, -0.62], [0.38, -0.78], [0.36, -0.40], [0.72, -0.58], [0.62, -0.20], [1.0, -0.18], [0.74, 0.10], [0.88, 0.30], [0.50, 0.36], [0.56, 0.64], [0.18, 0.46], [0, 0.52]];
  function shapePts(shape) {
    if (shape === 0) {
      const left = MAPLE.slice(1, -1).reverse().map(([x, y]) => [-x, y]);
      return MAPLE.concat(left).map(([x, y]) => [x, y + 0.18]);
    }
    if (shape === 1) { // pointed birch oval
      const pts = [], N = 12, k = 0.8 / (Math.pow(0.643, 0.9) * Math.pow(0.357, 0.5));
      for (let i = 0; i <= N; i++) { const s = i / N; pts.push([k * Math.pow(s, 0.9) * Math.pow(1 - s, 0.5), -0.98 + 1.8 * s]); }
      for (let i = N - 1; i >= 1; i--) pts.push([-pts[i][0], pts[i][1]]);
      return pts;
    }
    const pts = [], N = 26; // round-hearted aspen
    for (let i = 0; i < N; i++) {
      const a = i / N * TAU, ad = Math.min(a, TAU - a);
      const r = 0.86 + 0.16 * Math.exp(-Math.pow(ad / 0.26, 2)) - 0.24 * Math.exp(-Math.pow((a - Math.PI) / 0.34, 2));
      pts.push([r * Math.sin(a), -r * Math.cos(a) * 0.95 + 0.02]);
    }
    return pts;
  }
  const BASE_PTS = [shapePts(0), shapePts(1), shapePts(2)];
  const STEM_Y = [0.70, 0.82, 0.62];
  function buildPath(shape, seed) {
    const r = rng(seed);
    const pts = BASE_PTS[shape].map(([x, y]) => { const j = 1 + (r() - 0.5) * 0.03; return [x * j + (r() - 0.5) * 0.02, y * j + (r() - 0.5) * 0.02]; });
    const p = new Path2D();
    if (shape === 0) { p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); return p; }
    const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    let m = mid(pts[n - 1], pts[0]); p.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n], mm = mid(a, b); p.quadraticCurveTo(a[0], a[1], mm[0], mm[1]); }
    p.closePath();
    return p;
  }
  function veinPath(shape) {
    const p = new Path2D();
    if (shape === 0) {
      p.moveTo(0, 0.62); p.quadraticCurveTo(0.03, 0, 0, -0.62);
      p.moveTo(0, 0.5); p.quadraticCurveTo(0.25, 0.05, 0.62, -0.3);
      p.moveTo(0, 0.5); p.quadraticCurveTo(-0.25, 0.05, -0.62, -0.3);
    } else if (shape === 1) {
      p.moveTo(0, 0.7); p.quadraticCurveTo(0.05, 0, 0, -0.72);
      p.moveTo(0.02, 0.15); p.quadraticCurveTo(0.2, 0.0, 0.4, -0.25);
      p.moveTo(0.01, 0.38); p.quadraticCurveTo(-0.2, 0.25, -0.42, 0.02);
    } else {
      p.moveTo(0, 0.55); p.quadraticCurveTo(0.04, 0, 0, -0.7);
      p.moveTo(0, 0.3); p.quadraticCurveTo(0.22, 0.12, 0.52, -0.15);
      p.moveTo(0, 0.3); p.quadraticCurveTo(-0.22, 0.12, -0.52, -0.15);
    }
    return p;
  }
  const VEINS = [veinPath(0), veinPath(1), veinPath(2)];
  const STEMS = STEM_Y.map((y) => { const p = new Path2D(); p.moveTo(0, y); p.quadraticCurveTo(0.06, y + 0.14, 0.02, y + 0.28); return p; });
  const CRACKS = (() => { const p = new Path2D(); p.moveTo(-0.08, 0.5); p.lineTo(0.06, 0.22); p.lineTo(-0.06, -0.06); p.lineTo(0.1, -0.38); p.moveTo(0.42, 0.12); p.lineTo(0.22, 0.02); p.lineTo(0.3, -0.18); p.moveTo(-0.45, -0.05); p.lineTo(-0.25, 0.08); return p; })();
  const MINI = buildPath(0, 99);
  const TINY = (() => { const p = new Path2D(); p.moveTo(-0.6, -0.5); p.lineTo(0.7, -0.2); p.lineTo(0.1, 0.7); p.closePath(); return p; })();

  function makeLeaf(x0, y, kind, letter, t) {
    const shape = (Math.random() * 3) | 0;
    const color = kind === 'gold' ? C.gold : kind === 'wet' ? C.wet : kind === 'brittle' ? C.brittle : kind === 'acorn' ? C.olive : PLAIN[(Math.random() * 4) | 0];
    const P = 2.8 + Math.random(), ph = Math.random() * TAU, s = Math.sin(TAU * S.clock / P + ph);
    return {
      id: ++LID, x0, x: x0 + swayA(t) * s, y, kind, letter, shape, color, vein: mix(color.length === 7 ? color : '#7f9a3a', C.veinBase, 0.3),
      path: buildPath(shape, (Math.random() * 1e9) | 0), P, ph, rot0: (Math.random() - 0.5) * 0.5, rot: 0, lift: 1,
      brittleT: -1, flip: 0, dropT: Math.random() * 1.5, dead: false, reserved: false, got: false, bob: 0, tw: Math.random() * 6
    };
  }
  function pickKind(t) {
    const r = Math.random();
    let acc = 0;
    if (S.mode === 'play' && t >= 30 && S.lives < 3 && !leaves.some((l) => l.kind === 'acorn' && !l.dead)) { acc += 0.03; if (r < acc) return 'acorn'; }
    acc += 0.06; if (r < acc) return 'gold';
    const wet = t < 45 ? 0 : Math.min(0.12, 0.06 + 0.06 * (t - 45) / 105);
    acc += wet; if (r < acc) return 'wet';
    const br = t < 90 ? 0 : Math.min(0.14, 0.08 + 0.06 * (t - 90) / 110);
    acc += br; if (r < acc) return 'brittle';
    return 'plain';
  }
  function spawnRow(y, t) {
    const even = (rowParity++ % 2) === 0;
    const xs = even ? [0.1, 0.3, 0.5, 0.7, 0.9] : [0.2, 0.4, 0.6, 0.8];
    const fill = Math.max(0.8, 1 - 0.001 * t);
    for (const fx of xs) {
      if (Math.random() > fill) continue;
      const x0 = (fx + (Math.random() * 2 - 1) * 0.025) * W, yy = y + (Math.random() * 2 - 1) * 0.025 * W;
      const kind = pickKind(t);
      leaves.push(makeLeaf(x0, yy, kind, pickLetter(x0, yy), t));
    }
  }
  function fillField(t) {
    leaves = []; rowParity = 0; rowY = G - 0.3 * GAP + GAP;
    while (rowY - GAP >= -0.12 * W) { rowY -= GAP; spawnRow(rowY, t); }
  }
  const selectable = (l) => !l.dead && l.y >= SEL_TOP && l.y <= G;

  // ---------- particles ----------
  function puff(x, y, col, n) {
    for (let i = 0; i < n; i++) parts.push({ k: 'puff', x: x + (Math.random() - 0.5) * LR, y, vx: (Math.random() - 0.5) * 40, vy: -20 - Math.random() * 30, r: 3 + Math.random() * 4, life: 0.5, max: 0.5, col });
  }
  function crumble(l) {
    if (l.dead) return;
    l.dead = true; l.reserved = false;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * TAU + Math.random();
      parts.push({ k: 'piece', x: l.x + Math.cos(a) * LR * 0.4, y: l.y + Math.sin(a) * LR * 0.4, vx: Math.cos(a) * (40 + Math.random() * 60), vy: Math.sin(a) * 40 - 40, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 12, s: LR * (0.35 + Math.random() * 0.2), life: 1.1, max: 1.1, col: l.color });
    }
    for (let i = 0; i < 6; i++) parts.push({ k: 'fleck', x: l.x, y: l.y, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 120, s: 2 + Math.random() * 2, life: 0.6, max: 0.6, col: l.vein });
    sfxCrackle();
  }
  function settle(l) { l.dead = true; l.reserved = false; puff(l.x, G, mix(l.color.length === 7 ? l.color : C.olive, '#fff7e6', 0.5), 3); }

  // ---------- sound (WebAudio, silent until the first tap) ----------
  let AC = null, NB = null;
  function audioOn() {
    try {
      if (!AC) {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        const len = Math.floor(AC.sampleRate * 0.5); NB = AC.createBuffer(1, len, AC.sampleRate);
        const d = NB.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (AC.state === 'suspended') AC.resume();
    } catch (e) { AC = null; }
  }
  window.addEventListener('pointerdown', audioOn, true);
  function tone(f, dur, type, vol, f2, when) {
    if (!AC) return;
    try {
      const t0 = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) {}
  }
  function noise(dur, vol, ftype, f1, f2, when) {
    if (!AC || !NB) return;
    try {
      const t0 = AC.currentTime + (when || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
      s.buffer = NB; f.type = ftype; f.frequency.setValueAtTime(f1, t0); if (f2) f.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t0); s.stop(t0 + dur + 0.03);
    } catch (e) {}
  }
  const sfxTick = (i, down) => tone(PENTA[clamp(i, 0, 7)] * (down ? 0.9 : 1), 0.035, 'triangle', 0.07);
  const sfxHm = () => { tone(140, 0.05, 'triangle', 0.09); tone(124, 0.06, 'triangle', 0.07, null, 0.06); };
  const sfxCrackle = () => noise(0.06, 0.07, 'highpass', 2200, 4200);
  const sfxChime = (chained) => { const k = chained ? 4 / 3 : 1; noise(0.28, 0.05, 'bandpass', 500, 2600); tone(660 * k, 0.14, 'sine', 0.07); tone(990 * k, 0.22, 'sine', 0.06, null, 0.09); };
  const sfxPok = () => { tone(520, 0.04, 'sine', 0.09); tone(780, 0.06, 'sine', 0.08, null, 0.05); };
  const sfxThump = () => { noise(0.2, 0.12, 'lowpass', 700, 120); tone(330, 0.3, 'triangle', 0.09, 160); };
  const sfxRustle = () => noise(0.14, 0.05, 'bandpass', 1400, 3200);

  // ---------- game flow ----------
  function resetSquirrel() { Object.assign(Q, { state: 'sit', leaf: null, vy: 0, squash: 0, target: null, sp: null, ang: 0 }); }
  function toTitle() {
    S.mode = 'title'; S.titleT = 0; S.t = 0; resetSquirrel();
    fillField(0);
  }
  function newGame() {
    S.mode = 'play'; S.t = 0; S.score = 0; S.lives = 3; S.c = 0; S.words = 0; S.longest = ''; S.top = null; S.lastWord = null;
    S.slowT = 0; S.noWord = 0; S.deadT = 0; S.newBest = false; S.bestAtStart = kit.best(); S.shake = 0;
    parts = []; pops = []; route = []; tracing = false; ptr = null; GL = null; failRoute = []; failT = 0;
    D.plan = null; D.cool = 0.4; D.think = 0;
    fillField(0);
    resetSquirrel();
    let best = null, bd = 1e9;
    const aim = { x: 0.5 * W, y: 0.55 * H };
    for (const l of leaves) { const d = dist(l, aim); if (d < bd) { bd = d; best = l; } }
    Q.leaf = best; Q.x = best.x; Q.y = best.y;
    kit.buzz();
  }
  function pause() { if (S.mode !== 'play') return; S.mode = 'paused'; cancelRoute(); }
  function cancelRoute() { tracing = false; route = []; ptr = null; if (D.plan) { D.plan = null; D.cool = 0.3; } }

  function startGlide() {
    const chained = route[0] === Q.leaf;
    const cAfter = chained ? S.c + 1 : 0;
    const sc = scoreRoute(route, chained, cAfter);
    S.c = cAfter;
    const nodes = chained ? route.slice() : [Q.leaf].concat(route);
    nodes.forEach((l) => { l.reserved = true; });
    GL = { nodes, i: 0, t: 0, startY: Q.y, word: routeWord(route), pts: sc.pts, mult: sc.mult, chained, set: new Set(route), last: route[route.length - 1] };
    Q.state = 'glide'; Q.leaf = null; route = []; tracing = false; ptr = null;
    sfxChime(chained);
  }

      if (valid) { ctx.strokeStyle = C.ink; ctx.lineWidth = 0.006 * W; ctx.stroke(); }
    }
    const f = D.on ? { x: D.fx, y: D.fy } : finger;
    if (tracing) {
      const l = pts[pts.length - 1];
      ctx.strokeStyle = 'rgba(255,247,230,0.6)'; ctx.lineWidth = 0.009 * W;
      ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(f.x, f.y); ctx.stroke();
    }
  }
  function drawField() {
    const inRoute = new Set(route);
    for (const l of leaves) if (l.kind !== 'wet' && !inRoute.has(l)) drawLeaf(l, false);
    for (const l of leaves) if (l.kind === 'wet' && !inRoute.has(l)) drawLeaf(l, false);
    for (const l of route) drawLeaf(l, true);
  }
  function drawParts() {
    for (const p of parts) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = p.k === 'fly' ? 1 : Math.min(1, a * 1.6);
      if (p.k === 'piece' || p.k === 'mini') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(p.s, p.s); ctx.fillStyle = p.col; ctx.fill(p.k === 'mini' ? MINI : TINY); ctx.restore();
      } else if (p.k === 'fleck') { ctx.fillStyle = p.col; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
      else if (p.k === 'puff') { ctx.globalAlpha = a * 0.7; ell(p.x, p.y, p.r, p.r * 0.8, p.col); }
      else if (p.k === 'drop') { ell(p.x, p.y, 2.4, 3.2, C.drop); }
      else if (p.k === 'trail') { ctx.globalAlpha = a * 0.7; ell(p.x, p.y, 2 + 3 * a, 2 + 3 * a, C.cream); }
      else if (p.k === 'acorn') drawAcorn(p.x, p.y, p.s, p.rot);
      else if (p.k === 'fly') drawAcorn(p.x, p.y, 0.05 * W, 0);
    }
    ctx.globalAlpha = 1;
  }
  function drawPops() {
    for (const p of pops) {
      const u = p.t / 1.4, rise = easeOut(clamp(p.t / 1.1, 0, 1)) * 0.06 * H;
      const pop = p.t < 0.14 ? 0.7 + 0.3 * easeOut(p.t / 0.14) * 1.08 : 1;
      ctx.globalAlpha = u < 0.75 ? 1 : (1 - u) / 0.25;
      const f1 = 0.046 * W, f2 = 0.034 * W;
      ctx.font = '600 ' + f1 + 'px ' + FONT;
      const w = Math.max(ctx.measureText(p.l1).width + f1 * 1.2, 0.3 * W);
      const lines = 1 + (p.l2 ? 1 : 0) + (p.l3 ? 1 : 0), h = f1 * 1.5 + (lines - 1) * f2 * 1.3;
      ctx.save(); ctx.translate(p.x, Math.max(p.y - rise, SEL_TOP + h / 2 + 6)); ctx.scale(pop, pop);
      ctx.fillStyle = 'rgba(255,247,230,0.94)'; pill(ctx, -w / 2, -h / 2, w, h); ctx.fill();
      let yy = -h / 2 + f1 * 1.1;
      txt(p.l1, 0, yy, f1, C.ink, 600, 'center');
      if (p.l2) { yy += f2 * 1.3; txt(p.l2, 0, yy, f2, C.verm, 600, 'center'); }
      if (p.l3) { yy += f2 * 1.3; txt(p.l3, 0, yy, f2, C.soft, 500, 'center'); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- drawing: HUD ----------
  function acornPos(i) { return { x: W * (0.785 + 0.07 * i), y: safeT + 0.034 * H }; }
  function drawHUD() {
    const danger = S.mode === 'play' && Q.y > G - 0.15 * H;
    for (let i = 0; i < 3; i++) {
      const p = acornPos(i), on = i < S.lives;
      ctx.globalAlpha = on ? 1 : 0.25;
      const j = danger && on ? Math.sin(S.clock * 22 + i) * 0.18 : 0;
      drawAcorn(p.x, p.y, 0.05 * W, j);
    }
    ctx.globalAlpha = 1;
    if (S.mode === 'over') return;
    num(fmt(S.score), W / 2, safeT + 0.054 * H, 0.085 * W, C.ink, 600);
    const best = Math.max(kit.best(), S.score), by = safeT + 0.083 * H, fs = 0.034 * W;
    if (S.c > 0) {
      txt('best ' + fmt(best), W / 2 - 0.03 * W, by, fs, C.soft, 500, 'right');
      const bx = W / 2 + 0.06 * W;
      ctx.save(); ctx.translate(bx, by - fs * 0.35); ctx.rotate(-0.3); ctx.scale(0.034 * W, 0.034 * W); ctx.fillStyle = C.verm; ctx.fill(MINI); ctx.restore();
      txt('x' + fmtMult(Math.min(3, 1 + 0.5 * S.c)), bx + 0.05 * W, by, fs * 1.1, C.verm, 600, 'left');
    } else txt('best ' + fmt(best), W / 2, by, fs, C.soft, 500, 'center');
    // pause
    const pb = pauseBtn();
    ctx.fillStyle = 'rgba(255,247,230,0.7)'; ctx.beginPath(); ctx.arc(pb.x, pb.y, pb.r, 0, TAU); ctx.fill();
    ctx.fillStyle = C.ink; const bw = pb.r * 0.22, bh = pb.r * 0.8;
    pill(ctx, pb.x - bw * 1.6, pb.y - bh / 2, bw, bh); ctx.fill(); pill(ctx, pb.x + bw * 0.6, pb.y - bh / 2, bw, bh); ctx.fill();
  }
  function drawBanner() {
    const x = 0.08 * W, w = 0.84 * W;
    card(x, BAN_Y, w, BAN_H, 5, false);
    const size = Math.min(BAN_H * 0.6, 0.056 * W), y = BAN_Y + BAN_H / 2 + size * 0.36;
    if (route.length) {
      const word = routeWord(route), ok = isWord(word);
      txt(word.toUpperCase(), W / 2, y, size, ok ? C.verm : C.ink, 700, 'center', (size * 0.14).toFixed(1) + 'px');
      if (ok) {
        const chained = route[0] === Q.leaf, sc = scoreRoute(route, chained, chained ? S.c + 1 : 0);
        txt('+' + fmt(sc.pts), x + w - 0.03 * W, y, size * 0.7, C.verm, 600, 'right');
      }
    } else if (S.lastWord) {
      ctx.globalAlpha = 0.8;
      txt(S.lastWord.w.toUpperCase() + '   +' + fmt(S.lastWord.pts) + (S.lastWord.mult > 1 ? '   chain x' + fmtMult(S.lastWord.mult) : ''), W / 2, y, size * 0.78, C.ink, 500, 'center');
      ctx.globalAlpha = 1;
    } else {
      txt(WORDS ? 'Drag through nearby leaves to spell a word' : 'Gathering the words…', W / 2, y - size * 0.05, size * 0.62, C.soft, 500, 'center');
    }
  }
  function drawRing() {
    if (S.mode !== 'play' || Q.state !== 'sit') return;
    const ref = route.length ? route[route.length - 1] : Q;
    ctx.save(); ctx.strokeStyle = 'rgba(255,247,230,0.9)'; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.setLineDash([0.5, 9]);
    ctx.lineDashOffset = -S.clock * 6;
    ctx.beginPath(); ctx.arc(ref.x, ref.y, reach(), 0, TAU); ctx.stroke(); ctx.restore();
  }
  function drawPile() {
    ctx.drawImage(pileCv, -OX, pileTop, VW, VH - pileTop);
    if (S.mode === 'play' && Q.y > G - 0.15 * H) {
      const a = 0.3 * (0.5 + 0.5 * Math.sin(S.clock * TAU * 2));
      ctx.save(); ctx.beginPath(); ctx.rect(-OX, G - 0.06 * H, VW, 0.07 * H); ctx.clip();
      ctx.globalAlpha = a; ctx.fillStyle = C.verm;
      for (const [x, y, r] of pileLumps) { ctx.beginPath(); ctx.arc(x - OX, y, r, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }

  // ---------- drawing: cards ----------
  const TITLE = 'glideleaf'.split('').map((ch, i) => ({ ch, shape: [0, 2, 1, 0, 2, 1, 0, 2, 0][i], color: [C.verm, C.pers, C.burg, C.olive, C.verm, C.gold, C.pers, C.burg, C.olive][i], path: buildPath([0, 2, 1, 0, 2, 1, 0, 2, 0][i], 31 + i * 17), rot: (i % 2 ? 1 : -1) * 0.2 }));
  function drawTitle() {
    const n = TITLE.length, sp = W * 0.1, x0 = W / 2 - sp * (n - 1) / 2, baseY = safeT + 0.18 * H, r = 0.064 * W;
    TITLE.forEach((L, i) => {
      const e = easeOut(clamp((S.titleT - i * 0.08) / 1.2, 0, 1));
      const x = x0 + i * sp + Math.sin(S.clock * 0.9 + i) * 2.5 + (1 - e) * Math.sin(i * 2.3) * 30;
      const y = baseY + (i % 2 ? 0.012 * H : 0) + Math.sin(S.clock * 1.3 + i * 0.7) * 3 - (1 - e) * 0.32 * H;
      const rot = L.rot + Math.sin(S.clock * 1.1 + i * 0.8) * 0.12 + (1 - e) * (i % 2 ? 2 : -2);
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(r, r);
      ctx.fillStyle = L.color; ctx.fill(L.path);
      ctx.strokeStyle = mix(L.color, C.veinBase, 0.3); ctx.lineCap = 'round'; ctx.globalAlpha = 0.5; ctx.lineWidth = 0.08; ctx.stroke(VEINS[L.shape]); ctx.globalAlpha = 1;
      ctx.restore();
      const fs = 0.078 * W;
      ctx.font = '700 ' + fs + 'px ' + FONT; ctx.textAlign = 'center';
      if (HAS_LS) ctx.letterSpacing = '0px';
      const dark = L.color === C.gold;
      if (!dark) { ctx.fillStyle = 'rgba(58,30,23,0.35)'; ctx.fillText(L.ch, x, y + fs * 0.3 + 2); }
      ctx.fillStyle = dark ? C.letterDark : C.letter; ctx.fillText(L.ch, x, y + fs * 0.3);
    });
    const cw = Math.min(W - 40, 360), cx = (W - cw) / 2, cy = safeT + 0.29 * H;
    const f = Math.min(0.046 * W, 19), lh = f * 1.5, best = kit.best();
    const lines = ['Drag from a leaf near the squirrel', 'through nearby leaves to spell a word.', '', 'Let go, and she glides along it.', 'Start on her own leaf to chain words.', 'Keep her out of the leaf pile.'];
    const ch = f * 2.4 + f * 1.1 + lh * 0.6 + lines.length * lh * 0.92 + (best > 0 ? lh * 1.2 : 0) + f * 3.6;
    card(cx, cy, cw, ch, 21);
    let y = cy + f * 2.4;
    txt('Spell a path up the falling leaves.', W / 2, y, f * 1.0, C.ink, 600, 'center', '0.4px');
    y += f * 1.1 + lh * 0.6;
    lines.forEach((s) => { if (s) txt(s, W / 2, y, f * 0.86, C.soft, 500, 'center'); y += lh * (s ? 1 : 0.45); });
    if (best > 0) { y += lh * 0.5; txt('best ' + fmt(best), W / 2, y, f * 0.95, C.ink, 500, 'center'); }
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(S.clock * 4);
    txt('Tap to start', W / 2, cy + ch - f * 1.5, f * 1.35, C.verm, 600, 'center');
    ctx.globalAlpha = 1;
    // the squirrel waits on a leaf under the card
    const ly = Math.min(G - 0.06 * H, cy + ch + 0.11 * H), lx = W / 2 + Math.sin(S.clock * 0.8) * 4;
    ctx.save(); ctx.translate(lx, ly); ctx.rotate(Math.sin(S.clock * 1.4) * 0.12); ctx.scale(LR * 1.15, LR * 1.15); ctx.fillStyle = C.verm; ctx.fill(TITLE[0].path);
    ctx.strokeStyle = mix(C.verm, C.veinBase, 0.3); ctx.globalAlpha = 0.5; ctx.lineWidth = 0.08; ctx.lineCap = 'round'; ctx.stroke(VEINS[0]); ctx.globalAlpha = 1; ctx.restore();
    drawSitting(lx, ly + LR * 0.2, 0.13 * W, 0);
  }
  function drawOver() {
    const e = easeOut(clamp((S.overT - 0.35) / 0.45, 0, 1));
    if (e <= 0) return;
    const cw = Math.min(W - 36, 360), cx = (W - cw) / 2, ch = Math.min(0.56 * H, 470), cy = safeT + 0.16 * H + (1 - e) * 0.08 * H;
    ctx.globalAlpha = e;
    card(cx, cy, cw, ch, 41);
    const f = Math.min(0.046 * W, 19);
    let y = cy + ch * 0.12;
    txt('Landed in the leaves', W / 2, y, f * 1.25, C.ink, 600, 'center');
    y += ch * 0.2;
    num(fmt(S.score), W / 2, y, Math.min(0.15 * W, 62), C.ink, 700);
    y += ch * 0.085;
    txt('best ' + fmt(Math.max(kit.best(), S.score)), W / 2, y, f * 0.9, C.soft, 500, 'center');
    if (S.newBest) {
      const st = clamp((S.overT - 0.7) / 0.25, 0, 1), sc = st < 1 ? 1.6 - 0.6 * easeOut(st) : 1;
      if (st > 0) {
        ctx.save(); ctx.translate(cx + cw - 0.13 * W, cy + ch * 0.3); ctx.rotate(-0.25); ctx.scale(sc, sc);
        ctx.save(); ctx.scale(0.11 * W, 0.11 * W); ctx.fillStyle = C.verm; ctx.fill(TITLE[0].path); ctx.restore();
        txt('new', 0, -0.006 * W, 0.034 * W, C.cream, 700, 'center'); txt('best', 0, 0.03 * W, 0.034 * W, C.cream, 700, 'center');
        ctx.restore();
      }
    }
    const rows = [['Words', String(S.words)], ['Longest', S.longest ? S.longest.toUpperCase() : '–'], ['Top word', S.top ? S.top.w.toUpperCase() + ' ' + fmt(S.top.pts) : '–'], ['Time aloft', Math.floor(S.t / 60) + ':' + String(Math.floor(S.t % 60)).padStart(2, '0')]];
    const colX = [cx + cw * 0.27, cx + cw * 0.73];
    rows.forEach((r, i) => {
      const xx = colX[i % 2], yy = cy + ch * 0.58 + Math.floor(i / 2) * ch * 0.14;
      txt(r[0], xx, yy, f * 0.74, C.soft, 500, 'center');
      txt(r[1], xx, yy + f * 1.25, f * (r[1].length > 10 ? 0.82 : 0.98), C.ink, 600, 'center');
    });
    if (S.overT > 0.6) { ctx.globalAlpha = e * (0.65 + 0.35 * Math.sin(S.clock * 4)); txt('Tap to glide again', W / 2, cy + ch - ch * 0.07, f * 1.2, C.verm, 600, 'center'); }
    ctx.globalAlpha = 1;
  }
  function drawPaused() {
    ctx.fillStyle = 'rgba(168,216,232,0.82)'; ctx.fillRect(-OX, SEL_TOP - 2, VW, H);
    const cw = Math.min(W - 60, 300), ch = 150, cx = (W - cw) / 2, cy = H * 0.36;
    card(cx, cy, cw, ch, 61);
    txt('Paused', W / 2, cy + 62, Math.min(0.08 * W, 32), C.ink, 600, 'center');
    ctx.globalAlpha = 0.65 + 0.35 * Math.sin(S.clock * 4);
    txt('Tap to carry on', W / 2, cy + 108, Math.min(0.05 * W, 20), C.verm, 600, 'center');
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.drawImage(bgCv, 0, 0, VW, VH);
    const shx = S.shake ? (Math.random() - 0.5) * S.shake : 0, shy = S.shake ? (Math.random() - 0.5) * S.shake : 0;
    ctx.save(); ctx.translate(OX + shx, shy);
    drawField();
    if (S.mode === 'play' || S.mode === 'paused') {
      const valid = route.length && isWord(routeWord(route));
      drawRibbon(valid);
      for (const l of route) drawLetter(l, l.x, l.y, 1, false);
      drawRing();
    }
    if (S.mode !== 'title') drawSquirrel();
    drawParts();
    drawPile();
    drawSunkTail();
    if (D.on && D.plan && S.mode === 'play') { ell(D.fx, D.fy, 0.05 * W, 0.05 * W, 'rgba(255,247,230,0.55)'); ell(D.fx, D.fy, 0.02 * W, 0.02 * W, 'rgba(44,36,51,0.3)'); }
    drawPops();
    ctx.restore();
    ctx.save(); ctx.translate(OX, 0);
    if (S.mode === 'title') drawTitle();
    else {
      drawHUD();
      if (S.mode === 'play' || S.mode === 'paused') drawBanner();
      if (S.mode === 'over') drawOver();
      if (S.mode === 'paused') drawPaused();
    }
    ctx.restore();
  }

  // ---------- sizing ----------
  function layout(s) {
    const oldW = W, oldH = H;
    VW = s.w; VH = s.h; DPR = s.dpr;
    H = VH; W = Math.min(VW, Math.round(VH * 0.62)); OX = Math.round((VW - W) / 2);
    const cs = getComputedStyle(probe);
    safeT = parseFloat(cs.paddingTop) || 0; safeB = parseFloat(cs.paddingBottom) || 0;
    BAN_Y = safeT + 0.11 * H; BAN_H = 0.04 * H; SEL_TOP = BAN_Y + BAN_H; G = H - safeB - 0.13 * H;
    LR = 0.075 * W; HIT = 0.085 * W; GAP = 0.17 * W;
    if (!tile) tile = makeTile();
    pattern = ctx ? ctx.createPattern(tile, 'repeat') : null;
    if (oldW && (oldW !== W || oldH !== H)) {
      const kx = W / oldW, ky = H / oldH;
      for (const l of leaves) { l.x0 *= kx; l.x *= kx; l.y *= ky; }
      rowY *= ky; Q.x *= kx; Q.y *= ky;
    }
    buildBg(); buildPile();
  }
  ctx = kit.fitCanvas(cv, layout);
  pattern = ctx.createPattern(tile, 'repeat');
  toTitle();

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (document.readyState === 'complete') setTimeout(loadWords, 30);
  else window.addEventListener('load', () => setTimeout(loadWords, 30));

  // ---------- test hook (scripts/playtest.mjs, scripts/shoot.mjs) ----------
  window.__game = {
    state: () => ({ mode: S.mode, score: S.score, best: kit.best(), lives: S.lives, words: S.words, chain: S.c, t: Math.round(S.t * 10) / 10 }),
    demo: (on) => { D.on = !!on; if (!on) { if (D.plan) cancelRoute(); D.plan = null; } else if (S.mode === 'title') newGame(); },
    sim: (sec) => { for (let k = 0; k < sec * 60 && S.mode === 'play'; k++) update(1 / 60); return window.__game.state(); },
    ready: () => !!WORDS,
    dbg: () => ({ stat: JSON.stringify(STAT), causes: JSON.stringify(CAUSES), leaves: leaves.length, reach: Math.round(reach()), q: Q.state, qy: Math.round(Q.y / H * 100), fall: vFall(S.t) })
  };
})();
</script>
<script src="words.js"></script>
</body>
</html>
