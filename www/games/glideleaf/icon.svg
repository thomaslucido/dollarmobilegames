<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 5-lobed maple leaf, centred on 0,0, about 200 across -->
    <path id="maple" d="M0 -105 L18 -62 L38 -78 L36 -40 L72 -58 L62 -20 L100 -18 L74 10 L88 30 L50 36 L56 64 L18 46 L0 52 L-18 46 L-56 64 L-50 36 L-88 30 L-74 10 L-100 -18 L-62 -20 L-72 -58 L-36 -40 L-38 -78 L-18 -62 Z"/>
    <!-- pointed birch-style leaf -->
    <path id="oval" d="M0 -70 C 40 -40 46 20 0 62 C -46 20 -40 -40 0 -70 Z"/>
  </defs>

  <!-- sky page with dry-brush streaks -->
  <rect width="512" height="512" fill="#a8d8e8"/>
  <g fill="#c2e5f0" opacity="0.55">
    <rect x="120" y="58" width="300" height="9" rx="4.5"/>
    <rect x="260" y="80" width="200" height="6" rx="3"/>
    <rect x="90" y="300" width="160" height="7" rx="3.5"/>
    <rect x="300" y="470" width="190" height="8" rx="4"/>
    <rect x="140" y="488" width="120" height="6" rx="3"/>
  </g>

  <!-- sun disc -->
  <circle cx="170" cy="150" r="112" fill="#f7f1dc"/>

  <!-- far pale birch -->
  <rect x="430" y="0" width="26" height="512" fill="#d4e9ef"/>
  <g fill="#b5d2dc">
    <rect x="430" y="120" width="14" height="5" rx="2.5"/>
    <rect x="440" y="250" width="16" height="5" rx="2.5"/>
    <rect x="430" y="390" width="12" height="4" rx="2"/>
  </g>

  <!-- near birch trunk, left edge -->
  <rect x="0" y="0" width="78" height="512" fill="#f5f2ea"/>
  <rect x="54" y="0" width="24" height="512" fill="#dcd6ca"/>
  <g fill="#2d2b36">
    <path d="M0 70 Q 30 62 52 74 Q 30 80 0 78 Z"/>
    <path d="M22 182 Q 50 174 78 184 Q 52 192 22 190 Z"/>
    <path d="M0 300 Q 26 292 44 304 Q 24 310 0 308 Z"/>
    <path d="M30 420 Q 56 412 78 422 Q 56 430 30 428 Z"/>
  </g>

  <!-- small persimmon leaf, upper right -->
  <g transform="translate(398 128) rotate(28)">
    <use href="#oval" xlink:href="#oval" fill="#f3892b"/>
    <path d="M0 -52 Q 4 0 0 48" fill="none" stroke="#c46a22" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 60 L0 84" stroke="#c46a22" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- small olive leaf, lower left -->
  <g transform="translate(130 418) rotate(-36) scale(0.9)">
    <use href="#oval" xlink:href="#oval" fill="#7f9a3a"/>
    <path d="M0 -52 Q -4 0 0 48" fill="none" stroke="#61762c" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 60 L0 84" stroke="#61762c" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- big vermilion maple leaf, lower right -->
  <g transform="translate(360 392) rotate(-14) scale(1.06)">
    <use href="#maple" xlink:href="#maple" fill="#7fb3c6" transform="translate(6 7)" opacity="0.6"/>
    <use href="#maple" xlink:href="#maple" fill="#e5481f"/>
    <g fill="none" stroke="#b23b1d" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <path d="M0 50 L0 -82"/>
      <path d="M0 20 Q 30 -6 62 -36"/>
      <path d="M0 20 Q -30 -6 -62 -36"/>
      <path d="M0 40 Q 30 30 68 22"/>
      <path d="M0 40 Q -30 30 -68 22"/>
    </g>
    <path d="M0 50 Q 2 80 -6 104" fill="none" stroke="#b23b1d" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- glide route: cream dots from the leaf up to the squirrel -->
  <g fill="#fff7e6">
    <circle cx="262" cy="372" r="8"/>
    <circle cx="238" cy="352" r="7"/>
    <circle cx="222" cy="326" r="6"/>
  </g>

  <!-- flying squirrel, gliding up and to the left -->
  <g transform="translate(192 172) rotate(-32) scale(1.12)">
    <!-- tail -->
    <path d="M-20 52 C -30 100 -22 140 0 156 C 22 140 30 100 20 52 Z" fill="#7a7686"/>
    <path d="M-12 128 C -6 146 6 146 12 128 C 10 146 4 156 0 157 C -4 156 -10 146 -12 128 Z" fill="#c9c4d2"/>
    <!-- membrane body, spread between four paws -->
    <path d="M-62 -42 Q -36 -40 -26 -52 L26 -52 Q 36 -40 62 -42 Q 52 6 60 58 Q 30 50 0 60 Q -30 50 -60 58 Q -52 6 -62 -42 Z" fill="#a6a1b0"/>
    <!-- body -->
    <ellipse cx="0" cy="4" rx="40" ry="56" fill="#8b8796"/>
    <ellipse cx="0" cy="10" rx="25" ry="40" fill="#f4ead8"/>
    <!-- paws -->
    <g fill="#8b8796">
      <circle cx="-62" cy="-42" r="11"/>
      <circle cx="62" cy="-42" r="11"/>
      <circle cx="-60" cy="58" r="11"/>
      <circle cx="60" cy="58" r="11"/>
    </g>
    <!-- head -->
    <circle cx="-22" cy="-82" r="11" fill="#8b8796"/>
    <circle cx="22" cy="-82" r="11" fill="#8b8796"/>
    <circle cx="-22" cy="-82" r="5" fill="#e88a8a"/>
    <circle cx="22" cy="-82" r="5" fill="#e88a8a"/>
    <circle cx="0" cy="-56" r="32" fill="#8b8796"/>
    <ellipse cx="0" cy="-44" rx="18" ry="13" fill="#f4ead8"/>
    <circle cx="-13" cy="-60" r="8" fill="#1f1c26"/>
    <circle cx="13" cy="-60" r="8" fill="#1f1c26"/>
    <circle cx="-10" cy="-63" r="2.6" fill="#ffffff"/>
    <circle cx="16" cy="-63" r="2.6" fill="#ffffff"/>
    <ellipse cx="0" cy="-47" rx="4.5" ry="3.5" fill="#e88a8a"/>
  </g>
</svg>
