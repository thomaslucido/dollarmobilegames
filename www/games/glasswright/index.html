<canvas id="c"></canvas>
<script src="../../shared/game-kit.js"></script>
<script>
(function () {
  'use strict';
  const kit = GameKit.init({ slug: 'glasswright', backColor: '#f4eee0' });
  const cv = document.getElementById('c');
  const SERIF = '"Iowan Old Style", Palatino, "Palatino Linotype", ui-serif, Georgia, serif';
  const LEAD = '#24212b', INK = '#2a2530', MUTED = '#6d6457', RUBY = '#c8203f', GOLD = '#ffd45e', GLOW = '#fff3c2';
  const STONE = '#c7b898', STONE_SH = '#a8987a', LIME = '#f4eee0';
  let W = 390, H = 844, DPR = 1, ctx = null, T = 0;

  // ---------- small helpers ----------
  const ri = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[ri(a.length)];
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const easeBack = (t) => { t = clamp(t, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = ri(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function roman(n) { const m = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; }
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mix = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
  const rgba = (h, a) => 'rgba(' + hexRgb(h).join(',') + ',' + a + ')';
  function seeded(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const inRect = (p, r) => r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

  // ---------- glass ----------
  const GLASS = {
    ruby: { base: '#c8203f', name: 'Ruby', mark: 'diamond' },
    sapphire: { base: '#1f58c9', name: 'Sapphire', mark: 'ring' },
    emerald: { base: '#13916a', name: 'Emerald', mark: 'leaf' },
    amber: { base: '#e89c1f', name: 'Amber', mark: 'dot', darkMark: true },
    amethyst: { base: '#7a3fc2', name: 'Amethyst', mark: 'cross' },
    sun: { base: '#ffd45e', name: 'Sun', wild: true },
    crystal: { base: '#e8f4f6', name: 'Crystal', wild: true },
    grey: { base: '#9c9a94', name: 'Old glass' }
  };
  const PANE_COLORS = ['ruby', 'sapphire', 'emerald', 'amber', 'amethyst'];

  // ---------- shapes and cards ----------
  const SHAPES = {
    mono: [[0, 0]], i2: [[0, 0], [1, 0]], i3: [[0, 0], [1, 0], [2, 0]], l3: [[0, 0], [0, 1], [1, 1]],
    o4: [[0, 0], [1, 0], [0, 1], [1, 1]], i4: [[0, 0], [1, 0], [2, 0], [3, 0]], l4: [[0, 0], [0, 1], [0, 2], [1, 2]],
    j4: [[1, 0], [1, 1], [1, 2], [0, 2]], t4: [[0, 0], [1, 0], [2, 0], [1, 1]], s4: [[1, 0], [2, 0], [0, 1], [1, 1]],
    z4: [[0, 0], [1, 0], [1, 1], [2, 1]], i5: [[0, 0], [1, 0], [2, 0], [3, 0], [4, 0]], v5: [[0, 0], [0, 1], [0, 2], [1, 2], [2, 2]],
    p5: [[0, 0], [1, 0], [0, 1], [1, 1], [0, 2]], u5: [[0, 0], [2, 0], [0, 1], [1, 1], [2, 1]], plus: [[1, 0], [0, 1], [1, 1], [2, 1], [1, 2]]
  };
  const SHAPE_NAME = { mono: 'single', i2: 'pair', i3: 'bar', l3: 'corner', o4: 'square', i4: 'long bar', l4: 'L', j4: 'J', t4: 'T', s4: 'S', z4: 'Z', i5: 'great bar', v5: 'wide corner', p5: 'P', u5: 'U', plus: 'cross' };
  const WEIGHTS = [['mono', 2], ['i2', 2], ['i3', 3], ['l3', 3], ['o4', 2], ['i4', 2], ['l4', 2], ['j4', 2], ['t4', 2], ['s4', 2], ['z4', 2], ['i5', 1], ['v5', 1], ['p5', 1], ['u5', 1], ['plus', 1]];
  const START = [['i2', 'ruby'], ['i2', 'sapphire'], ['i3', 'emerald'], ['i3', 'amber'], ['l3', 'ruby'], ['l3', 'sapphire'], ['o4', 'emerald'], ['o4', 'amber'], ['i4', 'ruby'], ['l4', 'sapphire'], ['t4', 'emerald'], ['s4', 'amber']];

  let cardId = 0;
  function makeCard(shape, color, special) {
    return { id: ++cardId, shape, color, special: special || null, cells: SHAPES[shape].map(([x, y]) => ({ x, y, c: color })), spin: 0, wig: 0, appear: 1 };
  }
  const sunCard = () => makeCard('mono', 'sun', 'sun');
  const crystalCard = () => makeCard('i2', 'crystal', 'crystal');
  function gildedCard() { const k = makeCard(pick(['i3', 'l3', 'o4', 'i4', 'l4', 'j4', 't4', 's4', 'z4']), pick(PANE_COLORS), 'gilded'); k.cells[ri(k.cells.length)].c = 'sun'; return k; }
  function weightedShape() { const tot = WEIGHTS.reduce((a, w) => a + w[1], 0); let x = Math.random() * tot; for (const [k, w] of WEIGHTS) { x -= w; if (x < 0) return k; } return 'i2'; }
  const newSpecial = () => [sunCard, crystalCard, gildedCard][ri(3)]();
  const newPane = () => (Math.random() < 0.15 ? newSpecial() : makeCard(weightedShape(), pick(PANE_COLORS)));
  function cardName(k) {
    if (k.special === 'sun') return 'Sun pane';
    if (k.special === 'crystal') return 'Crystal pane';
    if (k.special === 'gilded') return 'Gilded ' + SHAPE_NAME[k.shape];
    return GLASS[k.color].name + ' ' + SHAPE_NAME[k.shape];
  }
  function cardDesc(k) {
    if (k.special === 'sun') return 'Wild colour. Lines through it shine x2';
    if (k.special === 'crystal') return 'Two clear cells that match any colour';
    if (k.special === 'gilded') return GLASS[k.color].name + ' with a sun cell: its lines x2';
    return k.cells.length + (k.cells.length === 1 ? ' cell' : ' cells') + ' of ' + GLASS[k.color].name.toLowerCase() + ' glass';
  }

  const norm = (cells) => { let mx = 99, my = 99; for (const q of cells) { mx = Math.min(mx, q.x); my = Math.min(my, q.y); } return cells.map((q) => ({ x: q.x - mx, y: q.y - my, c: q.c })); };
  const rotCW = (cells) => { let h = 0; for (const q of cells) h = Math.max(h, q.y + 1); return norm(cells.map((q) => ({ x: h - 1 - q.y, y: q.x, c: q.c }))); };
  const sig = (cells) => cells.map((q) => q.x + ',' + q.y + q.c).sort().join(';');
  const bbox = (cells) => { let w = 0, h = 0; for (const q of cells) { w = Math.max(w, q.x + 1); h = Math.max(h, q.y + 1); } return { w, h }; };
  function rotations(cells) { const out = [], seen = new Set(); let c = cells; for (let k = 0; k < 4; k++) { const s = sig(c); if (!seen.has(s)) { seen.add(s); out.push(c); } c = rotCW(c); } return out; }

  // ---------- windows ----------
  const WINDOWS = [
    { name: 'Lancet', kind: 'lancet', cols: 7, rows: 9, ext: [0, -0.78, 7, 9], mask: (r, c) => (r === 0 ? c >= 2 && c <= 4 : r === 1 ? c >= 1 && c <= 5 : true) },
    { name: 'Twin Lancet', kind: 'twin', cols: 8, rows: 8, ext: [0, -0.62, 8, 8], mask: (r, c) => (r === 0 ? c === 1 || c === 2 || c === 5 || c === 6 : true) },
    { name: 'Rose', kind: 'rose', cols: 9, rows: 9, ext: [-0.66, -0.66, 9.66, 9.66], mask: (r, c) => ((r === 0 || r === 8) ? c >= 3 && c <= 5 : (r === 1 || r === 7) ? c >= 1 && c <= 7 : true) }
  ];
  const TRACERIES = [
    { id: 'came', name: 'Extra Came', desc: '+2 cuts every window', col: '#13916a' },
    { id: 'rose', name: 'Rose Tracery', desc: '+1 sweep every window', col: '#c8203f' },
    { id: 'prism', name: 'Prism', desc: 'Two-tone lines shine as pure', col: '#7a3fc2' },
    { id: 'eye', name: "Old Master's Eye", desc: 'Old glass matches any colour', col: '#9c9a94' },
    { id: 'steady', name: 'Steady Hand', desc: 'Keep 4 panes on the bench', col: '#1f58c9' },
    { id: 'tall', name: 'Tall Lancet', desc: 'Column clears shine x1.5', col: '#e89c1f' },
    { id: 'kiln', name: 'Kiln Mark', desc: 'First line each window x3', col: '#ffd45e' }
  ];

  // ---------- state ----------
  const S = {
    mode: 'title', phase: 'board', t: 0, pt: 0, ot: 0, ct: 0,
    n: 1, total: 0, light: 0, lightShown: 0, target: 160, cuts: 12, cutsMax: 12, sweeps: 1, sweepsMax: 1, handSize: 3,
    deck: [], draw: [], discard: [], hand: [], sel: 0, owned: new Set(), kilnUsed: false,
    shapeIdx: 0, lines: [], ghost: null, sheet: false, jamHint: false, banner: 0,
    offers: [], chosen: -1, bonus: 0, cause: '', demo: false, demoT: 0, dm: null,
    shake: 0, rays: null, meterGlow: 0, shuffleT: 0, newBest: false, firstRun: false, hintStep: -1, hintT: 0, placed: 0
  };
  let board = [], drag = null, ret = null, titleQ = [], titleIdx = 0;
  let motes = [], parts = [], pops = [], clears = [], beams = [];
  const has = (id) => S.owned.has(id);
  let hintsDone = !!kit.get('hints', false);
  function getBW() { try { return parseInt(localStorage.getItem('glasswright.bestWindow') || '0', 10) || 0; } catch (e) { return 0; } }
  function setBW(n) { try { if (n > getBW()) localStorage.setItem('glasswright.bestWindow', String(n)); } catch (e) {} }

  // ---------- board ----------
  const ROWS = () => board.length, COLS = () => (board[0] ? board[0].length : 0);
  function buildBoard(idx) {
    const wd = WINDOWS[idx]; S.shapeIdx = idx; board = [];
    for (let r = 0; r < wd.rows; r++) { const row = []; for (let c = 0; c < wd.cols; c++) row.push(wd.mask(r, c) ? null : undefined); board.push(row); }
    S.lines = [];
    for (let r = 0; r < wd.rows; r++) { const cells = []; for (let c = 0; c < wd.cols; c++) if (board[r][c] !== undefined) cells.push([r, c]); if (cells.length) S.lines.push({ cells, col: false }); }
    for (let c = 0; c < wd.cols; c++) { const cells = []; for (let r = 0; r < wd.rows; r++) if (board[r][c] !== undefined) cells.push([r, c]); if (cells.length) S.lines.push({ cells, col: true }); }
  }
  function fits(cells, ax, ay) {
    const R = ROWS(), C = COLS();
    for (const q of cells) { const r = ay + q.y, c = ax + q.x; if (r < 0 || c < 0 || r >= R || c >= C || board[r][c] !== null) return false; }
    return true;
  }
  const full = (l) => { for (const [r, c] of l.cells) if (!board[r][c]) return false; return true; };
  function placeOld(k) {
    const R = ROWS(), C = COLS(), rc = new Array(R).fill(0), cc = new Array(C).fill(0);
    const rl = [], cl = [];
    for (let r = 0; r < R; r++) rl.push(board[r].filter((v) => v !== undefined).length);
    for (let c = 0; c < C; c++) { let n = 0; for (let r = 0; r < R; r++) if (board[r][c] !== undefined) n++; cl.push(n); }
    let placed = 0, tries = 0;
    while (placed < k && tries++ < 2000) {
      const r = ri(R), c = ri(C);
      if (board[r][c] !== null || rc[r] >= 2 || cc[c] >= 2) continue;
      if (rc[r] + 1 > rl[r] * 0.25 || cc[c] + 1 > cl[c] * 0.25) continue;
      board[r][c] = { c: 'grey', v: ri(3), pop: -9 }; rc[r]++; cc[c]++; placed++;
    }
  }
  function lineScore(l) {
    const set = new Set(); let suns = 0;
    for (const [r, c] of l.cells) {
      const k = board[r][c].c;
      if (k === 'sun') { suns++; continue; }
      if (k === 'crystal' || (k === 'grey' && has('eye'))) continue;
      set.add(k);
    }
    const n = set.size;
    const mult = n <= 1 ? 3 : n === 2 ? (has('prism') ? 3 : 2) : 1;
    let pts = 10 * l.cells.length * mult * Math.pow(2, suns);
    if (l.col && has('tall')) pts *= 1.5;
    return { pts, pure: n <= 1, two: n === 2, suns };
  }

  // ---------- layout ----------
  const L = { frame: null, sprites: {} };
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
  document.body.appendChild(probe);
  function layout() {
    const cs = getComputedStyle(probe);
    L.st = parseFloat(cs.paddingTop) || 0; L.sb = parseFloat(cs.paddingBottom) || 0;
    L.lx = document.getElementById('gk-back') ? 62 : 18;
    L.topY = L.st + 6;
    L.meterX = W / 2; L.meterY = L.topY + 42; L.meterR = 33;
    L.barBottom = L.topY + 110;
    L.trayH = 138; L.trayY = H - L.sb - L.trayH;
    L.hintY = L.trayY - 20;
    const bw = 46;
    L.sweepBtn = { x: 10, y: L.trayY + 20, w: bw, h: 100 };
    L.deckBtn = { x: W - 10 - bw, y: L.trayY + 20, w: bw, h: 100 };
    makeBackdrop();
    layoutBoard();
  }
  function slotRects() {
    const n = S.handSize, x0 = L.sweepBtn.x + L.sweepBtn.w + 10, x1 = L.deckBtn.x - 10, gap = 8;
    const w = Math.min(104, (x1 - x0 - gap * (n - 1)) / n), tot = w * n + gap * (n - 1), sx = (x0 + x1 - tot) / 2, out = [];
    for (let i = 0; i < n; i++) out.push({ x: sx + i * (w + gap), y: L.trayY + 18, w, h: 104 });
    return out;
  }
  function layoutBoard() {
    const wd = WINDOWS[S.shapeIdx], [ex0, ey0, ex1, ey1] = wd.ext, fr = 22;
    const top = L.barBottom + fr, bottom = L.trayY - 36 - fr;
    const availW = Math.min(W * 0.94, 560) - 2 * fr, availH = bottom - top;
    const cs = Math.max(18, Math.min(availW / (ex1 - ex0), availH / (ey1 - ey0), 60));
    L.cs = cs; L.lw = Math.max(2, cs * 0.075);
    L.bx = W / 2 - cs * (ex0 + ex1) / 2;
    L.by = top + (availH - cs * (ey1 - ey0)) * 0.42 - ey0 * cs;
    L.ext = { x: L.bx + ex0 * cs, y: L.by + ey0 * cs, w: (ex1 - ex0) * cs, h: (ey1 - ey0) * cs };
    L.sprites = {};
    buildFrame();
  }

  // ---------- art: glass sprites ----------
  function sprite(key, v) {
    const id = key + (v | 0);
    if (L.sprites[id]) return L.sprites[id];
    const px = Math.max(12, Math.round((L.cs - L.lw) * DPR));
    const c = document.createElement('canvas'); c.width = c.height = px;
    const g = c.getContext('2d'); g.scale(px / 64, px / 64);
    const rnd = seeded(key.length * 977 + (v | 0) * 131 + key.charCodeAt(0));
    if (key === 'empty') {
      g.fillStyle = LIME; g.fillRect(0, 0, 64, 64);
      g.strokeStyle = '#e3d9c4'; g.lineWidth = 2;
      for (let k = -64; k < 64; k += 11) { g.beginPath(); g.moveTo(k, 64); g.lineTo(k + 64, 0); g.stroke(); }
      g.fillStyle = 'rgba(120,100,70,.08)'; g.fillRect(0, 0, 64, 4); g.fillRect(0, 0, 4, 64);
      L.sprites[id] = c; return c;
    }
    const G = GLASS[key], base = G.base;
    g.fillStyle = base; g.fillRect(0, 0, 64, 64);
    if (key === 'sun') {
      let gr = g.createRadialGradient(32, 32, 2, 32, 32, 40); gr.addColorStop(0, '#fffbe6'); gr.addColorStop(0.45, GLOW); gr.addColorStop(1, '#f0b43a');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      g.strokeStyle = 'rgba(176,112,10,.55)'; g.lineWidth = 3;
      g.beginPath(); g.arc(32, 32, 8, 0, 7); g.stroke();
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; g.beginPath(); g.moveTo(32 + Math.cos(a) * 13, 32 + Math.sin(a) * 13); g.lineTo(32 + Math.cos(a) * 19, 32 + Math.sin(a) * 19); g.stroke(); }
    } else if (key === 'crystal') {
      let gr = g.createLinearGradient(0, 0, 64, 64); gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#c9e2e7');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      g.fillStyle = 'rgba(255,255,255,.95)';
      g.beginPath(); g.moveTo(10, 46); g.lineTo(46, 10); g.lineTo(54, 10); g.lineTo(18, 46); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(26, 52); g.lineTo(52, 26); g.lineTo(54, 30); g.lineTo(30, 54); g.closePath(); g.fill();
    } else {
      let gr = g.createLinearGradient(0, 0, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(20,10,30,.22)');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      gr = g.createRadialGradient(15, 13, 0, 15, 13, 42); gr.addColorStop(0, 'rgba(255,255,255,.34)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      if (key === 'grey') {
        for (let k = 0; k < 60; k++) { g.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.06)'; g.fillRect(rnd() * 64, rnd() * 64, 2, 2); }
        g.fillStyle = 'rgba(255,255,255,.6)';
        for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(12 + rnd() * 40, 12 + rnd() * 40, 1.6, 0, 7); g.fill(); }
      }
    }
    g.strokeStyle = key === 'crystal' ? 'rgba(120,160,170,.5)' : mix(base, LEAD, 0.25); g.lineWidth = 7; g.strokeRect(3.5, 3.5, 57, 57);
    // seed bubbles
    g.fillStyle = 'rgba(255,255,255,.18)';
    const nb = 1 + (v % 2);
    for (let k = 0; k < nb; k++) { g.beginPath(); g.arc(14 + rnd() * 36, 14 + rnd() * 36, 1.6 + rnd() * 1.6, 0, 7); g.fill(); }
    // etched mark (colour-blind support)
    if (G.mark) {
      g.strokeStyle = G.darkMark ? 'rgba(90,50,0,.3)' : 'rgba(255,255,255,.3)'; g.fillStyle = g.strokeStyle; g.lineWidth = 3; g.lineCap = 'round';
      g.beginPath();
      if (G.mark === 'diamond') { g.moveTo(32, 23); g.lineTo(41, 32); g.lineTo(32, 41); g.lineTo(23, 32); g.closePath(); g.stroke(); }
      else if (G.mark === 'ring') { g.arc(32, 32, 7.5, 0, 7); g.stroke(); }
      else if (G.mark === 'leaf') { g.moveTo(23, 41); g.quadraticCurveTo(23, 23, 41, 23); g.quadraticCurveTo(41, 41, 23, 41); g.stroke(); }
      else if (G.mark === 'dot') { g.arc(32, 32, 5, 0, 7); g.fill(); }
      else if (G.mark === 'cross') { g.moveTo(32, 23); g.lineTo(32, 41); g.moveTo(23, 32); g.lineTo(41, 32); g.stroke(); }
    }
    L.sprites[id] = c; return c;
  }

  // ---------- art: window frame ----------
  function outline(g) {
    const wd = WINDOWS[S.shapeIdx], cs = L.cs, bx = L.bx, by = L.by;
    g.beginPath();
    if (wd.kind === 'lancet') {
      const l = bx, r = bx + 7 * cs, b = by + 9 * cs, s = by + 2 * cs, cx = bx + 3.5 * cs, ap = by - 0.78 * cs;
      g.moveTo(l, b); g.lineTo(l, s);
      g.bezierCurveTo(l, s - 1.6 * cs, cx - 1.9 * cs, ap + 0.45 * cs, cx, ap);
      g.bezierCurveTo(cx + 1.9 * cs, ap + 0.45 * cs, r, s - 1.6 * cs, r, s);
      g.lineTo(r, b); g.closePath();
    } else if (wd.kind === 'twin') {
      const l = bx, r = bx + 8 * cs, b = by + 8 * cs, s = by + cs, m = bx + 4 * cs, ap = by - 0.62 * cs;
      const arch = (a, z) => { const cx = (a + z) / 2; g.bezierCurveTo(a, s - 1.05 * cs, cx - 1.2 * cs, ap + 0.3 * cs, cx, ap); g.bezierCurveTo(cx + 1.2 * cs, ap + 0.3 * cs, z, s - 1.05 * cs, z, s); };
      g.moveTo(l, b); g.lineTo(l, s); arch(l, m); arch(m, r); g.lineTo(r, b); g.closePath();
    } else {
      g.arc(bx + 4.5 * cs, by + 4.5 * cs, 5.16 * cs, 0, Math.PI * 2);
    }
  }
  function buildFrame() {
    const pad = 34, E = L.ext;

        ctx.fillStyle = LEAD; ctx.fillRect(cx - s - 2, cy - s - 2, 2 * s + 4, 2 * s + 4);
        ctx.drawImage(sprite('amethyst', 1), cx - s, cy - s, 2 * s, 2 * s);
        ctx.strokeStyle = '#f4eee0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx - s * 0.7, cy - s * 0.8); ctx.lineTo(cx - s * 0.05, cy - s * 0.1); ctx.lineTo(cx + s * 0.25, cy + s * 0.3); ctx.lineTo(cx + s * 0.8, cy + s * 0.7); ctx.moveTo(cx - s * 0.05, cy - s * 0.1); ctx.lineTo(cx + s * 0.7, cy - s * 0.5); ctx.stroke();
        name = 'Remove a card'; desc = 'Break down a pane you do not want';
      }
      const nl = wrap(name, r.w - 14, 13);
      nl.slice(0, 2).forEach((s, j) => txt(s, r.w / 2, r.h - 30 + j * 15 - (nl.length > 1 ? 7 : 0), 13, INK, 'center', 700));
      ctx.restore();
      ctx.save(); ctx.globalAlpha = a * fade * clamp(pop * 2, 0, 1);
      wrap(desc, r.w + 4, 12).slice(0, 3).forEach((s, j) => txt(s, r.x + r.w / 2, r.y + r.h + 22 + j * 15, 12, MUTED, 'center', 500, 0, true));
      ctx.restore();
    });
    const k = keepRect();
    ctx.globalAlpha = a * (S.chosen >= 0 && S.chosen !== 9 ? 0.4 : 1);
    ctx.fillStyle = '#2c2833'; rr(k.x, k.y, k.w, k.h, 24); ctx.fill();
    ctx.strokeStyle = '#3c3744'; ctx.lineWidth = 2; rr(k.x + 3, k.y + 3, k.w - 6, k.h - 6, 21); ctx.stroke();
    txt('KEEP MY DECK', W / 2, k.y + 30, 14, '#efe7d6', 'center', 600, 0.18);
    ctx.globalAlpha = a;
    txt('Next: Window ' + roman(S.n + 1) + ' · ' + WINDOWS[S.n % 3].name + ' · ' + fmt(Math.round(160 * Math.pow(1.3, S.n) / 10) * 10) + ' light', W / 2, k.y + k.h + 34, 13, MUTED, 'center', 500, 0, true);
    ctx.restore();
  }
  function drawRemove() {
    stoneScreen(1);
    txt('REMOVE A CARD', W / 2, L.st + 74, Math.min(26, W / 15), INK, 'center', 600, 0.18);
    txt('Tap a pane to break it down. Tap elsewhere to go back.', W / 2, L.st + 102, 13, MUTED, 'center', 500, 0, true);
    txt(S.deck.length + ' panes in your deck', W / 2, L.st + 130, 12, MUTED, 'center', 600, 0.1);
    for (const r of remRects()) cardSlab(r.card, r, false);
  }
  function drawSheet() {
    ctx.fillStyle = 'rgba(36,33,43,.96)'; ctx.fillRect(0, 0, W, H);
    let y = L.st + 76;
    txt('YOUR DECK · ' + S.deck.length + ' PANES', W / 2, y, 20, '#efe7d6', 'center', 600, 0.16);
    const sec = (label, list) => {
      y += 34; txt(label + ' (' + list.length + ')', W / 2, y, 12, '#b9ad98', 'center', 600, 0.2); y += 12;
      const rects = gridRects(list, y);
      for (const r of rects) cardSlab(r.card, r, false);
      if (rects.length) y = rects[rects.length - 1].y + rects[rects.length - 1].h; else y += 6;
    };
    sec('ON THE BENCH', S.hand.filter(Boolean));
    sec('TO DRAW', S.draw.slice().reverse());
    sec('SET ASIDE', S.discard);
    txt('Tap anywhere to close', W / 2, Math.min(H - L.sb - 24, y + 40), 14, '#b9ad98', 'center', 500, 0, true);
  }
  function drawTitle() {
    const ts = Math.min(34, (W - 40) / 10.2), a = clamp(S.t / 0.6, 0, 1);
    ctx.globalAlpha = a;
    txt('GLASSWRIGHT', W / 2, L.topY + 78, ts, INK, 'center', 600, 0.18);
    txt('Draft your panes. Fill the window.', W / 2, L.topY + 104, 15, MUTED, 'center', 500, 0, true);
    ctx.globalAlpha = 1;
    const y = L.trayY + 24;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(S.t * 3.5);
    txt('Tap to begin', W / 2, y + 12, 22, INK, 'center', 600, 0.06);
    ctx.globalAlpha = 1;
    const best = kit.best(), bw = getBW();
    if (best > 0) {
      txt('BEST LIGHT  ' + fmt(best) + '   ·   BEST WINDOW  ' + roman(Math.max(1, bw)), W / 2, y + 46, 12, MUTED, 'center', 600, 0.12);
    } else txt('Fill rows and columns with glass to let the light in', W / 2, y + 46, 13, MUTED, 'center', 500, 0, true);
  }
  function drawOver() {
    const k = clamp(S.ot / 0.35, 0, 1), e = easeBack(k);
    ctx.fillStyle = 'rgba(36,33,43,' + 0.35 * k + ')'; ctx.fillRect(0, 0, W, H);
    const cw = Math.min(320, W - 40), ch = 300, cx = (W - cw) / 2, cy = H * 0.5 - ch / 2 - 20;
    ctx.save(); ctx.globalAlpha = k; ctx.translate(W / 2, cy + ch / 2); ctx.scale(0.9 + 0.1 * e, 0.9 + 0.1 * e); ctx.translate(-W / 2, -(cy + ch / 2));
    plaque(cx, cy, cw, ch);
    txt('THE LIGHT FADES', W / 2, cy + 50, Math.min(22, cw / 13), INK, 'center', 600, 0.18);
    txt(S.cause === 'jam' ? 'Nothing on the bench would fit.' : 'The cuts ran out before the window was lit.', W / 2, cy + 76, 13, MUTED, 'center', 500, 0, true);
    txt('WINDOW', W / 2, cy + 112, 11, MUTED, 'center', 600, 0.22);
    txt(roman(S.n), W / 2, cy + 148, 36, RUBY, 'center', 600, 0.12);
    txt(fmt(S.total) + ' light', W / 2, cy + 184, 20, INK, 'center', 600);
    if (S.newBest) { ctx.fillStyle = GOLD; rr(W / 2 - 44, cy + 194, 88, 20, 10); ctx.fill(); txt('NEW BEST', W / 2, cy + 208, 10, INK, 'center', 700, 0.2); }
    txt('BEST ' + fmt(kit.best()) + '  ·  BEST WINDOW ' + roman(Math.max(1, getBW())), W / 2, cy + 236, 11, MUTED, 'center', 600, 0.12);
    if (S.ot > 0.35) { ctx.globalAlpha = k * (0.6 + 0.4 * Math.sin(S.ot * 4)); txt('Tap to begin a new window', W / 2, cy + 272, 16, INK, 'center', 600, 0, true); }
    ctx.restore();
  }

  function draw() {
    ctx.drawImage(L.backdrop, 0, 0, W, H);
    const inWorkshop = S.mode === 'play' && (S.phase === 'workshop' || S.phase === 'remove');
    if (!inWorkshop || S.pt < 0.25) {
      ctx.save();
      if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
      drawBoard();
      if (S.mode === 'title') drawTitleSweep();
      ctx.restore();
      drawDust();
      if (S.mode === 'title') drawTitle();
      else {
        drawTopBar();
        drawTray();
        drawRays();
        drawFx();
        drawDrag();
        drawBanner();
        drawHint();
      }
    }
    if (inWorkshop) { if (S.phase === 'workshop') drawWorkshop(); else drawRemove(); drawFx(); }
    if (S.sheet && S.mode === 'play') drawSheet();
    if (S.mode === 'over') drawOver();
    if (S.mode === 'paused') {
      ctx.fillStyle = 'rgba(36,33,43,.6)'; ctx.fillRect(0, 0, W, H);
      txt('PAUSED', W / 2, H / 2 - 6, 26, '#efe7d6', 'center', 600, 0.2);
      txt('Tap to carry on', W / 2, H / 2 + 24, 15, '#cfc4ad', 'center', 500, 0, true);
    }
  }

  // ---------- loop ----------
  ctx = kit.fitCanvas(cv, (s) => { W = s.w; H = s.h; DPR = s.dpr; layout(); });
  enterTitle();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
    if (S.mode !== 'paused') update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // test hook for scripts/playtest.mjs and scripts/shoot.mjs (the workshop reports as "play")
  window.__game = {
    state: () => ({ mode: S.mode, score: Math.round(S.total), window: S.n, cuts: S.cuts, target: S.target, light: S.light, phase: S.phase }),
    demo: (on) => { S.demo = !!on; S.demoT = 0.4; if (!on && drag && drag.demo) { drag = null; S.ghost = null; S.dm = null; } },
    dbg: () => ({ deck: S.deck.length, owned: [...S.owned], hand: S.hand.map((k) => k && cardName(k)), draw: S.draw.length, discard: S.discard.length, sweeps: S.sweeps, jam: S.jamHint })
  };
})();
</script>
