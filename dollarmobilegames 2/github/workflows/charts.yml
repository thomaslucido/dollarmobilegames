name: Nightly chart snapshot
# Every evening at ~7:13pm Detroit time: save Apple's US top Games charts to data/trends/.
on:
  schedule:
    - cron: "13 23 * * *"   # 7:13pm EDT
    - cron: "13 0 * * *"    # 7:13pm EST
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: repo-writes, cancel-in-progress: false }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Only run at 7pm Detroit time
        id: clock
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/Detroit date +%H)" = "19" ]; then echo "go=true" >> $GITHUB_OUTPUT; else echo "go=false" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.clock.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.clock.outputs.go == 'true'
        with: { node-version: 22 }
      - name: Snapshot charts
        if: steps.clock.outputs.go == 'true'
        run: node scripts/snapshot-charts.mjs
      - name: Commit
        if: steps.clock.outputs.go == 'true'
        run: |
          git config user.name "dollar-arcade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trends
          git diff --cached --quiet && exit 0
          git commit -m "Chart snapshot $(TZ=America/Detroit date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
