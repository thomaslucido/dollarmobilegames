<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lantern Drift</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#141a33;touch-action:none;-webkit-user-select:none;user-select:none;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../../shared/game-kit.js"></script>
<script>
(function () {
  const kit = GameKit.init({ slug: 'lantern-drift' });
  const cv = document.getElementById('c');
  let W = 0, H = 0, ctx = null;

  // ---------- state ----------
  const S = { mode: 'title', cause: '', t: 0, dist: 0, flies: 0, score: 0, best: kit.best(), speed: 150, newBest: false, shake: 0 };
  const L = { x: 0, y: 0, vy: 0, flame: 1, r: 16 };
  let holding = false, autopilot = false, branches = [], fireflies = [], sparks = [], stars = [], hills = [];
  let nextBranch = 0, nextFly = 0;

  function buildStars() {
    stars = []; for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * W, y: Math.random() * H * 0.75, r: Math.random() * 1.4 + 0.3, p: Math.random() * 6 });
    hills = []; for (let i = 0; i < 8; i++) hills.push({ x: i * W / 4, h: 40 + Math.random() * 60 });
  }

  ctx = kit.fitCanvas(cv, (s) => { W = s.w; H = s.h; buildStars(); });

  function reset() {
    L.x = W * 0.3; L.y = H * 0.45; L.vy = 0; L.flame = 1;
    branches = []; fireflies = []; sparks = [];
    S.t = 0; S.dist = 0; S.flies = 0; S.score = 0; S.speed = 150; S.newBest = false;
    nextBranch = 0.8; nextFly = 0.4;
  }
  reset();

  // ---------- input ----------
  const down = (e) => {
    e.preventDefault();
    if (S.mode === 'title') { S.mode = 'play'; reset(); kit.buzz(); }
    else if (S.mode === 'over') { if (S.t > 0.6) { S.mode = 'play'; reset(); kit.buzz(); } }
    holding = true;
  };
  const up = () => { holding = false; };
  cv.addEventListener('pointerdown', down);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  kit.onPause(() => { if (S.mode === 'play') S.mode = 'paused'; holding = false; });
  kit.onResume(() => { if (S.mode === 'paused') S.mode = 'play'; });

  // ---------- spawning ----------
  function spawnBranch() {
    const gap = Math.max(150, 240 - S.dist / 40);
    const minY = 110, maxY = H - 140 - gap;
    const top = minY + Math.random() * Math.max(10, maxY - minY);
    branches.push({ x: W + 40, top, gap, w: 26, sway: Math.random() * 6, passed: false });
  }
  function spawnFly() {
    fireflies.push({ x: W + 20, y: 120 + Math.random() * (H - 280), p: Math.random() * 6, got: false });
  }
  function burst(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 140;
      sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.5, col });
    }
  }

  function die(cause) {
    S.cause = cause || 'snag'; S.mode = 'over'; S.t = 0; S.shake = 14; kit.buzz('heavy');
    GameKit.sound(140, 0.35, 'sawtooth', 0.06);
    burst(L.x, L.y, '#ffb35c', 40);
    S.newBest = kit.saveBest(S.score); S.best = kit.best();
  }

  // ---------- update ----------
  function update(dt) {
    S.t += dt;
    for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 160 * dt; s.life -= dt; }
    sparks = sparks.filter((s) => s.life > 0);
    S.shake = Math.max(0, S.shake - 40 * dt);
    if (S.mode !== 'play') { if (S.mode === 'title') { L.y = H * 0.45 + Math.sin(S.t * 2) * 10; } return; }

    if (autopilot) { // screenshot demo: aim for the next gap or firefly
      const b = branches.find((x) => x.x + x.w > L.x - 10);
      const f = fireflies.find((x) => x.x > L.x && x.x < L.x + 160);
      const target = b && b.x - L.x < 340 ? b.top + b.gap / 2 : (f ? f.y : H * 0.45);
      holding = (L.y - target) + 0.3 * L.vy > 0;
    }
    S.speed = 150 + Math.min(170, S.dist / 25);
    S.dist += S.speed * dt;

    const lift = holding && L.flame > 0 ? -900 : 0;
    const ease = Math.min(1, 0.25 + S.t / 1.5); // gentle gravity for the first moments
    L.vy += (620 * ease + lift) * dt;
    L.vy = Math.max(-360, Math.min(420, L.vy));
    L.y += L.vy * dt;

    // flame burns faster while holding, and faster the further you go
    L.flame -= dt * ((holding ? 0.075 : 0.03) + S.dist / 400000);
    if (L.flame <= 0) { L.flame = 0; }

    nextBranch -= dt; nextFly -= dt;
    if (nextBranch <= 0) { spawnBranch(); nextBranch = Math.max(0.95, 1.7 - S.dist / 9000) * (150 / S.speed) * 1.6; }
    if (nextFly <= 0) { spawnFly(); nextFly = 0.7 + Math.random() * 0.9; }

    for (const b of branches) {
      b.x -= S.speed * dt;
      if (!b.passed && b.x + b.w < L.x) { b.passed = true; S.score += 1; GameKit.sound(660, 0.06, 'triangle', 0.04); }
      const inX = L.x + L.r * 0.7 > b.x && L.x - L.r * 0.7 < b.x + b.w;
      if (inX && (L.y - L.r * 0.8 < b.top || L.y + L.r * 0.8 > b.top + b.gap)) return die('snag');
    }
    branches = branches.filter((b) => b.x > -60);

    for (const f of fireflies) {
      f.x -= S.speed * 0.85 * dt; f.p += dt * 4;
      const fy = f.y + Math.sin(f.p) * 8;
      if (!f.got && Math.hypot(f.x - L.x, fy - L.y) < L.r + 14) {
        f.got = true; S.flies++; S.score += 3; L.flame = Math.min(1, L.flame + 0.22);
        burst(f.x, fy, '#f8f39a', 12); kit.buzz(); GameKit.sound(880 + Math.random() * 220, 0.08, 'sine', 0.05);
      }
    }
    fireflies = fireflies.filter((f) => f.x > -20 && !f.got);

    if (L.y > H - 70) return die('water');
    if (L.y < 40) { L.y = 40; L.vy = Math.max(0, L.vy); }
  }

  // ---------- draw ----------
  function draw() {
    const sx = (Math.random() - 0.5) * S.shake, sy = (Math.random() - 0.5) * S.shake;
    ctx.save(); ctx.translate(sx, sy);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0d1230'); g.addColorStop(0.6, '#2a2457'); g.addColorStop(1, '#5a3a62');
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

    for (const s of stars) { ctx.globalAlpha = 0.4 + 0.4 * Math.sin(S.t * 1.5 + s.p); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;

    // moon
    ctx.fillStyle = '#fbe9c4'; ctx.beginPath(); ctx.arc(W * 0.8, H * 0.16, 34, 0, 7); ctx.fill();
    ctx.fillStyle = '#2a2457'; ctx.beginPath(); ctx.arc(W * 0.8 + 14, H * 0.16 - 8, 30, 0, 7); ctx.fill();

    // far hills (parallax)
    const off = (S.dist * 0.2) % (W / 4);
    ctx.fillStyle = '#231c42';
    ctx.beginPath(); ctx.moveTo(-10, H);
    for (let i = 0; i < hills.length + 2; i++) { const hx = i * W / 4 - off; const hh = hills[i % hills.length].h; ctx.quadraticCurveTo(hx + W / 8, H - 60 - hh, hx + W / 4, H - 60); }
    ctx.lineTo(W + 10, H); ctx.fill();

    // water
    ctx.fillStyle = '#1a1838'; ctx.fillRect(0, H - 62, W, 62);
    ctx.strokeStyle = 'rgba(255,200,140,.18)'; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) { const wy = H - 50 + i * 9; const wx = ((S.t * 30 + i * 70) % (W + 80)) - 40; ctx.beginPath(); ctx.moveTo(W - wx, wy); ctx.lineTo(W - wx + 26, wy); ctx.stroke(); }

    // branches: willow strands hanging from top, reeds rising from bottom
    for (const b of branches) {
      ctx.fillStyle = '#0b0f22';
      roundRect(b.x, -10, b.w, b.top + 10, 10); ctx.fill();
      roundRect(b.x, b.top + b.gap, b.w, H - b.top - b.gap, 10); ctx.fill();
      ctx.strokeStyle = '#3f6b5a'; ctx.lineWidth = 3;
      for (let k = 0; k < 4; k++) {
        const lx = b.x + 4 + k * 6, sw = Math.sin(S.t * 2 + b.sway + k) * 4;
        ctx.beginPath(); ctx.moveTo(lx, b.top - 4); ctx.quadraticCurveTo(lx + sw, b.top + 10, lx + sw * 1.5, b.top + 18 + k * 3); ctx.stroke();
      }
    }

    // fireflies
    for (const f of fireflies) {
      const fy = f.y + Math.sin(f.p) * 8;
      const rg = ctx.createRadialGradient(f.x, fy, 0, f.x, fy, 16);
      rg.addColorStop(0, 'rgba(250,245,160,.95)'); rg.addColorStop(1, 'rgba(250,245,160,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(f.x, fy, 16, 0, 7); ctx.fill();
    }

    // lantern
    if (S.mode !== 'over') drawLantern();

    for (const s of sparks) { ctx.globalAlpha = Math.max(0, s.life); ctx.fillStyle = s.col; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    ctx.restore();
    hud();
  }

  function drawLantern() {
    const fl = L.flame, tilt = Math.max(-0.35, Math.min(0.35, L.vy / 900));
    const glow = 40 + 50 * fl;
    const rg = ctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, glow);
    rg.addColorStop(0, 'rgba(255,170,80,' + (0.45 * fl + 0.05) + ')'); rg.addColorStop(1, 'rgba(255,170,80,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(L.x, L.y, glow, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(L.x, L.y); ctx.rotate(tilt);
    ctx.fillStyle = fl > 0 ? '#f2a65a' : '#7d5a48';
    ctx.beginPath(); ctx.moveTo(-14, -16); ctx.quadraticCurveTo(-20, 0, -11, 17); ctx.lineTo(11, 17); ctx.quadraticCurveTo(20, 0, 14, -16); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(120,50,20,.45)'; ctx.lineWidth = 1.5;
    for (const lx of [-6, 0, 6]) { ctx.beginPath(); ctx.moveTo(lx, -16); ctx.lineTo(lx * 0.9, 17); ctx.stroke(); }
    ctx.fillStyle = '#5b3a2a'; ctx.fillRect(-12, -19, 24, 4); ctx.fillRect(-10, 16, 20, 4);
    if (fl > 0) { ctx.fillStyle = '#fff4c2'; ctx.beginPath(); ctx.ellipse(0, 6, 3 + 2 * fl, 5 + 4 * fl, 0, 0, 7); ctx.fill(); }
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function text(t, x, y, size, col, align, weight) {
    ctx.font = (weight || 700) + ' ' + size + 'px ui-rounded,"SF Pro Rounded",system-ui,sans-serif';
    ctx.textAlign = align || 'center'; ctx.fillStyle = col || '#fff'; ctx.fillText(t, x, y);
  }

  function hud() {
    const top = 64;
    if (S.mode === 'play' || S.mode === 'paused') {
      text(String(S.score), W / 2, top + 26, 40, '#fff4dd');
      // flame meter
      const mw = Math.min(160, W * 0.4), mx = W - mw - 16, my = top - 30;
      ctx.fillStyle = 'rgba(0,0,0,.3)'; roundRect(mx, my, mw, 10, 5); ctx.fill();
      ctx.fillStyle = L.flame > 0.25 ? '#f2a65a' : '#ff6b5c'; roundRect(mx, my, Math.max(6, mw * L.flame), 10, 5); ctx.fill();
      if (S.mode === 'paused') text('Paused', W / 2, H / 2, 30, '#fff');
    }
    if (S.mode === 'title') {
      text('Lantern Drift', W / 2, H * 0.27, 44, '#fff4dd', 'center', 800);
      text('Hold to rise. Let go to fall.', W / 2, H * 0.27 + 40, 17, '#e8d7ff', 'center', 500);
      text('Catch fireflies to keep your flame alive.', W / 2, H * 0.27 + 64, 15, '#cbb8ec', 'center', 500);
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(S.t * 4); text('Tap to start', W / 2, H * 0.72, 22, '#ffd9a8'); ctx.globalAlpha = 1;
      if (S.best) text('Best ' + S.best, W / 2, H * 0.72 + 34, 15, '#cbb8ec', 'center', 500);
    }
    if (S.mode === 'over') {
      const cw = Math.min(300, W - 48), ch = 210, cx = (W - cw) / 2, cy = H * 0.3;
      ctx.fillStyle = 'rgba(14,12,34,.82)'; roundRect(cx, cy, cw, ch, 22); ctx.fill();
      text(L.flame <= 0 ? 'Your flame went out' : (S.cause === 'water' ? 'Splash!' : 'Snagged!'), W / 2, cy + 44, 24, '#ffd9a8', 'center', 800);
      text(String(S.score), W / 2, cy + 104, 52, '#fff4dd', 'center', 800);
      text(S.newBest ? 'New best!' : 'Best ' + S.best, W / 2, cy + 136, 16, S.newBest ? '#f8f39a' : '#cbb8ec', 'center', 600);
      text(S.flies + ' fireflies', W / 2, cy + 160, 14, '#a99ccc', 'center', 500);
      if (S.t > 0.6) text('Tap to fly again', W / 2, cy + ch - 18, 17, '#fff');
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // test hook used by scripts/playtest.mjs
  window.__game = { state: () => ({ mode: S.mode, score: S.score }), demo: (on) => { autopilot = !!on; } };
})();
</script>
</body>
</html>
